<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>世界遺産クエスト｜研究センター</title>
<style>
:root{--ink:#1d2940;--muted:#68768b;--navy:#172238;--gold:#e3b53c;--bg:#e9edf2;--line:#c6cfdb;--nature:#5f9270;--culture:#b98458;--floor:#d2bc96;--wall:#d8e3d6;--cell:42px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;user-select:none}button{font:inherit;touch-action:manipulation}.game{height:100%;display:grid;grid-template-rows:auto 1fr auto}.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:9px 12px}.hudTitle{display:flex;align-items:center;gap:8px;min-width:0}.hudTitle b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{background:var(--nature);color:#fff;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:1000;white-space:nowrap}.pill.cultural{background:var(--culture)}.hudHint{font-size:10px;font-weight:900;color:#68768b;white-space:nowrap}.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 190px}.roomWrap{position:relative;display:grid;place-items:center;min-width:0;overflow:hidden;background:#e9edf2}.room{display:grid;position:relative;image-rendering:pixelated;box-shadow:0 9px 24px rgba(40,52,69,.18)}.cell{width:var(--cell);height:var(--cell);position:relative;display:grid;place-items:center}.wall{background:var(--wall);border:1px solid #bfc8c2}.floor{background:var(--floor);border:1px solid #c3a87e}.exit{background:#a7b6c2;border:2px solid #62758a}.exit:after{content:'出';font-size:10px;color:#fff;font-weight:1000}.obj{width:82%;height:82%;display:grid;place-items:center;border:2px solid #596678;background:#f6f1e6;border-radius:5px;position:relative;font-size:12px;font-weight:1000}.obj.display{background:#dce8dc}.obj.book{background:#d8bd88}.obj.quiz{background:#e6d9ef}.obj.researcher{background:#eef2f5}.obj .status{position:absolute;right:-7px;top:-8px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;font-style:normal;font-size:11px;font-weight:1000;z-index:3}.obj .status.pending{background:#e14747;color:#fff}.obj .status.done{background:var(--gold);color:#26354b}.player{position:absolute;width:70%;height:70%;background:#3157a3;border:2px solid #243b69;z-index:7;box-shadow:0 -7px 0 -4px #f1c49e}.side{background:rgba(255,255,255,.94);border-left:1px solid #cbd4de;display:grid;grid-template-rows:auto 1fr auto;align-items:center;gap:10px;padding:12px}.actionBox{display:grid;gap:4px;width:100%}.action{width:100%;min-height:58px;border:2px solid var(--gold);border-radius:13px;background:var(--navy);color:#fff;font-size:14px;font-weight:1000;box-shadow:0 5px 14px #0002}.action:disabled{opacity:.4;background:#667387;border-color:#9ea9b7}.targetName{min-height:16px;text-align:center;font-size:9px;color:#65748a;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.joy{position:relative;width:142px;height:142px;margin:auto;border-radius:50%;background:radial-gradient(circle,#e3ebf4 0 30%,#263a59 31% 34%,#18263e 35% 100%);border:2px solid #879bb8;touch-action:none}.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(#edf3fa,#bac9dc);border:2px solid #fff;box-shadow:0 2px 5px #0005}.mark{position:absolute;color:#dce6f4;font-weight:1000}.u{top:7px;left:50%;transform:translateX(-50%)}.d{bottom:7px;left:50%;transform:translateX(-50%)}.l{left:8px;top:50%;transform:translateY(-50%)}.r{right:8px;top:50%;transform:translateY(-50%)}.hint{text-align:center;font-size:9px;color:#617087;font-weight:900;line-height:1.5}.message{background:#fff9e8;border-top:1px solid #dccb95;padding:10px 14px;min-height:72px;display:grid;align-content:center}.message b{font-size:11px}.message p{font-size:12px;line-height:1.5;font-weight:800;margin:3px 0 0}
.modal{position:fixed;inset:0;z-index:80;background:rgba(22,31,45,.58);display:none;place-items:center;padding:20px}.modal.show{display:grid}.card{width:min(820px,92vw);max-height:88vh;overflow:auto;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:18px;box-shadow:0 16px 46px #0005}.cardHead{display:flex;justify-content:space-between;gap:10px;align-items:start}.cardHead small{font-size:10px;color:#7b6750;font-weight:1000}.cardHead h2{font-size:22px;margin:3px 0 9px}.close{border:1px solid #b9c4d1;background:#fff;color:#34445b;border-radius:10px;min-width:76px;min-height:42px;font-weight:1000}.bodyText{font-size:16px;line-height:1.65;font-weight:800;margin:8px 0}.year{display:inline-block;background:#263d60;color:#fff;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:1000;margin:4px 0 10px}.criteria{display:flex;gap:7px;flex-wrap:wrap}.criterion{background:#f3f6fa;border:1px solid #c9d3df;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:1000}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.photo{background:#e6ebef;border:1px solid #c6d0da;border-radius:10px;overflow:hidden;min-width:0}.photo img{display:block;width:100%;height:180px;object-fit:cover}.photo small{display:block;padding:5px 7px;font-size:8px;line-height:1.3;color:#667387;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quizCard{width:min(760px,92vw)}.quizStep{font-size:10px;color:#6c788a;font-weight:1000}.question{font-size:21px;line-height:1.45;font-weight:1000;margin:8px 0 13px}.choices{display:grid;gap:8px}.choice{width:100%;text-align:left;border:2px solid #c8d2de;background:#fff;color:#263951;border-radius:11px;padding:12px 14px;font-size:14px;font-weight:900}.choice:disabled{opacity:1}.choice.correct{border-color:#5a9d6b;background:#eef9f1}.choice.wrong{border-color:#cf7278;background:#fff2f2}.feedback{display:none;margin-top:12px;border-radius:11px;padding:11px 13px;background:#f4f7fa;font-size:13px;line-height:1.55;font-weight:800}.feedback.show{display:block}.feedback b{display:block;font-size:16px;margin-bottom:3px}.next{display:none;margin:12px 0 0 auto;min-width:110px;min-height:45px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:1000}.next.show{display:block}.result{text-align:center;padding:15px 5px}.result strong{display:block;font-size:30px;margin:8px}.resultActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.resultActions button{min-height:48px;border-radius:10px;font-weight:1000}.again{border:1px solid #bdc7d2;background:#fff;color:#30405a}.finish{border:0;background:var(--navy);color:#fff}.loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#e9edf2;font-size:13px;font-weight:1000;color:#526177}.loading.hide{display:none}
@media(max-width:1050px) and (orientation:landscape){:root{--cell:36px}.main{grid-template-columns:minmax(0,1fr) 168px}.joy{width:126px;height:126px}.photo img{height:145px}.card{max-height:90vh}.bodyText{font-size:14px}.question{font-size:18px}}
</style>
</head>
<body>
<div class="game">
<header class="hud"><div class="hudTitle"><b id="title">研究センター</b><span id="typePill" class="pill">自然遺産</span></div><div class="hudHint">好きな順で調べよう</div></header>
<main class="main"><section class="roomWrap"><div id="room" class="room"></div></section><aside class="side"><div class="actionBox"><button id="action" class="action" type="button" disabled>アクション</button><div id="targetName" class="targetName">対象に近づこう</div></div><div id="joy" class="joy"><span class="mark u">▲</span><span class="mark d">▼</span><span class="mark l">◀</span><span class="mark r">▶</span><div id="knob" class="knob"></div></div><div class="hint">矢印キー / スティック<br>何も見なくても出口から出られます</div></aside></main>
<footer id="message" class="message"><b>研究センター</b><p>本棚・展示・調査員・腕試しを、好きな順で体験してみよう。</p></footer>
</div>
<div id="infoModal" class="modal" role="dialog" aria-modal="true"><div class="card"><div class="cardHead"><div><small id="infoKind"></small><h2 id="infoTitle"></h2></div><button id="infoClose" class="close" type="button">閉じる</button></div><div id="infoBody"></div></div></div>
<div id="quizModal" class="modal" role="dialog" aria-modal="true"><div class="card quizCard"><div id="quizBody"></div></div></div>
<div id="loading" class="loading">研究センターを準備しています…</div>
<script src="beta-save.js"></script>
<script>
(()=>{'use strict';
const siteId=sessionStorage.getItem('whqActiveHeritageId')||'shiretoko',siteNo=Number(sessionStorage.getItem('whqActiveHeritageNo')||13),siteName=sessionStorage.getItem('whqActiveHeritageName')||'知床',siteType=sessionStorage.getItem('whqActiveHeritageType')||'自然';
const rows=['#############','#B.........D#','#...........#','#.....R.....#','#...........#','#....Q......#','#...........#','######E######'];
const meta={B:{id:'book',label:'本棚',action:'しらべる',icon:'本'},R:{id:'researcher',label:'調査員',action:'はなす',icon:'調'},D:{id:'display',label:'展示',action:'みる',icon:'展'},Q:{id:'quiz',label:'腕試し',action:'ちょうせん',icon:'腕'}};
let player={x:6,y:6},target=null,pid=null,timer=null,dir=null,content=null,criteriaLabels={},imageSite=null,quizIndex=0,quizScore=0,quizAnswered=false,quizQuestions=[];
const room=document.getElementById('room'),action=document.getElementById('action'),targetName=document.getElementById('targetName'),message=document.getElementById('message'),joy=document.getElementById('joy'),knob=document.getElementById('knob');
document.getElementById('title').textContent=`${siteName} 研究センター`;document.getElementById('typePill').textContent=siteType+'遺産';document.getElementById('typePill').classList.toggle('cultural',siteType==='文化');
function state(){return window.WHQBetaSave.centerState(siteId)}
function setDone(id){window.WHQBetaSave.setCenterState(siteId,{[id]:true})}
function setMsg(title,text){message.innerHTML=`<b>${escapeHtml(title)}</b><p>${escapeHtml(text)}</p>`}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}
function tileChar(x,y){return rows[y]?.[x]||'#'}function blocked(x,y){return '#BDRQE'.includes(tileChar(x,y))}
function render(){const h=rows.length,w=rows[0].length,done=state();room.innerHTML='';room.style.gridTemplateColumns=`repeat(${w},var(--cell))`;room.style.gridTemplateRows=`repeat(${h},var(--cell))`;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=rows[y][x],cell=document.createElement('div');cell.className='cell '+(c==='#'?'wall':c==='E'?'exit':'floor');if(meta[c]){const m=meta[c],o=document.createElement('div');o.className=`obj ${m.id}`;o.textContent=m.icon;const st=document.createElement('i');st.className='status '+(done[m.id]?'done':'pending');st.textContent=done[m.id]?'✓':'!';o.appendChild(st);cell.appendChild(o)}if(x===player.x&&y===player.y){const p=document.createElement('div');p.className='player';cell.appendChild(p)}room.appendChild(cell)}findTarget()}
function findTarget(){target=null;for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){const c=tileChar(player.x+dx,player.y+dy);if(meta[c]){target={type:'object',...meta[c]};break}if(c==='E'){target={type:'exit',label:'出口',action:'でる'};break}}action.disabled=!target;action.textContent=target?.action||'アクション';targetName.textContent=target?.label||'対象に近づこう'}
function move(dx,dy){const nx=player.x+dx,ny=player.y+dy;if(blocked(nx,ny))return;player={x:nx,y:ny};render()}
function criteriaText(){return(content?.criteria||[]).map(n=>criteriaLabels[String(n)]||`基準${n}`)}
function openInfo(kind,title,html){document.getElementById('infoKind').textContent=kind;document.getElementById('infoTitle').textContent=title;document.getElementById('infoBody').innerHTML=html;document.getElementById('infoModal').classList.add('show')}
function book(){setDone('book');render();const labels=criteriaText();openInfo('本棚',`${siteName}の登録情報`,`<span class="year">${content?.year||'—'}年に世界遺産登録</span><div class="criteria">${labels.map(x=>`<span class="criterion">${escapeHtml(x)}</span>`).join('')}</div>`);setMsg('本棚',`${siteName}の登録年と登録基準を確認した。`)}
function researcher(){setDone('researcher');render();openInfo('調査員',`${siteName}の背景`,`<p class="bodyText">${escapeHtml(content?.researcher||`${siteName}について調査中だよ。`)}</p>`);setMsg('調査員',`${siteName}の歴史や背景について話を聞いた。`)}
function display(){setDone('display');render();const imgs=(imageSite?.images||[]).slice(0,3);openInfo('展示',`${siteName}の特徴`,`<p class="bodyText">${escapeHtml(content?.display||`${siteName}の特徴を展示しているよ。`)}</p><div class="photos">${imgs.map(img=>`<div class="photo"><img src="docs/assets/heritage/${siteId}/${encodeURIComponent(img.file)}" alt="${escapeHtml(siteName)}"><small>${escapeHtml(img.author||'Wikimedia Commons')} / ${escapeHtml(img.license||'')}</small></div>`).join('')}</div>`);setMsg('展示',`${siteName}の特徴と写真を見た。`)}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function startQuiz(){quizIndex=0;quizScore=0;quizAnswered=false;quizQuestions=(content?.quiz||[]).slice(0,3);document.getElementById('quizModal').classList.add('show');renderQuiz()}
function renderQuiz(){const box=document.getElementById('quizBody');if(!quizQuestions.length){box.innerHTML=`<div class="result"><strong>準備中</strong><p>この遺産の腕試し問題を読み込めませんでした。</p><div class="resultActions" style="grid-template-columns:1fr"><button class="finish" id="quizFinish">閉じる</button></div></div>`;document.getElementById('quizFinish').onclick=()=>document.getElementById('quizModal').classList.remove('show');return}if(quizIndex>=quizQuestions.length){setDone('quiz');render();box.innerHTML=`<div class="result"><span class="quizStep">腕試し終了！</span><strong>${quizQuestions.length}もん中${quizScore}もん正解！</strong><p>何度でも挑戦できるよ。</p><div class="resultActions"><button class="again" id="quizAgain">もう一度</button><button class="finish" id="quizFinish">閉じる</button></div></div>`;document.getElementById('quizAgain').onclick=startQuiz;document.getElementById('quizFinish').onclick=()=>{document.getElementById('quizModal').classList.remove('show');setMsg('腕試し',`${quizQuestions.length}問の腕試しを最後まで体験した。`)};return}quizAnswered=false;const q=quizQuestions[quizIndex],choices=shuffle(q.choices||[]);box.innerHTML=`<div class="quizStep">${quizIndex+1} / ${quizQuestions.length} もん</div><div class="question">${escapeHtml(q.q)}</div><div class="choices">${choices.map(c=>`<button class="choice" type="button" data-choice="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="nextQ" class="next" type="button">${quizIndex===quizQuestions.length-1?'結果へ':'つぎへ'}</button>`;box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerQuiz(b,q));document.getElementById('nextQ').onclick=()=>{quizIndex++;renderQuiz()}}
function answerQuiz(btn,q){if(quizAnswered)return;quizAnswered=true;const chosen=btn.dataset.choice,ok=chosen===q.answer;if(ok)quizScore++;document.querySelectorAll('#quizBody .choice').forEach(b=>{b.disabled=true;if(b.dataset.choice===q.answer)b.classList.add('correct');else if(b===btn&&!ok)b.classList.add('wrong')});const f=document.getElementById('feedback');f.innerHTML=`<b>${ok?'せいかい！':`おしい！ 正解は「${escapeHtml(q.answer)}」`}</b>${escapeHtml(q.explanation||'')}`;f.classList.add('show');document.getElementById('nextQ').classList.add('show')}
function interact(){if(!target)return;if(target.type==='exit'){if(window.parent!==window)window.parent.postMessage({type:'whqExitCenter',site:siteId,heritageId:siteNo},'*');else location.href='area-map-game.html';return}if(target.id==='book')book();else if(target.id==='researcher')researcher();else if(target.id==='display')display();else if(target.id==='quiz')startQuiz()}
action.addEventListener('click',interact);document.getElementById('infoClose').addEventListener('click',()=>document.getElementById('infoModal').classList.remove('show'));
window.addEventListener('keydown',e=>{if(document.querySelector('.modal.show'))return;const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(!d)return;e.preventDefault();move(...d)});
function direction(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;if(Math.hypot(dx,dy)<12)return null;return Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]}function place(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=40,dist=Math.hypot(dx,dy)||1,q=Math.min(1,m/dist);knob.style.transform=`translate(calc(-50% + ${dx*q}px),calc(-50% + ${dy*q}px))`}function stop(){pid=null;dir=null;clearInterval(timer);timer=null;knob.style.transform='translate(-50%,-50%)'}
joy.addEventListener('pointerdown',e=>{if(document.querySelector('.modal.show'))return;pid=e.pointerId;joy.setPointerCapture(pid);place(e);dir=direction(e);if(dir)move(...dir);timer=setInterval(()=>{if(dir)move(...dir)},180)});joy.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;place(e);dir=direction(e)});joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);
async function load(){try{const [cr,ir]=await Promise.all([fetch('data/beta-heritage-content.json',{cache:'no-store'}),fetch('data/heritage-images.json',{cache:'no-store'})]),cj=await cr.json(),ij=await ir.json();criteriaLabels=cj.criteriaLabels||{};content=(cj.sites||[]).find(s=>s.slug===siteId)||(cj.sites||[]).find(s=>Number(s.id)===siteNo)||null;imageSite=(ij.sites||[]).find(s=>s.id===siteId)||(ij.sites||[]).find(s=>s.nameJa===siteName)||null}catch(e){console.warn('beta center data unavailable',e)}render();document.getElementById('loading').classList.add('hide')}
render();load();
})();
</script>
</body>
</html>
