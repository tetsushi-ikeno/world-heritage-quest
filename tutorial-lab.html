<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>世界遺産クエスト TUTORIAL LAB</title>
<style>
:root{
  --ink:#1d2940;--muted:#66738a;--navy:#253149;--gold:#e5b841;--paper:#fffdf7;
  --home:#cfe8f4;--lab:#e8e9eb;--line:#c8ced8;--blue:#4777b7;--green:#5d9c6b;
  --shadow:0 10px 28px rgba(28,40,61,.14)
}
*{box-sizing:border-box}
body{margin:0;background:#eef2f6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,input{font:inherit}
button{touch-action:manipulation}
.wrap{max-width:1080px;margin:0 auto;padding:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}
.brand-mark{width:34px;height:30px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--gold);display:grid;place-items:end center;padding-bottom:4px;color:#2b3140;font-size:11px}
.lab-badge{font-size:12px;font-weight:900;color:#fff;background:var(--navy);border:2px solid var(--gold);border-radius:999px;padding:6px 10px;white-space:nowrap}
.restart{border:1px solid #b9c2cf;background:#fff;border-radius:10px;padding:7px 11px;font-weight:800;color:#344158;cursor:pointer}
.game{min-height:660px;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid #bac3d0;background:#fff;position:relative}
.scene{min-height:660px;padding:22px;display:flex;flex-direction:column;transition:background .35s ease}
.scene.home{background:linear-gradient(#c9e7f5 0 56%,#dec8a4 56% 100%)}
.scene.center{background:linear-gradient(#edf0f2 0 72%,#d6d9dd 72% 100%)}
.scene.world{background:linear-gradient(#e9f3fb,#f8fafc)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.place{font-size:13px;font-weight:900;letter-spacing:.04em;color:#526078;background:rgba(255,255,255,.76);padding:6px 10px;border-radius:999px}
.progress{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#aeb7c4}.dot.on{background:var(--gold);transform:scale(1.25)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:15px 0}
.room{width:min(880px,100%);height:330px;position:relative}
.tv{position:absolute;left:5%;top:10%;width:40%;height:48%;background:#1d2838;border:9px solid #48546b;border-radius:12px;box-shadow:0 8px 0 #6c5946}
.tv-screen{position:absolute;inset:10px;background:linear-gradient(135deg,#53687f,#25364b);color:white;padding:13px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden}
.tv-screen:before{content:"NEWS";position:absolute;left:10px;top:10px;background:#c13e46;border-radius:4px;padding:4px 7px;font-size:11px;font-weight:900}
.news-line{height:6px;background:rgba(255,255,255,.35);border-radius:99px;width:88%}.news-line.short{width:58%}
.desk{position:absolute;right:6%;bottom:7%;width:44%;height:72px;background:#9a744e;border-radius:10px 10px 4px 4px;box-shadow:0 18px 0 #7d5d41}
.book{position:absolute;right:16%;bottom:79px;width:95px;height:66px;background:#294f79;border-radius:5px;transform:rotate(-5deg);box-shadow:0 5px 0 #183550;color:white;display:grid;place-items:center;text-align:center;font-weight:900;font-size:13px;line-height:1.2}
.book:after{content:"?";font-size:24px;color:#f1cc61}
.speech-zone{width:min(900px,100%);margin:0 auto}
.dialog{background:rgba(255,255,255,.96);border:2px solid #8e99aa;border-radius:16px;padding:16px 18px;min-height:116px;box-shadow:0 5px 0 rgba(56,69,89,.16)}
.speaker{font-weight:900;color:#243451;margin-bottom:7px}.speaker.pyr{color:#8b6416}
.message{font-size:18px;line-height:1.7;font-weight:650}.message strong{color:#263d67}
.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 20px;min-width:126px;background:var(--navy);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #121a29}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #121a29}.btn.secondary{background:#fff;color:#39465c;border:1px solid #bbc4d0;box-shadow:0 3px 0 #c8cdd5}.btn.gold{background:#e2ae2d;color:#202b3c;box-shadow:0 4px 0 #ae7d16}
.name-card{width:min(520px,100%);background:rgba(255,255,255,.95);padding:24px;border:1px solid #bec8d4;border-radius:18px;box-shadow:var(--shadow);text-align:center}.name-card h2{margin:0 0 8px;font-size:24px}.name-card p{margin:0 0 16px;color:var(--muted);font-weight:700}.name-row{display:flex;gap:8px}.name-row input{flex:1;min-width:0;border:2px solid #9ba9bb;border-radius:12px;padding:13px 14px;font-size:18px;font-weight:800;outline:none}.name-row input:focus{border-color:#5579ad}
.smoke-wrap{position:absolute;left:52%;bottom:82px;width:210px;height:220px;pointer-events:none}.smoke{position:absolute;border-radius:50%;background:rgba(255,255,255,.92);filter:drop-shadow(0 2px 2px rgba(50,60,70,.14));animation:puff 1.35s ease-out forwards}.s1{width:85px;height:85px;left:48px;bottom:22px}.s2{width:70px;height:70px;left:18px;bottom:52px;animation-delay:.08s}.s3{width:92px;height:92px;left:92px;bottom:48px;animation-delay:.13s}.s4{width:55px;height:55px;left:72px;bottom:102px;animation-delay:.18s}@keyframes puff{0%{opacity:0;transform:scale(.25)}35%{opacity:1}100%{opacity:0;transform:scale(1.35) translateY(-24px)}}
.pyramiton{position:absolute;left:66%;bottom:67px;width:112px;height:105px;opacity:0;animation:arrive .45s .8s ease-out forwards}.pyr-body{position:absolute;inset:0;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(145deg,#edc75c,#c69334);filter:drop-shadow(0 6px 0 rgba(95,69,21,.23))}.eye{position:absolute;top:47px;width:9px;height:12px;border-radius:50%;background:#293243;z-index:2}.eye.e1{left:39px}.eye.e2{right:39px}.mouth{position:absolute;left:46px;top:67px;width:20px;height:9px;border-bottom:3px solid #293243;border-radius:50%;z-index:2}.pyr-label{position:absolute;left:50%;transform:translateX(-50%);bottom:-27px;white-space:nowrap;font-size:11px;font-weight:900;color:#6d5629;background:#fff8df;border:1px solid #d6bd76;border-radius:99px;padding:3px 7px}@keyframes arrive{from{opacity:0;transform:translateY(-15px) scale(.7)}to{opacity:1;transform:none}}
.lab-room{width:min(900px,100%);height:330px;position:relative}.lab-wall{position:absolute;inset:0 0 18% 0;border-radius:14px;background:linear-gradient(90deg,#d6dadd 0 3%,transparent 3% 97%,#d6dadd 97% 100%),linear-gradient(#f5f6f7,#e4e7e9);border:1px solid #c9ced3}.lab-window{position:absolute;left:7%;top:15%;width:28%;height:40%;background:#b9d8e8;border:8px solid #f7f7f6;box-shadow:0 0 0 2px #adb5bd}.lab-window:before,.lab-window:after{content:"";position:absolute;background:#f7f7f6}.lab-window:before{width:5px;height:100%;left:48%}.lab-window:after{height:5px;width:100%;top:48%}.shelf{position:absolute;right:8%;top:14%;width:30%;height:45%;border:6px solid #8d979f;border-top-width:8px;background:repeating-linear-gradient(#c9cfd4 0 4px,transparent 4px 52px)}.jar{position:absolute;width:20px;height:34px;border-radius:5px 5px 8px 8px;background:#85a8b2;border:2px solid #6a858d;top:35px}.jar.j1{right:26%}.jar.j2{right:20%;height:28px;background:#b3a872}.jar.j3{right:14%;background:#99b889}.console{position:absolute;left:38%;bottom:12%;width:32%;height:86px;background:#aeb6bc;border-radius:9px;box-shadow:0 14px 0 #8f989f}.console:before{content:"WORLD HERITAGE\A RESEARCH";white-space:pre;position:absolute;inset:12px 20px 24px;background:#3f5464;color:#dceff5;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:900;letter-spacing:.08em}
.content-card{width:min(900px,100%);background:rgba(255,255,255,.96);border:1px solid #c5ced8;border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.kicker{font-size:12px;font-weight:900;letter-spacing:.08em;color:#7c651d;margin-bottom:5px}.content-card h2{font-size:27px;margin:0 0 14px}.lead{font-size:18px;line-height:1.7;font-weight:750;margin:0}.sub{color:var(--muted);font-size:14px;line-height:1.65;font-weight:650}
.abu-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:stretch}.temple-viz{min-height:255px;border-radius:15px;background:linear-gradient(#78a9c9 0 58%,#d6b777 58% 100%);position:relative;overflow:hidden;border:1px solid #a7b9c8}.cliff{position:absolute;left:8%;right:8%;bottom:0;height:51%;background:#b88749;clip-path:polygon(0 24%,17% 12%,28% 19%,38% 7%,54% 13%,70% 4%,100% 22%,100% 100%,0 100%)}.colossus{position:absolute;bottom:12%;width:17%;height:56%;background:#d4ad70;border-radius:48% 48% 12% 12%;box-shadow:inset 0 -12px rgba(119,75,36,.16);z-index:2}.colossus:before{content:"";position:absolute;left:17%;top:9%;width:66%;height:29%;border-radius:46%;background:#ddb77b;box-shadow:inset 0 -5px rgba(116,76,38,.13)}.c1{left:17%}.c2{left:34%}.c3{left:51%}.c4{left:68%}.building-scale{position:absolute;right:4%;bottom:10%;width:36px;height:132px;background:rgba(247,250,252,.9);border:2px solid #6e7886;z-index:3;display:grid;grid-template-rows:repeat(6,1fr)}.building-scale i{border-bottom:1px solid #9aa4b0}.building-scale span{position:absolute;right:43px;top:5px;white-space:nowrap;background:#fff;padding:4px 6px;border-radius:6px;font-size:11px;font-weight:900}
.fact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fact{background:#f4f6f8;border:1px solid #d6dce3;border-radius:13px;padding:13px}.fact b{display:block;font-size:27px;color:#334d72}.fact span{font-size:12px;font-weight:800;color:#68758a}.move-diagram{display:grid;grid-template-columns:1fr 54px 1fr;gap:8px;align-items:center;margin:15px 0}.move-box{min-height:145px;border:1px solid #cbd3dc;border-radius:14px;background:#f5efe2;display:grid;place-items:center;text-align:center;font-weight:900;padding:12px}.blocks{display:grid;grid-template-columns:repeat(4,25px);gap:3px;transform:rotate(-4deg)}.blocks i{width:25px;height:25px;background:#c99d60;border:1px solid #9d7445}.arrow{font-size:36px;text-align:center;color:#6b7890;font-weight:900}
.examples{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.example{border-radius:13px;border:1px solid #d2d9e1;background:#fff;padding:11px;text-align:center}.example .icon{font-size:34px;display:block;margin-bottom:5px}.example b{font-size:13px}
.flow{display:grid;grid-template-columns:1fr 44px 1fr 44px 1fr;align-items:center;gap:6px;margin:18px 0}.flow-step{min-height:145px;border-radius:15px;background:#f6f8fa;border:2px solid #cbd3dc;padding:15px;text-align:center;display:flex;flex-direction:column;justify-content:center}.flow-step .num{font-size:12px;font-weight:900;color:#7b8799}.flow-step .ico{font-size:34px;margin:5px}.flow-step b{font-size:16px}.flow-step span{font-size:12px;color:#647086;font-weight:700;margin-top:6px}.flow-arrow{text-align:center;font-size:27px;color:#8390a0}
.question{max-width:720px;margin:0 auto}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:16px}.choice{border:2px solid #9eabba;background:#fff;border-radius:15px;min-height:94px;padding:12px;font-weight:900;font-size:17px;color:#334058;cursor:pointer}.choice:hover{background:#f5f8fb}.choice.correct{border-color:#51905c;background:#e9f6eb}.choice.wrong{border-color:#c66b6b;background:#fff0ef}.choice:disabled{cursor:default;opacity:1}.feedback{margin-top:12px;min-height:32px;font-weight:900;text-align:center}.big-number{text-align:center;font-size:64px;font-weight:1000;letter-spacing:-.04em;color:#304e78;margin:10px 0}.big-number small{font-size:20px;color:#64728a}.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f5f7f9;border-radius:13px;padding:12px;text-align:center;border:1px solid #d5dce4}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:#69758a;font-weight:800}.bars{display:grid;gap:9px;margin:16px 0}.bar-row{display:grid;grid-template-columns:80px 1fr 44px;align-items:center;gap:9px;font-weight:900;font-size:13px}.bar-track{height:17px;background:#e4e8ed;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#647ea5,#82a3c9);border-radius:99px}.japan-count{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.japan-box{background:#f6f8fa;border:1px solid #d4dbe3;border-radius:14px;padding:16px;text-align:center}.japan-box b{font-size:34px;display:block}.final-map{font-size:72px;text-align:center;margin:8px 0}.final-cta{text-align:center}.final-cta h2{font-size:34px;margin:4px}.final-cta p{font-size:17px;font-weight:750;color:#59677d}.lab-note{position:absolute;left:14px;bottom:12px;font-size:10px;color:#8792a1;background:rgba(255,255,255,.7);padding:4px 6px;border-radius:6px}
@media(max-width:760px){.game,.scene{min-height:700px}.scene{padding:14px}.message{font-size:16px}.room,.lab-room{height:300px}.tv{width:48%}.desk{width:46%}.book{right:12%}.pyramiton{left:60%}.abu-grid{grid-template-columns:1fr}.temple-viz{min-height:210px}.examples{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:1fr}.flow-arrow{transform:rotate(90deg)}.choices{grid-template-columns:1fr}.choice{min-height:62px}.big-number{font-size:49px}.stats-row{grid-template-columns:1fr}.content-card h2{font-size:23px}.name-row{flex-direction:column}.japan-count{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="brand-mark">WH</div><span>世界遺産クエスト</span><span class="lab-badge">TUTORIAL LAB</span></div>
    <button class="restart" id="restartBtn">最初から</button>
  </div>
  <main class="game" id="game"></main>
</div>
<script>
(function(){
'use strict';
const game=document.getElementById('game');
const restartBtn=document.getElementById('restartBtn');
let playerName='';
let step=0;
let answeredWorld=false;
let answeredJapan=false;
const totalCore=3;

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function name(){return esc(playerName||'主人公');}
function dots(active){return `<div class="progress">${[1,2,3].map(n=>`<i class="dot ${n===active?'on':''}"></i>`).join('')}</div>`;}
function shell(scene,place,core,body){
  return `<section class="scene ${scene}"><div class="hud"><span class="place">${place}</span>${core?dots(core):'<span></span>'}</div>${body}<div class="lab-note">Lab版：ピラミトン・遺産画像は仮素材</div></section>`;
}
function dialog(speaker,text,buttons=''){
  return `<div class="speech-zone"><div class="dialog"><div class="speaker ${speaker==='ピラミトン'?'pyr':''}">${speaker}</div><div class="message">${text}</div></div><div class="actions">${buttons}</div></div>`;
}
function nextBtn(label='つぎへ'){return `<button class="btn" data-next>${label}</button>`;}
function stage(content){return `<div class="stage">${content}</div>`;}
function homeRoom(extra=''){
 return `<div class="room"><div class="tv"><div class="tv-screen"><div class="news-line"></div><div class="news-line short"></div><div style="font-size:12px;font-weight:800">世界各地で続く争いについて伝えています</div></div></div><div class="desk"></div><div class="book">世界遺産<br>${step===1?'':'BOOK'}</div>${extra}</div>`;
}
function pyramiton(){return `<div class="smoke-wrap"><i class="smoke s1"></i><i class="smoke s2"></i><i class="smoke s3"></i><i class="smoke s4"></i></div><div class="pyramiton"><div class="pyr-body"></div><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i><span class="pyr-label">ピラミトン（仮）</span></div>`;}
function labRoom(){return `<div class="lab-room"><div class="lab-wall"></div><div class="lab-window"></div><div class="shelf"></div><i class="jar j1"></i><i class="jar j2"></i><i class="jar j3"></i><div class="console"></div></div>`;}

const screens=[
()=>shell('home','自宅',0,stage(`<div class="name-card"><h2>きみの名前を教えて！</h2><p>ゲームの中で、この名前で呼ばれるよ。</p><div class="name-row"><input id="nameInput" maxlength="12" placeholder="なまえ" autocomplete="off"><button class="btn gold" id="nameOk">これでOK！</button></div></div>`)),
()=>shell('home','自宅　1/3',1,stage(homeRoom())+dialog(name(),`テレビでは、また戦争のニュースをやっている。<br><br><strong>「どうして戦争って、なくならないんだろう……」</strong>`,nextBtn())),
()=>shell('home','自宅　2/3',2,stage(homeRoom(pyramiton()))+dialog(name(),`……えっ！？`,nextBtn())),
()=>shell('home','自宅　3/3',3,stage(homeRoom(`<div class="pyramiton" style="opacity:1;animation:none"><div class="pyr-body"></div><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i><span class="pyr-label">ピラミトン（仮）</span></div>`))+dialog('ピラミトン',`ぼくは<strong>ピラミトン！</strong><br>その答え、世界遺産を調べていくと、少し見えてくるかもしれないよ。`,nextBtn('え、世界遺産？'))),
()=>shell('home','自宅　3/3',3,stage(homeRoom(`<div class="pyramiton" style="opacity:1;animation:none"><div class="pyr-body"></div><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i><span class="pyr-label">ピラミトン（仮）</span></div>`))+dialog(name(),`<strong>「世界遺産と戦争って、何か関係あるの？」</strong>`,nextBtn('つぎへ'))),
()=>shell('home','自宅　3/3',3,stage(homeRoom(`<div class="pyramiton" style="opacity:1;animation:none"><div class="pyr-body"></div><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i><span class="pyr-label">ピラミトン（仮）</span></div>`))+dialog('ピラミトン',`それは、旅をしていけばわかるよ！<br><br>まずは<strong>世界遺産研究センター</strong>へ行こう！`,nextBtn('研究センターへ'))),
()=>shell('center','世界遺産研究センター　本部',0,stage(labRoom())+dialog('ピラミトン',`ここは<strong>世界遺産研究センター！</strong><br>旅に出る前に、世界遺産のことをちょっとだけ知っておこう。`,nextBtn('スタート！'))),
()=>shell('center','本部オリエンテーション　①',1,stage(`<div class="content-card"><div class="kicker">QUESTION 1</div><h2>世界遺産って、なんだろう？</h2><div class="abu-grid"><div class="temple-viz"><div class="cliff"></div><i class="colossus c1"></i><i class="colossus c2"></i><i class="colossus c3"></i><i class="colossus c4"></i><div class="building-scale">${'<i></i>'.repeat(6)}<span>像の高さ 約21m<br>ビル6階くらい！</span></div></div><div><p class="lead">エジプトの<strong>アブ・シンベル神殿</strong>。<br>ダムができると、この巨大な神殿が<strong>水にしずむ</strong>ことに！</p><p class="sub">そこで世界中の国が、「この大切なものを助けよう」と動き出しました。</p></div></div></div>`)+`<div class="actions">${nextBtn('どうやって助けたの？')}</div>`),
()=>shell('center','本部オリエンテーション　①',1,stage(`<div class="content-card"><div class="kicker">ABU SIMBEL RESCUE</div><h2>神殿を切って、運んで、もう一度つくった！</h2><div class="move-diagram"><div class="move-box"><div><div style="font-size:46px">🏛️</div>巨大な神殿</div></div><div class="arrow">→</div><div class="move-box"><div><div class="blocks">${'<i></i>'.repeat(12)}</div><div style="margin-top:10px">ブロックに分けて移動</div></div></div></div><div class="fact-grid"><div class="fact"><b>1000+</b><span>切り分けたブロック</span></div><div class="fact"><b>約30t</b><span>ブロック1個の重さ</span></div><div class="fact"><b>約50か国</b><span>費用の支援に参加</span></div><div class="fact"><b>64m上へ</b><span>高い場所に再建</span></div></div><p class="sub">世界中が力を合わせて守ったこの出来事は、のちの「世界遺産」のしくみにつながる大きなきっかけの一つになりました。</p></div>`)+`<div class="actions">${nextBtn('世界遺産をもっと見る')}</div>`),
()=>shell('center','本部オリエンテーション　①',1,stage(`<div class="content-card"><div class="kicker">WORLD HERITAGE</div><h2>世界遺産は、建物だけじゃない。</h2><div class="examples"><div class="example"><span class="icon">🔺</span><b>エジプトのピラミッド</b></div><div class="example"><span class="icon">🧱</span><b>万里の長城</b></div><div class="example"><span class="icon">🪸</span><b>グレート・バリア・リーフ</b></div><div class="example"><span class="icon">🗻</span><b>富士山</b></div></div><p class="lead" style="margin-top:15px">じゃあ、こういう場所を<strong>だれが「世界遺産」に決めるんだろう？</strong></p></div>`)+`<div class="actions">${nextBtn()}</div>`),
()=>shell('center','本部オリエンテーション　②',2,stage(`<div class="content-card"><div class="kicker">QUESTION 2</div><h2>だれが、どうやって決めるの？</h2><p class="lead">ユネスコの人が旅をして「ここ、世界遺産！」と決めている……わけじゃないよ。</p><div class="flow"><div class="flow-step"><span class="num">STEP 1</span><span class="ico">🏳️</span><b>国がすすめる</b><span>「この場所を世界遺産にしたい！」</span></div><div class="flow-arrow">→</div><div class="flow-step"><span class="num">STEP 2</span><span class="ico">🔎</span><b>専門家がしらべる</b><span>「世界にとって大切かな？」</span></div><div class="flow-arrow">→</div><div class="flow-step"><span class="num">STEP 3</span><span class="ico">🌐</span><b>委員会で決める</b><span>「世界遺産に登録しよう！」</span></div></div></div>`)+`<div class="actions">${nextBtn()}</div>`),
()=>shell('center','本部オリエンテーション　②',2,stage(`<div class="content-card"><div class="kicker">A LITTLE SECRET</div><h2>「世界にとって大切」って、どう決めるの？</h2><p class="lead">じつは、ちゃんと<strong>「ここを見て判断しよう」という基準</strong>があるんだ。</p><p class="sub">でも、今はまだ覚えなくて大丈夫。どんな基準なのかは、旅をしながら見つけていこう！</p><div style="margin:20px auto 4px;max-width:520px;border:2px dashed #b8a15d;border-radius:16px;padding:18px;text-align:center;background:#fff9e7"><div style="font-size:34px">🔐</div><b>世界遺産を決める「ものさし」</b><br><span class="sub">旅の中で少しずつわかる！</span></div></div>`)+`<div class="actions">${nextBtn('世界遺産になると？')}</div>`),
()=>shell('center','本部オリエンテーション　②',2,stage(`<div class="content-card"><div class="kicker">WHY INSCRIBE?</div><h2>世界遺産に登録されると、なにがいいの？</h2><p class="lead">世界のみんなに、<br><strong>「ここは大切に守っていきたい場所だ」</strong><br>と知ってもらえる。</p><p class="sub">そして、守るのが難しくなったときには、世界の国々の協力につながることもあります。</p><div style="display:flex;justify-content:center;gap:12px;font-size:42px;margin:18px">🤝　🌏　🛡️</div></div>`)+`<div class="actions">${nextBtn()}</div>`),
()=>shell('world','本部オリエンテーション　③',3,stage(`<div class="content-card question"><div class="kicker">QUESTION 3</div><h2>世界遺産って、世界にいくつあると思う？</h2><p class="sub">3つの中から選んでみよう！</p><div class="choices" id="worldChoices"><button class="choice" data-world="100">A<br>100こくらい</button><button class="choice" data-world="500">B<br>500こくらい</button><button class="choice" data-world="1200">C<br>1200こ以上</button></div><div class="feedback" id="worldFeedback"></div></div>`)+`<div class="actions"><button class="btn" id="worldNext" ${answeredWorld?'':'disabled'}>答えを見る</button></div>`),
()=>shell('world','本部オリエンテーション　③',3,stage(`<div class="content-card"><div class="kicker">2026年8月時点・UNESCO</div><h2>正解は……1200こ以上！</h2><div class="big-number">1,273<small> 件</small></div><div class="stats-row"><div class="stat"><b>991</b><span>文化遺産</span></div><div class="stat"><b>240</b><span>自然遺産</span></div><div class="stat"><b>42</b><span>複合遺産</span></div></div><p class="sub" style="text-align:center">世界の173の国・地域に世界遺産があります。</p></div>`)+`<div class="actions">${nextBtn('どの国に多い？')}</div>`),
()=>shell('world','本部オリエンテーション　③',3,stage(`<div class="content-card"><div class="kicker">WORLD HERITAGE BY COUNTRY</div><h2>世界遺産が多い国をのぞいてみよう</h2><div class="bars"><div class="bar-row"><span>イタリア</span><div class="bar-track"><div class="bar-fill" style="width:100%"></div></div><b>62</b></div><div class="bar-row"><span>中国</span><div class="bar-track"><div class="bar-fill" style="width:98.4%"></div></div><b>61</b></div><div class="bar-row"><span>フランス</span><div class="bar-track"><div class="bar-fill" style="width:90.3%"></div></div><b>56</b></div><div class="bar-row"><span>ドイツ</span><div class="bar-track"><div class="bar-fill" style="width:88.7%"></div></div><b>55</b></div><div class="bar-row"><span>日本</span><div class="bar-track"><div class="bar-fill" style="width:43.5%;background:linear-gradient(90deg,#d3aa38,#e6c764)"></div></div><b>27</b></div></div><p class="lead">じゃあ……<strong>日本には何件あると思う？</strong></p></div>`)+`<div class="actions">${nextBtn('挑戦する！')}</div>`),
()=>shell('world','本部オリエンテーション　③',3,stage(`<div class="content-card question"><div class="kicker">JAPAN QUIZ</div><h2>日本の世界遺産はいくつ？</h2><div class="choices" id="japanChoices"><button class="choice" data-japan="7">A<br>7件</button><button class="choice" data-japan="27">B<br>27件</button><button class="choice" data-japan="70">C<br>70件</button></div><div class="feedback" id="japanFeedback"></div></div>`)+`<div class="actions"><button class="btn" id="japanNext" ${answeredJapan?'':'disabled'}>答えを見る</button></div>`),
()=>shell('world','本部オリエンテーション　③',3,stage(`<div class="content-card"><div class="kicker">JAPAN / 2026</div><h2>正解は……27件！</h2><div class="big-number">27<small> 件</small></div><div class="japan-count"><div class="japan-box"><span>🏯</span><b>22</b><span class="sub">文化遺産</span></div><div class="japan-box"><span>🌿</span><b>5</b><span class="sub">自然遺産</span></div></div><p class="sub" style="text-align:center">日本にも、北から南までいろいろな世界遺産があります。</p></div>`)+`<div class="actions">${nextBtn()}</div>`),
()=>shell('world','オリエンテーション終了',0,stage(`<div class="content-card final-cta"><div class="final-map">🗾</div><div class="kicker">NEXT MISSION</div><h2>日本の世界遺産を、調べにいこう！</h2><p>どんな場所が、どんな理由で世界遺産になったんだろう？<br>最初の調査エリアは――</p><div class="big-number" style="font-size:46px">北海道！</div></div>`)+`<div class="actions"><button class="btn gold" id="finishBtn">ここまでをもう一度試す</button></div>`)
];

function render(){
 game.innerHTML=screens[step]();
 bind();
}
function bind(){
 document.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>{step=Math.min(step+1,screens.length-1);render();}));
 const input=document.getElementById('nameInput');
 const nameOk=document.getElementById('nameOk');
 if(input&&nameOk){
   const submit=()=>{const v=input.value.trim();if(!v){input.focus();input.style.borderColor='#c35e5e';return;}playerName=v;step++;render();};
   nameOk.addEventListener('click',submit);input.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});setTimeout(()=>input.focus(),50);
 }
 document.querySelectorAll('[data-world]').forEach(b=>b.addEventListener('click',()=>{
   if(answeredWorld)return;answeredWorld=true;const val=b.dataset.world;document.querySelectorAll('[data-world]').forEach(x=>{x.disabled=true;if(x.dataset.world==='1200')x.classList.add('correct');});if(val!=='1200')b.classList.add('wrong');document.getElementById('worldFeedback').textContent=val==='1200'?'正解！ そんなにあるんだ！':'おしい！ じつはもっと多いよ。';document.getElementById('worldNext').disabled=false;
 }));
 const worldNext=document.getElementById('worldNext');if(worldNext)worldNext.addEventListener('click',()=>{if(answeredWorld){step++;render();}});
 document.querySelectorAll('[data-japan]').forEach(b=>b.addEventListener('click',()=>{
   if(answeredJapan)return;answeredJapan=true;const val=b.dataset.japan;document.querySelectorAll('[data-japan]').forEach(x=>{x.disabled=true;if(x.dataset.japan==='27')x.classList.add('correct');});if(val!=='27')b.classList.add('wrong');document.getElementById('japanFeedback').textContent=val==='27'?'正解！':'おしい！ 正解を見てみよう。';document.getElementById('japanNext').disabled=false;
 }));
 const japanNext=document.getElementById('japanNext');if(japanNext)japanNext.addEventListener('click',()=>{if(answeredJapan){step++;render();}});
 const finish=document.getElementById('finishBtn');if(finish)finish.addEventListener('click',reset);
}
function reset(){playerName='';step=0;answeredWorld=false;answeredJapan=false;render();}
restartBtn.addEventListener('click',reset);
render();
})();
</script>
</body>
</html>
