<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>世界遺産クエスト TUTORIAL LAB</title>
<style>
:root{
  --ink:#1d2940;--muted:#66738a;--navy:#253149;--gold:#e5b841;--paper:#fffdf7;
  --home:#cfe8f4;--lab:#e8e9eb;--line:#c8ced8;--blue:#4777b7;--green:#5d9c6b;
  --shadow:0 10px 28px rgba(28,40,61,.14)
}
*{box-sizing:border-box}
body{margin:0;background:#eef2f6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,input{font:inherit}button{touch-action:manipulation}
.wrap{max-width:1080px;margin:0 auto;padding:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand-mark{width:34px;height:30px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--gold);display:grid;place-items:end center;padding-bottom:4px;color:#2b3140;font-size:11px}.lab-badge{font-size:12px;font-weight:900;color:#fff;background:var(--navy);border:2px solid var(--gold);border-radius:999px;padding:6px 10px;white-space:nowrap}.restart{border:1px solid #b9c2cf;background:#fff;border-radius:10px;padding:7px 11px;font-weight:800;color:#344158;cursor:pointer;white-space:nowrap}
.game{min-height:660px;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid #bac3d0;background:#fff;position:relative}.scene{min-height:660px;padding:18px 22px 22px;display:flex;flex-direction:column;transition:background .35s ease}.scene.home{background:linear-gradient(#c9e7f5 0 56%,#dec8a4 56% 100%)}.scene.center{background:linear-gradient(#edf0f2 0 72%,#d6d9dd 72% 100%)}.scene.world{background:linear-gradient(#e9f3fb,#f8fafc)}
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:56px}.place{font-size:13px;font-weight:900;letter-spacing:.04em;color:#526078;background:rgba(255,255,255,.82);padding:7px 11px;border-radius:999px;white-space:nowrap}.progress-wrap{display:grid;gap:5px}.progress-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;font-weight:900;color:#5e6a7d}.progress-label b{color:var(--ink)}.progress-track{height:7px;background:rgba(139,151,169,.23);border-radius:999px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#e0ad2f,#efce68);border-radius:999px;transition:width .25s ease}.part-tabs{display:flex;gap:6px;align-items:center;justify-content:center;min-width:0}.part-tab{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:900;color:#7a8494;white-space:nowrap}.part-tab .pnum{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#d9dee6;color:#697587}.part-tab.active{color:#28364d}.part-tab.active .pnum{background:var(--gold);color:#28364d}.part-tab.done{color:#65748a}.part-tab.done .pnum{background:#7d92ad;color:#fff}.part-sep{width:18px;height:2px;background:#c8ced8;border-radius:2px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 0}.card{width:min(900px,100%);background:rgba(255,255,255,.94);border:1px solid #c6cfdb;border-radius:20px;padding:24px;box-shadow:var(--shadow)}.eyebrow{font-size:12px;font-weight:1000;letter-spacing:.08em;color:#82651a}.card h1,.card h2{margin:8px 0 14px;line-height:1.25}.card h1{font-size:31px}.card h2{font-size:26px}.copy{font-size:18px;line-height:1.8;font-weight:700}.copy strong{color:#223b67}.small{font-size:13px;color:var(--muted);line-height:1.65}.speaker{font-weight:1000;color:#263754}.dialogue{border-left:5px solid var(--gold);padding:10px 14px;background:#fff9e8;border-radius:0 12px 12px 0;margin-top:12px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.btn{border:0;border-radius:12px;padding:13px 22px;font-weight:1000;cursor:pointer}.btn.primary{background:var(--navy);color:white;box-shadow:0 4px 0 #142036}.btn.secondary{background:#fff;border:1px solid #bdc7d4;color:#344158}.choices{display:grid;gap:10px;margin-top:16px}.choice{width:100%;text-align:left;background:#fff;border:2px solid #cad3df;border-radius:13px;padding:14px 16px;font-weight:900;color:#263754;cursor:pointer}.choice:hover{border-color:#7f98ba}.choice.correct{border-color:#5a9d6b;background:#eef9f1}.choice.wrong{border-color:#cf7278;background:#fff2f2}
.name-panel{max-width:650px;margin:auto}.name-input{width:100%;border:2px solid #aeb9c8;border-radius:13px;padding:14px 16px;font-size:19px;font-weight:900;margin-top:10px}.room{width:min(880px,100%);height:330px;position:relative}.tv{position:absolute;left:5%;top:10%;width:40%;height:48%;background:#1d2838;border:9px solid #48546b;border-radius:12px;box-shadow:0 8px 0 #6c5946}.tv-screen{position:absolute;inset:10px;background:linear-gradient(135deg,#53687f,#25364b);color:white;padding:13px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden}.tv-screen:before{content:"NEWS";position:absolute;left:10px;top:10px;background:#c13e46;border-radius:4px;padding:4px 7px;font-size:11px;font-weight:900}.news-line{height:6px;background:rgba(255,255,255,.35);border-radius:99px;width:88%}.news-line.short{width:58%}.desk{position:absolute;right:6%;bottom:7%;width:44%;height:72px;background:#9a744e;border-radius:10px 10px 4px 4px;box-shadow:0 18px 0 #7d5d41}.book{position:absolute;right:16%;bottom:79px;width:95px;height:66px;background:#294f79;border-radius:5px;transform:rotate(-5deg);box-shadow:0 5px 0 #183550;color:white;display:grid;place-items:center;text-align:center;font-weight:900;font-size:13px;line-height:1.2}.book:after{content:"?";font-size:24px;color:#f1cc61}.pyraminton{width:122px;height:102px;clip-path:polygon(50% 0,100% 100%,0 100%);background:#dbad3c;display:grid;place-items:center;margin:0 auto;position:relative;filter:drop-shadow(0 8px 0 rgba(0,0,0,.12))}.pyraminton:after{content:"• ᴗ •";font-weight:1000;position:absolute;top:53px;color:#3d3424;letter-spacing:4px}.pyraminton-label{text-align:center;margin-top:12px;font-size:12px;font-weight:900;color:#65748a}.poof{animation:poof .65s ease both}@keyframes poof{0%{transform:scale(.2);opacity:0;filter:blur(12px)}55%{transform:scale(1.35);opacity:1;filter:blur(2px)}100%{transform:scale(1);filter:blur(0)}}
.temple-wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:center}.temple{height:240px;background:linear-gradient(#d7b777,#b78d52);border-radius:90px 90px 12px 12px;position:relative;overflow:hidden;border:3px solid #a57d45}.temple:before{content:"アブ・シンベル神殿";position:absolute;top:13px;left:15px;background:rgba(255,255,255,.82);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:1000}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f5f7fa;border:1px solid #d2d8e2;border-radius:12px;padding:12px}.stat b{display:block;font-size:24px;color:#2d4e7a}.stat span{font-size:12px;font-weight:800;color:#647186}.heritage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.heritage{min-height:115px;border-radius:14px;background:linear-gradient(145deg,#dce8f5,#fff);border:1px solid #c9d3e1;padding:12px;display:flex;flex-direction:column;justify-content:flex-end}.heritage .icon{font-size:32px}.heritage b{font-size:13px}.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;margin:18px 0}.flowbox{background:#f6f8fb;border:2px solid #c7d0dc;border-radius:15px;padding:16px;text-align:center;font-weight:900;min-height:112px;display:grid;place-items:center}.arrow{font-size:26px;color:#73839a}.bars{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:85px 1fr 44px;gap:10px;align-items:center;font-size:13px;font-weight:1000}.barbg{height:19px;background:#e0e4ea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#7897c0;border-radius:99px}.bar.jp-hidden{background:linear-gradient(90deg,#cdd4dd,#e8ebef);position:relative}.bar.jp-hidden:after{content:"?";position:absolute;right:8px;top:-1px;color:#56657a;font-weight:1000}.typebars{display:grid;grid-template-columns:991fr 240fr 42fr;gap:4px;height:36px;margin:14px 0}.typebars div{display:grid;place-items:center;font-size:11px;font-weight:1000;color:#fff;border-radius:8px}.culture{background:#5278aa}.nature{background:#55906a}.mixed{background:#9879a8}.japanbox{display:grid;grid-template-columns:1fr 1fr;gap:12px}.jpstat{border-radius:15px;padding:18px;text-align:center;background:#fff;border:1px solid #c8d1dc}.jpstat b{font-size:32px;display:block}.footer-note{position:absolute;left:8px;bottom:6px;font-size:10px;color:#99a2af}
@media(max-width:760px){.wrap{padding:6px}.game,.scene{min-height:720px}.scene{padding:12px}.hud{grid-template-columns:1fr auto}.place{grid-column:1}.hud>.restart{grid-column:2}.progress-wrap{grid-column:1/-1;grid-row:2}.part-tabs{justify-content:flex-start;overflow:auto;padding-bottom:2px}.card{padding:18px}.card h1{font-size:26px}.card h2{font-size:22px}.copy{font-size:16px}.temple-wrap{grid-template-columns:1fr}.temple{height:190px}.heritage-grid{grid-template-columns:1fr 1fr}.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg);text-align:center}.statgrid{grid-template-columns:1fr 1fr}.barrow{grid-template-columns:72px 1fr 35px}.room{height:290px}.tv{left:2%;width:48%}.desk{right:2%;width:47%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="brand-mark">WH</div><span>世界遺産クエスト</span><span class="lab-badge">TUTORIAL LAB</span></div>
  </div>
  <main id="game" class="game"></main>
</div>
<script>
(function(){
'use strict';
let player='主人公',step=0,quizAnswer=null,jpQuizAnswer=null;
const game=document.getElementById('game');
const steps=[
 {part:0,partName:'導入',title:'名前を決めよう'},
 {part:0,partName:'導入',title:'ニュースを見て'},
 {part:0,partName:'導入',title:'ピラミトン登場'},
 {part:0,partName:'導入',title:'旅へのきっかけ'},
 {part:0,partName:'導入',title:'研究センターへ'},
 {part:1,partName:'世界遺産って何？',title:'水にしずむ！？'},
 {part:1,partName:'世界遺産って何？',title:'どうやって助ける？'},
 {part:1,partName:'世界遺産って何？',title:'数字で見る大救出'},
 {part:1,partName:'世界遺産って何？',title:'こんなものも世界遺産'},
 {part:2,partName:'誰がどう決める？',title:'登録までの流れ'},
 {part:2,partName:'誰がどう決める？',title:'判断する基準'},
 {part:2,partName:'誰がどう決める？',title:'登録されると？'},
 {part:3,partName:'いくつあるの？',title:'世界の数を予想'},
 {part:3,partName:'いくつあるの？',title:'世界には1273件'},
 {part:3,partName:'いくつあるの？',title:'多い国を見てみよう'},
 {part:3,partName:'いくつあるの？',title:'日本の数を予想'},
 {part:3,partName:'いくつあるの？',title:'日本は27件'},
 {part:3,partName:'いくつあるの？',title:'北海道へ出発'}
];
const total=steps.length;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function progressHud(place){
 const meta=steps[step],pct=Math.round(((step+1)/total)*100);
 const parts=[{n:1,label:'世界遺産って何？',p:1},{n:2,label:'誰がどう決める？',p:2},{n:3,label:'いくつあるの？',p:3}];
 const tabs=parts.map((x,i)=>{const cls=meta.part>x.p?'done':meta.part===x.p?'active':'';return `${i?'<span class="part-sep"></span>':''}<span class="part-tab ${cls}"><span class="pnum">${meta.part>x.p?'✓':x.n}</span>${x.label}</span>`}).join('');
 return `<div class="hud"><div class="place">${place}</div><div class="progress-wrap"><div class="progress-label"><span>${meta.part===0?'イントロ':`PART ${meta.part} / 3　${meta.partName}`}</span><b>全 ${total} 画面中 ${step+1} 画面目</b></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="part-tabs">${tabs}</div></div><button class="restart" onclick="window.__restart()">最初から</button></div>`
}
function scene(cls,place,body){return `<section class="scene ${cls}">${progressHud(place)}<div class="stage">${body}</div><div class="footer-note">Lab版：ピラミトン・遺産画像は仮素材</div></section>`}
function nextBtn(label='つぎへ'){return `<div class="actions"><button class="btn primary" onclick="window.__next()">${label}</button></div>`}
function render(){
 let h='';
 switch(step){
 case 0:h=scene('home','イントロ',`<div class="card name-panel"><div class="eyebrow">START</div><h1>きみの名前を教えて！</h1><p class="copy">これから世界遺産をめぐる主人公の名前だよ。</p><input id="nameInput" class="name-input" maxlength="12" placeholder="なまえを入力" value="${player==='主人公'?'':esc(player)}"><div class="actions"><button class="btn primary" onclick="window.__saveName()">これでOK！</button></div></div>`);break;
 case 1:h=scene('home','自宅・1/3',`<div style="width:100%"><div class="room"><div class="tv"><div class="tv-screen"><div class="news-line"></div><div class="news-line short"></div><b style="font-size:13px">世界では今も、さまざまな場所で争いが続いています……</b></div></div><div class="desk"></div><div class="book">世界遺産<br>の本</div></div><div class="card" style="margin-top:-10px"><div class="speaker">${esc(player)}：</div><div class="dialogue copy">どうして戦争って、なくならないんだろう……。</div>${nextBtn()}</div></div>`);break;
 case 2:h=scene('home','自宅・2/3',`<div class="card" style="text-align:center"><div class="eyebrow">ボンッ！</div><div class="pyraminton poof"></div><div class="pyraminton-label">ピラミトン（仮）</div><div class="dialogue copy" style="text-align:left"><span class="speaker">${esc(player)}：</span><br>えっ！？ なに！？</div>${nextBtn()}</div>`);break;
 case 3:h=scene('home','自宅・3/3',`<div class="card"><div class="pyraminton"></div><div class="pyraminton-label">ピラミトン（仮）</div><div class="dialogue copy"><span class="speaker">ピラミトン：</span><br>その答え、<strong>世界遺産</strong>を調べていくと、少し見えてくるかもしれないよ。</div><div class="dialogue copy"><span class="speaker">${esc(player)}：</span><br>……世界遺産？　戦争と何か関係あるの？</div>${nextBtn()}</div>`);break;
 case 4:h=scene('center','世界遺産研究センター',`<div class="card"><div class="pyraminton"></div><div class="pyraminton-label">ピラミトン（仮）</div><div class="dialogue copy"><span class="speaker">ピラミトン：</span><br>それは旅をしていけばわかるよ！<br>あ、ぼくは<strong>ピラミトン！</strong></div><div class="dialogue copy">ここは「世界遺産研究センター」。<br>旅に出る前に、世界遺産のことを<strong>ちょっとだけ</strong>知っておこう！</div>${nextBtn('スタート！')}</div>`);break;
 case 5:h=scene('center','PART 1　世界遺産って何？',`<div class="card"><div class="eyebrow">WORLD HERITAGE STORY</div><h1>世界遺産って、なんだろう？</h1><div class="temple-wrap"><div class="temple"></div><div class="copy">エジプトにある巨大な<strong>アブ・シンベル神殿</strong>。<br><br>ダムをつくることになって、この神殿が<strong>水の中にしずみそうになった！</strong></div></div>${nextBtn('えっ！？')}</div>`);break;
 case 6:h=scene('center','PART 1　世界遺産って何？',`<div class="card"><div class="eyebrow">QUESTION</div><h2>こんなに大きな神殿、どうやって助けたと思う？</h2><div class="choices"><button class="choice" onclick="window.__templeAnswer(this,false)">A　そのまま水の中に残した</button><button class="choice" onclick="window.__templeAnswer(this,false)">B　巨大な船でまるごと運んだ</button><button class="choice" onclick="window.__templeAnswer(this,true)">C　細かく切り分けて、別の場所で組み立てた</button></div><div id="templeResult"></div></div>`);break;
 case 7:h=scene('center','PART 1　世界遺産って何？',`<div class="card"><div class="eyebrow">AMAZING RESCUE</div><h2>神殿を切って、運んで、もう一度つくった！</h2><div class="statgrid"><div class="stat"><b>1000個以上</b><span>神殿を切り分けたブロック</span></div><div class="stat"><b>約30トン</b><span>ブロック1個の重さ</span></div><div class="stat"><b>約50か国</b><span>費用を出して救出を支援</span></div><div class="stat"><b>64m 上へ</b><span>元の場所より高い場所へ移設</span></div></div><p class="copy" style="margin-bottom:0">正面の巨大像は<strong>ビル6階分ほどの高さ</strong>。日本もこの大救出を支えた国のひとつなんだ。</p><div class="dialogue copy"><strong>「これは、世界のみんなで守りたい大切なものだ！」</strong><br>そんな考えが、世界遺産のしくみにつながっていったんだよ。</div>${nextBtn()}</div>`);break;
 case 8:h=scene('center','PART 1　世界遺産って何？',`<div class="card"><div class="eyebrow">WORLD HERITAGE</div><h2>こんなものも世界遺産！</h2><div class="heritage-grid"><div class="heritage"><div class="icon">△</div><b>エジプトのピラミッド</b></div><div class="heritage"><div class="icon">〰</div><b>万里の長城</b></div><div class="heritage"><div class="icon">🐠</div><b>グレート・バリア・リーフ</b></div><div class="heritage"><div class="icon">🗻</div><b>富士山</b></div></div><div class="dialogue copy"><span class="speaker">ピラミトン：</span><br>建物だけじゃないんだね。<br>じゃあ、こういう場所を<strong>だれが「世界遺産」に決めているんだろう？</strong></div>${nextBtn()}</div>`);break;
 case 9:h=scene('center','PART 2　誰がどう決める？',`<div class="card"><div class="eyebrow">HOW TO BECOME WORLD HERITAGE</div><h2>だれが、どうやって決めるの？</h2><p class="copy">ユネスコの人が世界を旅して「ここ、世界遺産！」と決めている……わけじゃないよ！</p><div class="flow"><div class="flowbox">① 国がすすめる<br><span class="small">「この場所を世界遺産にしたい！」</span></div><div class="arrow">→</div><div class="flowbox">② 専門家がしらべる<br><span class="small">「世界にとって大切かな？」</span></div><div class="arrow">→</div><div class="flowbox">③ 世界遺産委員会で決める<br><span class="small">「登録しよう！」</span></div></div>${nextBtn()}</div>`);break;
 case 10:h=scene('center','PART 2　誰がどう決める？',`<div class="card"><h2>「世界にとって大切」って、どうやって決めるの？</h2><div class="dialogue copy"><span class="speaker">${esc(player)}：</span><br>大切かどうかって、人によって違わない？</div><div class="dialogue copy"><span class="speaker">ピラミトン：</span><br>いいところに気づいたね！<br>じつは、ちゃんと<strong>「ここを見て判断しよう」という基準</strong>があるんだ。</div><p class="copy">どんな基準なのかは……<strong>旅をしながら見つけていこう！</strong></p>${nextBtn()}</div>`);break;
 case 11:h=scene('center','PART 2　誰がどう決める？',`<div class="card"><h2>世界遺産になると、なにがいいの？</h2><div class="dialogue copy"><span class="speaker">ピラミトン：</span><br>世界のみんなに、<strong>「ここは大切に守っていきたい場所だ」</strong>と知ってもらえる。</div><p class="copy">そして、守るのが大変になったときには、世界の国々の協力につながることもあるんだ。</p>${nextBtn()}</div>`);break;
 case 12:h=scene('world','PART 3　いくつあるの？',`<div class="card"><div class="eyebrow">QUIZ</div><h1>世界遺産は、世界にいくつあると思う？</h1><div class="choices"><button class="choice" onclick="window.__worldQuiz(this,'A')">A　100こくらい</button><button class="choice" onclick="window.__worldQuiz(this,'B')">B　500こくらい</button><button class="choice" onclick="window.__worldQuiz(this,'C')">C　1200こ以上</button></div><div id="quizResult"></div></div>`);break;
 case 13:h=scene('world','PART 3　いくつあるの？',`<div class="card"><div class="eyebrow">ANSWER</div><h1 style="font-size:48px">1,273件！</h1><p class="copy">2026年現在、世界遺産は<strong>1,273件</strong>。世界の<strong>173の国と地域</strong>にあるよ。</p><div class="typebars"><div class="culture">文化 991</div><div class="nature">自然 240</div><div class="mixed">複合 42</div></div><p class="small">文化遺産 991件 ／ 自然遺産 240件 ／ 複合遺産 42件</p>${nextBtn('国ごとに見てみる')}</div>`);break;

window.__next=()=>{if(step<total-1){step++;render()}};
window.__restart=()=>{player='主人公';step=0;quizAnswer=null;jpQuizAnswer=null;render()};
window.__saveName=()=>{const v=document.getElementById('nameInput').value.trim();player=v||'主人公';step=1;render()};
window.__templeAnswer=(el,ok)=>{document.querySelectorAll('.choice').forEach(x=>x.disabled=true);el.classList.add(ok?'correct':'wrong');if(!ok)document.querySelectorAll('.choice')[2].classList.add('correct');document.getElementById('templeResult').innerHTML=`<div class="dialogue copy">${ok?'正解！':'正解は C！'}<br><strong>神殿を1000個以上のブロックに切り分けて、運んでもう一度組み立てた！</strong></div>${nextBtn()}`};
window.__worldQuiz=(el,a)=>{quizAnswer=a;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);el.classList.add(a==='C'?'correct':'wrong');if(a!=='C')document.querySelectorAll('.choice')[2].classList.add('correct');document.getElementById('quizResult').innerHTML=`<div class="dialogue copy">${a==='C'?'正解！':'正解は C！'}　世界には<strong>1200件以上</strong>あるよ。</div>${nextBtn('答えを見る')}`};
window.__jpQuiz=(el,a)=>{jpQuizAnswer=a;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);el.classList.add(a==='B'?'correct':'wrong');if(a!=='B')document.querySelectorAll('.choice')[1].classList.add('correct');document.getElementById('jpQuizResult').innerHTML=`<div class="dialogue copy">${a==='B'?'正解！':'正解は B！'}</div>${nextBtn('答えを見る')}`};
