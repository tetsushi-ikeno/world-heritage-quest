<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>世界遺産クエスト TUTORIAL LAB</title>
<style>
:root{
  --ink:#1d2940;--muted:#677489;--navy:#253149;--gold:#e3b53c;--gold-soft:#fff6d8;
  --line:#c8d0dc;--panel:#ffffff;--home-sky:#d9edf7;--home-floor:#dfc9a9;
  --lab-bg:#e9ecef;--lab-floor:#d3d7dc;--blue:#7e9fc7;--green:#5b956a;
  --shadow:0 12px 30px rgba(29,42,64,.13)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eef2f6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,input{font:inherit}button{touch-action:manipulation}
.wrap{max-width:1120px;margin:0 auto;padding:12px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900}.brand-mark{width:32px;height:28px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--gold);display:grid;place-items:end center;padding-bottom:3px;color:#2b3140;font-size:10px}.lab-badge{font-size:11px;font-weight:900;color:#fff;background:var(--navy);border:2px solid var(--gold);border-radius:999px;padding:5px 9px}.restart{border:1px solid #bcc5d1;background:#fff;border-radius:10px;padding:7px 11px;font-weight:800;color:#3b475c;cursor:pointer}
.game{min-height:700px;border-radius:20px;overflow:hidden;border:1px solid #bbc4d0;box-shadow:var(--shadow);background:#fff;position:relative}
.scene{min-height:700px;padding:16px 20px 18px;display:flex;flex-direction:column;transition:background .35s ease}
.scene.home{background:linear-gradient(var(--home-sky) 0 58%,var(--home-floor) 58% 100%)}
.scene.center{background:linear-gradient(#f0f2f4 0 76%,var(--lab-floor) 76% 100%)}
.scene.world{background:linear-gradient(#edf6fc,#f8fafc)}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;min-height:72px}
.place{font-size:12px;font-weight:900;letter-spacing:.03em;background:rgba(255,255,255,.84);border:1px solid rgba(188,198,210,.7);padding:7px 10px;border-radius:999px;white-space:nowrap}
.progress-area{display:grid;gap:6px;min-width:0}.progress-top{display:flex;justify-content:space-between;gap:12px;font-size:11px;font-weight:900;color:#657286}.progress-top b{color:var(--ink)}
.progress-track{height:7px;background:rgba(137,150,168,.23);border-radius:999px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#dba929,#efd06b);border-radius:999px;transition:width .25s ease}
.parts{display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden}.part{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:900;color:#87909d;white-space:nowrap}.part .num{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#dce1e8;color:#687488}.part.active{color:#27364d}.part.active .num{background:var(--gold);color:#27364d}.part.done{color:#68778d}.part.done .num{background:#8296b0;color:#fff}.part-line{width:18px;height:2px;background:#c9d0da;border-radius:2px;flex:0 0 auto}.intro-tag{font-size:10px;font-weight:900;color:#745d20;background:#fff4cf;border:1px solid #edd480;border-radius:999px;padding:3px 7px;white-space:nowrap}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0}
.lesson-shell{width:min(970px,100%);height:540px;background:rgba(255,255,255,.95);border:1px solid #c6cfdb;border-radius:20px;box-shadow:var(--shadow);padding:20px;display:grid;grid-template-rows:minmax(0,1fr) 150px 58px;gap:12px;overflow:hidden}
.visual-zone{min-height:0;overflow:hidden;display:flex;flex-direction:column}.message-zone{height:150px;overflow:auto;border-left:5px solid var(--gold);background:#fff9e8;border-radius:0 13px 13px 0;padding:14px 16px;display:flex;flex-direction:column;justify-content:center}.action-zone{height:58px;display:flex;align-items:center;justify-content:flex-end;gap:10px;border-top:1px solid #edf0f4;padding-top:9px}
.eyebrow{font-size:12px;font-weight:1000;letter-spacing:.08em;color:#82651a}.title{font-size:30px;line-height:1.2;margin:6px 0 12px}.copy{font-size:18px;line-height:1.7;font-weight:700;margin:0}.copy strong{color:#233f70}.speaker{font-weight:1000;color:#253754;margin-bottom:4px}.small{font-size:12px;line-height:1.55;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:1000;cursor:pointer}.btn.primary{background:var(--navy);color:#fff;box-shadow:0 4px 0 #142036}.btn.secondary{background:#fff;border:1px solid #bdc7d4;color:#344158}.btn:active{transform:translateY(1px)}
.home-shell{width:min(970px,100%);height:540px;display:grid;grid-template-rows:minmax(0,1fr) 150px 58px;gap:12px}.room{position:relative;min-height:0}.tv{position:absolute;left:5%;top:12%;width:40%;height:48%;background:#1c2737;border:9px solid #47546a;border-radius:12px;box-shadow:0 8px 0 #6b5845}.tv-screen{position:absolute;inset:10px;background:linear-gradient(135deg,#53687f,#25364b);padding:12px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;overflow:hidden}.tv-screen:before{content:"NEWS";position:absolute;top:10px;left:10px;background:#c13e46;border-radius:4px;padding:4px 7px;font-size:11px;font-weight:1000}.news-line{height:6px;background:rgba(255,255,255,.35);border-radius:99px;width:88%}.news-line.short{width:60%}.desk{position:absolute;right:7%;bottom:8%;width:42%;height:70px;background:#98734e;border-radius:9px 9px 4px 4px;box-shadow:0 18px 0 #7b5c40}.book{position:absolute;right:17%;bottom:79px;width:98px;height:68px;background:#294f79;border-radius:5px;transform:rotate(-5deg);box-shadow:0 5px 0 #183550;color:#fff;display:grid;place-items:center;text-align:center;font-weight:900;font-size:12px}.book:after{content:"?";font-size:25px;color:#f0cc63}.message-home{height:150px;background:rgba(255,255,255,.95);border:1px solid #c6cfdb;border-left:5px solid var(--gold);border-radius:0 13px 13px 0;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 7px 18px rgba(28,40,61,.08)}.actions-home{height:58px;display:flex;justify-content:flex-end;align-items:center;gap:10px}
.arrival-stage{position:relative;flex:1;display:grid;place-items:center}.pyraminton-wrap{position:relative;width:220px;height:185px;display:grid;place-items:center}.pyraminton{width:126px;height:108px;clip-path:polygon(50% 0,100% 100%,0 100%);background:#dcae40;display:grid;place-items:center;position:relative;filter:drop-shadow(0 8px 0 rgba(0,0,0,.12));opacity:0;transform:scale(.65)}.pyraminton:after{content:"• ᴗ •";font-weight:1000;position:absolute;top:56px;color:#3d3424;letter-spacing:4px}.pyraminton.show{animation:characterIn .55s .38s cubic-bezier(.2,.9,.3,1.2) forwards}@keyframes characterIn{to{opacity:1;transform:scale(1)}}
.smoke{position:absolute;inset:0;pointer-events:none}.smoke i{position:absolute;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 18px rgba(255,255,255,.6);opacity:0}.smoke.play i{animation:smokePop .85s ease-out forwards}.smoke i:nth-child(1){left:34px;top:80px;animation-delay:0s}.smoke i:nth-child(2){left:72px;top:48px;animation-delay:.06s}.smoke i:nth-child(3){left:118px;top:44px;animation-delay:.11s}.smoke i:nth-child(4){left:145px;top:82px;animation-delay:.16s}.smoke i:nth-child(5){left:84px;top:104px;animation-delay:.20s}@keyframes smokePop{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1.9) translateY(-16px)}}.boom{position:absolute;top:18px;font-weight:1000;font-size:27px;color:#33415a;opacity:0}.boom.play{animation:boom .7s ease forwards}@keyframes boom{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1.12)}100%{opacity:0;transform:scale(1)}}
.center-transition{position:relative;flex:1;display:grid;place-items:center;overflow:hidden;border-radius:14px;background:linear-gradient(#eef1f3 0 70%,#d7dadd 70% 100%)}.center-transition:before,.center-transition:after{content:"";position:absolute;top:0;bottom:0;width:50%;background:#dfe4e8;z-index:4;animation:doors 1s .18s ease forwards}.center-transition:before{left:0;border-right:2px solid #c4cbd3}.center-transition:after{right:0;border-left:2px solid #c4cbd3}@keyframes doors{to{width:0}}.facility{width:430px;max-width:80%;height:210px;background:#f9fafb;border:3px solid #9ca8b7;border-radius:10px 10px 2px 2px;position:relative;box-shadow:0 15px 0 #b8bec6}.facility:before{content:"世界遺産研究センター";position:absolute;left:50%;top:18px;transform:translateX(-50%);white-space:nowrap;background:#253149;color:white;padding:7px 14px;border-radius:5px;font-weight:1000;font-size:13px}.facility .door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:88px;height:112px;background:#b7c8d7;border:4px solid #8293a4}.facility .window{position:absolute;top:74px;width:76px;height:55px;background:#cfe1eb;border:4px solid #8fa1b0}.facility .w1{left:42px}.facility .w2{right:42px}.location-banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;background:#fff;border:1px solid #bcc6d1;border-radius:999px;padding:8px 15px;font-size:13px;font-weight:1000;box-shadow:0 5px 16px rgba(28,40,61,.12);animation:bannerIn .5s .8s both}@keyframes bannerIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
.story-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:stretch;min-height:0;flex:1}.story-copy{display:flex;flex-direction:column;justify-content:center;padding:4px 8px}.abudraw{position:relative;border:2px solid #c5b08c;border-radius:16px;background:linear-gradient(#bfe1f0 0 56%,#d6b678 56% 100%);overflow:hidden;min-height:230px}.cliff{position:absolute;left:9%;bottom:15%;width:63%;height:55%;background:#bd945e;border-radius:100px 100px 8px 8px;border:3px solid #9b754a}.statue{position:absolute;bottom:18%;width:13%;height:37%;background:#d2af79;border-radius:40% 40% 12% 12%;border:2px solid #a98050}.statue:before{content:"";position:absolute;top:8%;left:19%;width:62%;height:34%;border-radius:50%;background:#d8b885;border:2px solid #aa8354}.s1{left:16%}.s2{left:30%}.s3{left:44%}.s4{left:58%}.water{position:absolute;left:0;right:0;bottom:0;height:24%;background:rgba(78,151,194,.78);border-top:4px dashed rgba(255,255,255,.8)}.water-label{position:absolute;right:12px;bottom:9px;background:#fff;color:#315779;font-size:11px;font-weight:1000;border-radius:999px;padding:4px 8px}.height-stick{position:absolute;right:8%;bottom:24%;height:54%;width:42px;border-left:3px solid #334a67;color:#334a67;font-size:10px;font-weight:1000;padding-left:6px;display:flex;align-items:center}.height-stick:before,.height-stick:after{content:"";position:absolute;left:-7px;width:11px;height:3px;background:#334a67}.height-stick:before{top:0}.height-stick:after{bottom:0}.dam{position:absolute;right:4%;bottom:22%;width:18%;height:17%;background:#768393;clip-path:polygon(0 100%,35% 0,100% 100%)}
.rescue-diagram{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;flex:1}.mini-panel{height:225px;border:1px solid #c9d1dc;border-radius:14px;background:#f7f9fb;padding:12px;position:relative;overflow:hidden}.mini-title{font-size:11px;font-weight:1000;color:#5f6d82;margin-bottom:8px}.block-temple{position:absolute;left:12%;right:12%;bottom:20px;height:150px;background:#cba568;border:3px solid #a47c47;border-radius:60px 60px 7px 7px;background-image:linear-gradient(to right,rgba(255,255,255,.55) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.55) 1px,transparent 1px);background-size:32px 32px}.crane{position:absolute;right:9%;top:40px;width:60px;height:145px;border-left:5px solid #657487}.crane:before{content:"";position:absolute;top:0;left:-4px;width:75px;height:5px;background:#657487}.crane:after{content:"▣";position:absolute;top:50px;right:-18px;font-size:30px;color:#b18b54}.rescue-arrow{font-size:32px;color:#75849a;font-weight:1000}.higher{position:absolute;left:0;right:0;bottom:0;height:36%;background:#d8c296}.rebuilt{position:absolute;left:22%;right:22%;bottom:25%;height:128px;background:#cba568;border:3px solid #a47c47;border-radius:52px 52px 7px 7px}.up64{position:absolute;right:10px;top:58px;color:#34577f;font-size:12px;font-weight:1000}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:8px}.stat{border:1px solid #d1d8e1;background:#f6f8fb;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px;color:#2d4f7b}.stat span{font-size:11px;font-weight:800;color:#667388}
.heritage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1;align-items:stretch}.heritage{border:1px solid #c9d3e0;border-radius:14px;background:linear-gradient(145deg,#e0eaf5,#fff);padding:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:7px}.heritage .icon{font-size:38px}.heritage b{font-size:13px}.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;flex:1}.flowbox{background:#f7f9fb;border:2px solid #c7d0dc;border-radius:15px;padding:14px;text-align:center;font-weight:900;min-height:145px;display:grid;place-items:center}.arrow{font-size:28px;color:#74849a}
.choices{display:grid;gap:10px;margin-top:10px}.choice{width:100%;text-align:left;background:#fff;border:2px solid #cad3df;border-radius:12px;padding:12px 15px;font-weight:900;color:#263754;cursor:pointer}.choice.correct{border-color:#5a9d6b;background:#eef9f1}.choice.wrong{border-color:#cf7278;background:#fff2f2}
.typebars{display:grid;grid-template-columns:991fr 240fr 42fr;gap:4px;height:44px;margin:14px 0}.typebars div{display:grid;place-items:center;font-size:11px;font-weight:1000;color:#fff;border-radius:8px}.culture{background:#5278aa}.nature{background:#55906a}.mixed{background:#9879a8}.bars{display:grid;gap:10px;margin-top:6px}.barrow{display:grid;grid-template-columns:85px 1fr 44px;gap:10px;align-items:center;font-size:13px;font-weight:1000}.barbg{height:19px;background:#e0e4ea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#7897c0;border-radius:99px}.bar.hidden-answer{width:100%!important;background:repeating-linear-gradient(135deg,#d9dee6 0 9px,#eef1f4 9px 18px)}.unknown{color:#7b8798}.japanbox{display:grid;grid-template-columns:1fr 1fr;gap:12px}.jpstat{border:1px solid #c8d1dc;border-radius:15px;background:#fff;padding:18px;text-align:center}.jpstat b{font-size:32px;display:block}.finish{display:grid;place-items:center;text-align:center;height:100%}.finish .big{font-size:46px;margin:0}.finish p{font-size:19px;font-weight:800;line-height:1.7}.footer-note{position:absolute;left:8px;bottom:6px;font-size:10px;color:#99a2af}
@media(max-width:760px){.wrap{padding:6px}.game,.scene{min-height:760px}.scene{padding:10px}.hud{grid-template-columns:1fr auto;min-height:102px}.place{grid-column:1}.restart{grid-column:2}.progress-area{grid-column:1/-1}.parts{justify-content:flex-start;overflow:auto;padding-bottom:2px}.lesson-shell,.home-shell{height:590px;grid-template-rows:minmax(0,1fr) 158px 58px}.title{font-size:25px}.copy{font-size:16px}.story-grid{grid-template-columns:1fr}.abudraw{min-height:180px}.story-copy{display:none}.rescue-diagram{grid-template-columns:1fr}.rescue-arrow{transform:rotate(90deg);text-align:center}.mini-panel{height:145px}.stats{grid-template-columns:1fr 1fr}.heritage-grid{grid-template-columns:1fr 1fr}.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg);text-align:center}.flowbox{min-height:82px}.room{min-height:270px}.tv{left:2%;width:48%}.desk{right:2%;width:47%}.barrow{grid-template-columns:72px 1fr 36px}}
</style>
</head>
<body>
<div class="wrap"><div class="topbar"><div class="brand"><div class="brand-mark">WH</div><span>世界遺産クエスト</span><span class="lab-badge">TUTORIAL LAB</span></div></div><main id="game" class="game"></main></div>
<script>
(function(){
'use strict';
let player='主人公',step=0,worldChoice=null,japanChoice=null;
const game=document.getElementById('game');
const steps=[{part:0,title:'名前を決めよう'},{part:0,title:'ニュースを見て'},{part:0,title:'ピラミトン登場'},{part:0,title:'旅へのきっかけ'},{part:0,title:'研究センターへ'},{part:1,title:'水にしずむ！？'},{part:1,title:'どうやって助ける？'},{part:1,title:'数字で見る大救出'},{part:1,title:'こんなものも世界遺産'},{part:2,title:'登録までの流れ'},{part:2,title:'判断する基準'},{part:2,title:'登録されると？'},{part:3,title:'世界の数を予想'},{part:3,title:'世界には1273件'},{part:3,title:'多い国を見てみよう'},{part:3,title:'日本の数を予想'},{part:3,title:'日本は27件'},{part:3,title:'北海道へ出発'}];
const total=steps.length;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function hud(place){const meta=steps[step],pct=((step+1)/total)*100,remaining=total-(step+1);const parts=[{p:1,n:'1',label:'世界遺産って何？'},{p:2,n:'2',label:'誰がどう決める？'},{p:3,n:'3',label:'いくつあるの？'}];const partHtml=parts.map((x,i)=>{const cls=meta.part>x.p?'done':meta.part===x.p?'active':'';const mark=cls==='done'?'✓':x.n;return `<span class="part ${cls}"><span class="num">${mark}</span>${x.label}</span>${i<2?'<i class="part-line"></i>':''}`}).join('');return `<div class="hud"><div class="place">${meta.part===0?'<span class="intro-tag">オープニング</span>':esc(place)}</div><div class="progress-area"><div class="progress-top"><span>${esc(steps[step].title)}</span><b>${step+1} / ${total}${remaining?` ・ あと${remaining}画面`:''}</b></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="parts">${partHtml}</div></div><button class="restart" data-restart>最初から</button></div>`}
function shell(place,visual,message,actions,scene='center'){game.innerHTML=`<section class="scene ${scene}">${hud(place)}<div class="stage"><div class="lesson-shell"><div class="visual-zone">${visual}</div><div class="message-zone">${message}</div><div class="action-zone">${actions}</div></div></div><div class="footer-note">Lab版：ピラミトン・遺産画像は仮素材</div></section>`;bindCommon()}
function homeShell(visual,message,actions){game.innerHTML=`<section class="scene home">${hud('自宅')}<div class="stage"><div class="home-shell"><div class="room">${visual}</div><div class="message-home">${message}</div><div class="actions-home">${actions}</div></div></div><div class="footer-note">Lab版：ピラミトン・遺産画像は仮素材</div></section>`;bindCommon()}
function bindCommon(){document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{if(step<total-1){step++;render()}});document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{if(step>0){step--;render()}});document.querySelectorAll('[data-restart]').forEach(b=>b.onclick=()=>{step=0;worldChoice=null;japanChoice=null;render()})}
function actions(next='次へ',back=true){return `${back?'<button class="btn secondary" data-back>戻る</button>':''}<button class="btn primary" data-next>${next}</button>`}
function render(){
if(step===0){game.innerHTML=`<section class="scene home">${hud('自宅')}<div class="stage"><div class="lesson-shell"><div class="visual-zone" style="justify-content:center;align-items:center"><div style="width:min(620px,100%);background:#fff;border:1px solid #c8d0db;border-radius:18px;padding:24px"><div class="eyebrow">PLAYER</div><h1 class="title">きみの名前を教えて！</h1><input id="nameInput" style="width:100%;border:2px solid #aeb9c8;border-radius:13px;padding:14px 16px;font-size:20px;font-weight:900" maxlength="12" placeholder="なまえ"></div></div><div class="message-zone"><div class="speaker">ナレーション</div><p class="copy">この名前が、これから主人公の名前になるよ。</p></div><div class="action-zone"><button class="btn primary" id="nameOk">これでOK！</button></div></div></div></section>`;document.getElementById('nameOk').onclick=()=>{const v=document.getElementById('nameInput').value.trim();player=v||'主人公';step++;render()};document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('nameOk').click()});bindCommon();return}
if(step===1){homeShell(`<div class="tv"><div class="tv-screen"><div class="news-line"></div><div class="news-line"></div><div class="news-line short"></div></div></div><div class="desk"></div><div class="book">世界遺産<br>BOOK</div>`,`<div class="speaker">ニュース</div><p class="copy">「世界では今も、さまざまな場所で争いが続いています……」</p><div class="speaker" style="margin-top:8px">${esc(player)}</div><p class="copy">「どうして戦争って、なくならないんだろう……」</p>`,actions('次へ',false));return}
if(step===2){homeShell(`<div class="arrival-stage"><div class="pyraminton-wrap"><div id="boom" class="boom">ボンッ！</div><div id="smoke" class="smoke"><i></i><i></i><i></i><i></i><i></i></div><div id="pyraminton" class="pyraminton"></div></div></div>`,`<div class="speaker">${esc(player)}</div><p class="copy">「えっ！？　なに！？」</p>`,actions('次へ'));requestAnimationFrame(()=>{document.getElementById('smoke')?.classList.add('play');document.getElementById('boom')?.classList.add('play');document.getElementById('pyraminton')?.classList.add('show')});return}
if(step===3){homeShell(`<div class="arrival-stage"><div><div class="pyraminton" style="opacity:1;transform:scale(1)"></div><div style="text-align:center;margin-top:10px;font-size:12px;font-weight:900;color:#667388">ピラミトン（仮）</div></div></div>`,`<div class="speaker">ピラミトン</div><p class="copy">「その答え、<strong>世界遺産</strong>を調べていくと、少し見えてくるかもしれないよ。」</p><div class="speaker" style="margin-top:7px">${esc(player)}</div><p class="copy">「……世界遺産と戦争って、何か関係あるの？」</p>`,actions('それはあとで！'));return}
if(step===4){shell('世界遺産研究センター',`<div class="center-transition"><div class="location-banner">場所が変わりました　→　世界遺産研究センター 本部</div><div class="facility"><div class="door"></div><div class="window w1"></div><div class="window w2"></div></div></div>`,`<div class="speaker">ピラミトン</div><p class="copy">「それは、旅をしていけばわかるよ！　ぼくはピラミトン。まずはここで、世界遺産のことをちょっとだけ知っておこう！」</p>`,actions('オリエンテーション開始'),'center');return}
if(step===5){shell('世界遺産研究センター',`<div class="eyebrow">WORLD HERITAGE STORY</div><h1 class="title">世界遺産って、なんだろう？</h1><div class="story-grid"><div class="abudraw"><div class="cliff"></div><div class="statue s1"></div><div class="statue s2"></div><div class="statue s3"></div><div class="statue s4"></div><div class="dam"></div><div class="water"></div><div class="water-label">ダム完成後の水面</div><div class="height-stick">約21m<br>≒6階建て</div></div><div class="story-copy"><p class="copy">エジプトにある巨大な<strong>アブ・シンベル神殿</strong>。<br><br>ダムをつくることになって、この神殿が<strong>水の中にしずみそうになった！</strong></p></div></div>`,`<div class="speaker">ピラミトン</div><p class="copy">「正面の像は、ビル6階分ほどの高さ。こんな巨大な神殿を、どうやって助けたと思う？」</p>`,actions('えっ！？'));return}
if(step===6){shell('世界遺産研究センター',`<div class="eyebrow">RESCUE MISSION</div><h2 class="title" style="font-size:25px">巨大な神殿を、まるごと引っこし！</h2><div class="rescue-diagram"><div class="mini-panel"><div class="mini-title">① 細かく切り分ける</div><div class="block-temple"></div><div class="crane"></div></div><div class="rescue-arrow">→</div><div class="mini-panel"><div class="mini-title">② 高い場所で組み立て直す</div><div class="higher"></div><div class="rebuilt"></div><div class="up64">元の場所より<br>64m上へ</div></div></div>`,`<div class="speaker">ピラミトン</div><p class="copy">「なんと、神殿を<strong>1000個以上のブロック</strong>に切り分けて、一つずつ運び、高い場所でもう一度組み立てたんだ！」</p>`,actions('すごい！'));return}
if(step===7){shell('世界遺産研究センター',`<div class="eyebrow">THE BIG RESCUE</div><h2 class="title" style="font-size:25px">数字で見る、アブ・シンベル大救出</h2><div class="stats"><div class="stat"><b>1000+</b><span>切り分けたブロック</span></div><div class="stat"><b>約30t</b><span>ブロック1個の重さ</span></div><div class="stat"><b>約50か国</b><span>費用を支援</span></div><div class="stat"><b>64m</b><span>上へ移動</span></div></div>`,`<div class="speaker">ピラミトン</div><p class="copy">「世界中の国が、<strong>『これはみんなで守りたい大切なものだ！』</strong>と力を合わせた。日本もこの救出を支えた国のひとつなんだ。」</p>`,actions('世界遺産につながる？'));return}
if(step===8){shell('世界遺産研究センター',`<div class="eyebrow">WORLD HERITAGE</div><h2 class="title" style="font-size:25px">世界遺産には、こんな場所も！</h2><div class="heritage-grid"><div class="heritage"><div class="icon">△</div><b>ピラミッド</b><span class="small">巨大建造物</span></div><div class="heritage"><div class="icon">🏯</div><b>万里の長城</b><span class="small">長大な城壁</span></div><div class="heritage"><div class="icon">🐠</div><b>グレート・バリア・リーフ</b><span class="small">大自然</span></div><div class="heritage"><div class="icon">🗻</div><b>富士山</b><span class="small">日本の世界遺産</span></div></div>`,`<div class="speaker">ピラミトン</div><p class="copy">「建物だけじゃないんだ。じゃあ、こういう場所を<strong>だれが世界遺産に決めている</strong>んだろう？」</p>`,actions('次のパートへ'));return}
if(step===9){shell('世界遺産研究センター',`<div class="eyebrow">PART 2</div><h1 class="title">だれが、どうやって決めるの？</h1><div class="flow"><div class="flowbox">① 国がすすめる<br><span class="small">「この場所を世界遺産にしたい！」</span></div><div class="arrow">→</div><div class="flowbox">② 専門家がしらべる<br><span class="small">「世界にとって大切かな？」</span></div><div class="arrow">→</div><div class="flowbox">③ 世界遺産委員会で決める<br><span class="small">「登録しよう！」</span></div></div>`,`<div class="speaker">ピラミトン</div><p class="copy">「ユネスコの人が世界を旅して、気に入った場所を勝手に決めているわけじゃないよ。」</p>`,actions('なるほど'));return}
if(step===10){shell('世界遺産研究センター',`<div class="eyebrow">A QUESTION</div><h1 class="title">「世界にとって大切」って、どう決める？</h1><div style="flex:1;display:grid;place-items:center"><div style="font-size:72px;font-weight:1000;color:#e0b13d">？</div></div>`,`<div class="speaker">${esc(player)}</div><p class="copy">「でも、『世界にとって大切』って、どうやって決めるの？」</p><div class="speaker" style="margin-top:6px">ピラミトン</div><p class="copy">「じつは、ちゃんと判断するための<strong>基準</strong>があるんだ。どんな基準なのかは、旅をしながら見つけていこう！」</p>`,actions('次へ'));return}
if(step===11){shell('世界遺産研究センター',`<div class="eyebrow">WHY REGISTER?</div><h1 class="title">世界遺産になると、何がいいの？</h1><div style="flex:1;display:grid;place-items:center"><div style="display:flex;gap:18px;align-items:center;font-size:56px"><span>🌍</span><span style="font-size:28px">＋</span><span>🤝</span><span style="font-size:28px">＋</span><span>🏛️</span></div></div>`,`<div class="speaker">ピラミトン</div><p class="copy">「世界のみんなに<strong>『ここは大切に守っていきたい場所だ』</strong>と知ってもらえる。守るのが大変なとき、世界の協力につながることもあるんだ。」</p>`,actions('数も知りたい！'));return}
if(step===12){shell('世界遺産研究センター',`<div class="eyebrow">QUIZ</div><h1 class="title">世界遺産は、世界にいくつある？</h1><div class="choices"><button class="choice" data-world="A">A　100こくらい</button><button class="choice" data-world="B">B　500こくらい</button><button class="choice" data-world="C">C　1200こ以上</button></div>`,`<div class="speaker">ピラミトン</div><p class="copy">「予想でOK！　どれだと思う？」</p>`,`<button class="btn secondary" data-back>戻る</button>`);document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{worldChoice=b.dataset.world;document.querySelectorAll('[data-world]').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(worldChoice==='C'?'correct':'wrong');setTimeout(()=>{step++;render()},420)});return}
if(step===13){shell('世界遺産研究センター',`<div class="eyebrow">ANSWER</div><h1 class="title">正解は……1200こ以上！</h1><div style="display:grid;place-items:center;flex:1"><div style="font-size:64px;font-weight:1000;color:#263b61">1,273<span style="font-size:20px"> 件</span></div><div class="typebars" style="width:min(760px,100%)"><div class="culture">文化 991</div><div class="nature">自然 240</div><div class="mixed">42</div></div><div class="small">文化遺産 991件　／　自然遺産 240件　／　複合遺産 42件</div></div>`,`<div class="speaker">ピラミトン</div><p class="copy">「2026年現在、世界遺産は<strong>1,273件</strong>。173の国と地域にあるんだ！」</p>`,actions('どの国に多い？'));return}
if(step===14){const rows=[['イタリア',62,100,'62'],['中国',61,98,'61'],['フランス',56,90,'56'],['ドイツ',55,89,'55'],['日本',0,100,'？']];shell('世界遺産研究センター',`<div class="eyebrow">WORLD HERITAGE BY COUNTRY</div><h1 class="title">世界遺産が多い国をのぞいてみよう</h1><div class="bars">${rows.map(r=>`<div class="barrow"><span>${r[0]}</span><div class="barbg"><div class="bar ${r[0]==='日本'?'hidden-answer':''}" style="width:${r[2]}%"></div></div><span class="${r[0]==='日本'?'unknown':''}">${r[3]}</span></div>`).join('')}</div>`,`<div class="speaker">ピラミトン</div><p class="copy">「じゃあ……<strong>日本には何件あると思う？</strong>　ここではまだ答えはナイショ！」</p>`,actions('挑戦する！'));return}
if(step===15){shell('世界遺産研究センター',`<div class="eyebrow">QUIZ</div><h1 class="title">日本の世界遺産は、いくつ？</h1><div class="choices"><button class="choice" data-jp="A">A　7件</button><button class="choice" data-jp="B">B　27件</button><button class="choice" data-jp="C">C　70件</button></div>`,`<div class="speaker">ピラミトン</div><p class="copy">「さっきの国別グラフでは、日本の数は隠しておいたよ。どれだと思う？」</p>`,`<button class="btn secondary" data-back>戻る</button>`);document.querySelectorAll('[data-jp]').forEach(b=>b.onclick=()=>{japanChoice=b.dataset.jp;document.querySelectorAll('[data-jp]').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(japanChoice==='B'?'correct':'wrong');setTimeout(()=>{step++;render()},420)});return}
if(step===16){shell('世界遺産研究センター',`<div class="eyebrow">JAPAN</div><h1 class="title">日本は、27件！</h1><div class="japanbox"><div class="jpstat"><b>22</b>文化遺産</div><div class="jpstat"><b>5</b>自然遺産</div></div><div style="text-align:center;margin-top:18px;font-size:34px;font-weight:1000">22 ＋ 5 ＝ 27</div>`,`<div class="speaker">ピラミトン</div><p class="copy">「日本にも、北から南までいろんな世界遺産があるんだ！」</p>`,actions('調べにいこう！'));return}
if(step===17){shell('世界遺産研究センター',`<div class="finish"><div><div class="eyebrow">ORIENTATION COMPLETE</div><p class="big">🗾</p><h1 class="title">最初の調査エリアは……北海道！</h1><p>日本の世界遺産を、ピラミトンといっしょに調べにいこう。</p></div></div>`,`<div class="speaker">ピラミトン</div><p class="copy">「準備できた？　ここからが本当の旅のはじまりだよ！」</p>`,`<button class="btn secondary" data-back>戻る</button><button class="btn primary" onclick="alert('Lab版はここまでです！')">北海道へ出発！</button>`);return}
}
render();
})();
</script>
