<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Beta3 センター確認Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#e8eef4;color:#1d2940}.wrap{height:100%;display:grid;grid-template-rows:auto 1fr}.bar{display:flex;gap:8px;align-items:center;padding:10px 190px 10px 10px;background:#fff;border-bottom:1px solid #c8d1db}.bar b{white-space:nowrap}.bar small{font-size:11px;font-weight:800;color:#65748a;white-space:nowrap}.bar select{min-width:0;flex:1;max-width:480px;border:1px solid #b9c4d1;border-radius:9px;background:#fff;padding:8px 10px;font-weight:900}iframe{width:100%;height:100%;border:0}.revision{position:fixed;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:9999;padding:5px 8px;border-radius:999px;background:#172238e8;border:1px solid #e3b53ce6;color:#fff;font-size:10px;font-weight:900;pointer-events:none}@media(max-width:760px){.bar{padding:8px 150px 8px 8px}.bar b,.bar small{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <b>Beta3 全27センター確認Lab</b>
    <small>6×6展示＋「みる」で大型表示</small>
    <select id="siteSelect" aria-label="世界遺産を選択">
      <option value="horyuji" data-name="法隆寺地域の仏教建造物" data-type="文化">01 法隆寺地域の仏教建造物</option>
      <option value="himeji" data-name="姫路城" data-type="文化">02 姫路城</option>
      <option value="yakushima" data-name="屋久島" data-type="自然">03 屋久島</option>
      <option value="shirakami" data-name="白神山地" data-type="自然">04 白神山地</option>
      <option value="kyoto" data-name="古都京都の文化財" data-type="文化">05 古都京都の文化財</option>
      <option value="shirakawago" data-name="白川郷・五箇山の合掌造り集落" data-type="文化">06 白川郷・五箇山の合掌造り集落</option>
      <option value="hiroshima" data-name="原爆ドーム" data-type="文化">07 原爆ドーム</option>
      <option value="itsukushima" data-name="厳島神社" data-type="文化">08 厳島神社</option>
      <option value="nara" data-name="古都奈良の文化財" data-type="文化">09 古都奈良の文化財</option>
      <option value="nikko" data-name="日光の社寺" data-type="文化">10 日光の社寺</option>
      <option value="ryukyu" data-name="琉球王国のグスク及び関連遺産群" data-type="文化">11 琉球王国のグスク及び関連遺産群</option>
      <option value="kii" data-name="紀伊山地の霊場と参詣道" data-type="文化">12 紀伊山地の霊場と参詣道</option>
      <option value="shiretoko" data-name="知床" data-type="自然">13 知床</option>
      <option value="iwami" data-name="石見銀山遺跡とその文化的景観" data-type="文化">14 石見銀山遺跡とその文化的景観</option>
      <option value="ogasawara" data-name="小笠原諸島" data-type="自然">15 小笠原諸島</option>
      <option value="hiraizumi" data-name="平泉" data-type="文化">16 平泉</option>
      <option value="fujisan" data-name="富士山―信仰の対象と芸術の源泉" data-type="文化">17 富士山―信仰の対象と芸術の源泉</option>
      <option value="tomioka" data-name="富岡製糸場と絹産業遺産群" data-type="文化">18 富岡製糸場と絹産業遺産群</option>
      <option value="meiji-industrial" data-name="明治日本の産業革命遺産" data-type="文化">19 明治日本の産業革命遺産</option>
      <option value="le-corbusier" data-name="ル・コルビュジエの建築作品（国立西洋美術館）" data-type="文化">20 ル・コルビュジエの建築作品（国立西洋美術館）</option>
      <option value="okinoshima" data-name="「神宿る島」宗像・沖ノ島と関連遺産群" data-type="文化">21 「神宿る島」宗像・沖ノ島と関連遺産群</option>
      <option value="hidden-christian" data-name="長崎と天草地方の潜伏キリシタン関連遺産" data-type="文化">22 長崎と天草地方の潜伏キリシタン関連遺産</option>
      <option value="mozu-furuichi" data-name="百舌鳥・古市古墳群" data-type="文化">23 百舌鳥・古市古墳群</option>
      <option value="amami-okinawa" data-name="奄美大島、徳之島、沖縄島北部及び西表島" data-type="自然">24 奄美大島、徳之島、沖縄島北部及び西表島</option>
      <option value="jomon" data-name="北海道・北東北の縄文遺跡群" data-type="文化">25 北海道・北東北の縄文遺跡群</option>
      <option value="sado" data-name="佐渡島の金山" data-type="文化">26 佐渡島の金山</option>
      <option value="asuka-fujiwara" data-name="飛鳥・藤原の宮都" data-type="文化">27 飛鳥・藤原の宮都</option>
    </select>
  </div>
  <iframe id="f" title="Beta3 center"></iframe>
</div>
<div class="revision">CENTER LAB / r20260903-01</div>
<script>
(()=>{'use strict';
const f=document.getElementById('f'),sel=document.getElementById('siteSelect');
const approvedSlug=id=>id==='shirakawago'?'gokayama':id;
function selected(){return sel.selectedOptions[0]}
function openSite(){
  const o=selected();
  sessionStorage.setItem('whqCenterLabSite',o.value);
  sessionStorage.setItem('whqActiveHeritageId',o.value);
  sessionStorage.setItem('whqActiveHeritageName',o.dataset.name);
  sessionStorage.setItem('whqActiveHeritageType',o.dataset.type);
  f.src='research-center-beta3.html?lab=1&nocache='+Date.now();
}
function enhanceFrame(){
  let d;try{d=f.contentDocument}catch(_){return}if(!d)return;
  const old=d.getElementById('centerLab6x6Style');if(old)old.remove();
  const style=d.createElement('style');style.id='centerLab6x6Style';style.textContent=`
/* Center Lab r20260903-01: 6x6 exhibit visual only. Collision remains the current 2x2 footprint for this visual test. */
.obj.display{
  width:calc(var(--cell)*6)!important;
  height:calc(var(--cell)*6)!important;
  transform:translate(-41.6667%,-41.6667%)!important;
  z-index:4!important;
}
.obj.display.near{
  transform:translate(-41.6667%,-41.6667%)!important;
}
.obj.display:after{
  left:3%!important;
  top:1%!important;
  width:94%!important;
  height:84%!important;
  background-position:center!important;
  background-size:contain!important;
  background-repeat:no-repeat!important;
}
.obj.display:before{
  left:34%!important;
  right:34%!important;
  bottom:4%!important;
  height:10%!important;
  border-width:3px!important;
}
.obj.display .badge{
  right:29%!important;
  top:auto!important;
  bottom:5%!important;
  z-index:20!important;
}
.card.labDisplayDetail{width:min(1040px,96vw)!important;padding:16px!important}
.labHero{min-width:0;display:grid;grid-template-rows:auto 1fr;gap:8px;background:#f4efe4;border:2px solid #d4b05a;border-radius:14px;padding:12px;overflow:hidden}
.labHeroLabel{font-size:11px;font-weight:1000;color:#655638;letter-spacing:.04em}
.labHeroStage{min-height:260px;display:grid;place-items:center;background:linear-gradient(#f8f4eb,#e7dac5);border-radius:10px;overflow:hidden}
.labHeroStage img{display:block;width:100%;height:100%;max-height:520px;object-fit:contain;filter:drop-shadow(0 8px 5px rgba(38,29,20,.28))}
.labDetailText{min-width:0}
@media (orientation:landscape) and (min-width:700px){
  .card.labDisplayDetail{display:grid!important;grid-template-columns:minmax(0,1.08fr) minmax(300px,.92fr)!important;gap:16px!important;overflow:hidden!important}
  .labHeroStage{min-height:390px}
  .labDetailText{overflow:auto;max-height:calc(88vh - 38px);padding-right:3px}
  .labDetailText .photoGrid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .labDetailText .photoGrid img{height:105px!important}
}
@media (orientation:portrait),(max-width:699px){
  .card.labDisplayDetail{display:block!important;overflow:auto!important}
  .labHero{margin-bottom:14px}
  .labHeroStage{min-height:240px;max-height:45vh}
}
`;
  d.head.appendChild(style);
  const action=d.getElementById('action'),card=d.getElementById('card');
  if(!action||!card)return;
  function clearDetailClass(){if(!card.querySelector('.labHero'))card.classList.remove('labDisplayDetail')}
  const Observer=f.contentWindow.MutationObserver||MutationObserver;
  const observer=new Observer(clearDetailClass);observer.observe(card,{childList:true,subtree:true});
  function enhanceDisplayModal(){
    if(!card||card.querySelector('.labHero'))return;
    const h2=card.querySelector('h2');if(!h2||h2.textContent.trim()!=='展示')return;
    const o=selected(),wrap=d.createElement('div');wrap.className='labDetailText';
    while(card.firstChild)wrap.appendChild(card.firstChild);
    const hero=d.createElement('div');hero.className='labHero';
    const label=d.createElement('div');label.className='labHeroLabel';label.textContent=o.dataset.name+'｜確定グラフィック';
    const stage=d.createElement('div');stage.className='labHeroStage';
    const img=d.createElement('img');img.src='docs/assets/heritage-graphics/approved/'+approvedSlug(o.value)+'.webp';img.alt=o.dataset.name+'の確定グラフィック';
    stage.appendChild(img);hero.append(label,stage);card.append(hero,wrap);card.classList.add('labDisplayDetail');
  }
  d.addEventListener('click',e=>{
    const t=e.target&&typeof e.target.closest==='function'?e.target:null;if(!t)return;
    const displayTap=t.closest('.obj.display');
    const actionTap=t.closest('#action');
    if(displayTap||(actionTap&&actionTap.textContent.trim()==='みる'))setTimeout(enhanceDisplayModal,0);
  },true);
}
const saved=sessionStorage.getItem('whqCenterLabSite')||sessionStorage.getItem('whqActiveHeritageId');
if(saved&&[...sel.options].some(o=>o.value===saved))sel.value=saved;
sel.addEventListener('change',openSite);f.addEventListener('load',enhanceFrame);openSite();
})();
</script>
</body>
</html>
