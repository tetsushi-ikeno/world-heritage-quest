<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>世界遺産クエスト｜研究センター Beta3</title>
<style>
:root{--cell:38px;--ink:#1d2940;--navy:#172238;--gold:#e3b53c;--floor:#c99c66;--wall:#6c4b36}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9c19b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:var(--ink);user-select:none}button{font:inherit}
.game{height:100%;display:grid;grid-template-rows:52px 1fr 70px}.hud{display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#fff8e9;border-bottom:2px solid #8a6948}.hud b{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:15px}.hud span{font-size:10px;font-weight:900;color:#6b5b49}
.main{min-height:0;display:grid;grid-template-columns:1fr 184px}.roomWrap{display:grid;place-items:center;overflow:hidden;background:linear-gradient(#c9ad7d,#ad8258)}.room{display:grid;box-shadow:0 14px 28px #20160f55,inset 0 0 0 5px #4d3223;background:#6b4b35}.cell{width:var(--cell);height:var(--cell);position:relative;display:grid;place-items:center}.wall{background:linear-gradient(90deg,#60432f,#76533b,#5a3e2c);box-shadow:inset 0 -5px #3e2b20}.floor{background:repeating-linear-gradient(90deg,#c99c66 0 calc(var(--cell) - 1px),#b78351 calc(var(--cell) - 1px) var(--cell));box-shadow:inset 0 1px #e6c69455}.exit{background:#8d6847;color:#fff;font-size:10px;font-weight:1000;border:2px solid #4f3828}
.obj{width:86%;height:86%;display:grid;place-items:center;position:relative;font-weight:1000;z-index:3}.book:before{content:"";width:28px;height:32px;background:linear-gradient(90deg,#673821 0 8px,#a95c36 8px 24px,#d5aa63 24px 28px);border:2px solid #3c281d;border-radius:2px;transform:rotate(-5deg)}.researcher:before{content:"";width:23px;height:33px;background:linear-gradient(#efbd86 0 42%,#d8e2df 43%);border:2px solid #4b4a46;border-radius:7px 7px 3px 3px}.quiz:before{content:"?";width:38px;height:34px;display:grid;place-items:center;background:#d6bc80;border:3px solid #584531;border-radius:5px;color:#6f455e;font:900 23px Georgia,serif;box-shadow:0 6px 0 #76583b}
.display{width:calc(var(--cell)*2);height:calc(var(--cell)*2);transform:translate(25%,25%);z-index:4;pointer-events:none}.display:before{content:"";position:absolute;left:8%;right:8%;bottom:4%;height:18%;background:#9a7149;border:3px solid #4d3827;border-radius:3px;box-shadow:inset 0 3px #d9b77a}.display:after{content:"";position:absolute;left:12%;top:6%;width:76%;height:72%}
body.site-himeji .display:after{background:linear-gradient(#f8f5ea 0 0) 50% 58%/66% 45% no-repeat,linear-gradient(#e7e0cc 0 0) 50% 34%/50% 27% no-repeat,linear-gradient(135deg,transparent 48%,#d7d0be 49% 52%,transparent 53%) 50% 13%/74% 32% no-repeat,linear-gradient(225deg,transparent 48%,#d7d0be 49% 52%,transparent 53%) 50% 13%/74% 32% no-repeat;filter:drop-shadow(0 3px 0 #5a4635)}
body.site-shirakawago .display:after{background:linear-gradient(60deg,transparent 0 49%,#6b5138 50% 53%,transparent 54%),linear-gradient(120deg,transparent 0 49%,#6b5138 50% 53%,transparent 54%),linear-gradient(#dfc48d 0 0) 50% 70%/62% 30% no-repeat;clip-path:polygon(50% 0,100% 58%,88% 58%,88% 100%,12% 100%,12% 58%,0 58%)}
body.site-yakushima .display:after{background:radial-gradient(circle at 50% 28%,#3d6b3c 0 20%,transparent 21%),radial-gradient(circle at 35% 36%,#507f49 0 22%,transparent 23%),radial-gradient(circle at 65% 40%,#416f42 0 23%,transparent 24%),linear-gradient(#76563d 0 0) 50% 82%/16% 52% no-repeat,linear-gradient(#5d8b53 0 0) 50% 95%/95% 14% no-repeat}
.badge{position:absolute;right:-7px;top:-8px;width:21px;height:21px;border-radius:50%;display:none;place-items:center;border:2px solid #fff;background:#e14747;color:#fff;font-size:11px;z-index:8}.badge.show{display:grid}.badge.done{display:grid;background:var(--gold);color:#26354b}
.player{width:68%;height:78%;background:#3157a3;border:2px solid #243b69;box-shadow:0 -7px 0 -4px #f1c49e;z-index:6;filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff)}
.side{border-left:2px solid #8c6b4b;background:#f8f3e8;display:grid;grid-template-rows:auto 1fr auto;gap:9px;padding:12px}.action{width:100%;min-height:60px;border:2px solid var(--gold);border-radius:13px;background:var(--navy);color:#fff;font-size:15px;font-weight:1000;box-shadow:0 4px 0 #5e452f}.action:disabled{opacity:.38;background:#667387;border-color:#9ea9b7}.target{text-align:center;font-size:10px;color:#65748a;font-weight:900;margin-top:5px}.joy{align-self:center;position:relative;width:138px;height:138px;margin:auto;border-radius:50%;background:radial-gradient(circle,#e3ebf4 0 30%,#263a59 31% 34%,#18263e 35% 100%);border:2px solid #879bb8;touch-action:none}.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(#edf3fa,#bac9dc);border:2px solid #fff}.mark{position:absolute;color:#dce6f4;font-weight:1000}.u{top:7px;left:50%;transform:translateX(-50%)}.d{bottom:7px;left:50%;transform:translateX(-50%)}.l{left:8px;top:50%;transform:translateY(-50%)}.r{right:8px;top:50%;transform:translateY(-50%)}.hint{text-align:center;font-size:9px;line-height:1.5;font-weight:900;color:#617087}.message{background:#fff9e8;border-top:2px solid #9b7850;padding:9px 14px;display:grid;align-content:center}.message b{font-size:10px}.message p{font-size:12px;font-weight:800;margin:3px 0}
.modal{position:fixed;inset:0;z-index:50;background:#17223899;display:none;place-items:center;padding:18px}.modal.show{display:grid}.card{width:min(760px,92vw);max-height:88vh;overflow:auto;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:18px}.card h2{margin:0 0 10px}.card p{font-size:15px;line-height:1.6;font-weight:800}.photo{width:100%;max-height:280px;object-fit:cover;border-radius:10px;margin-top:10px}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.photoGrid img{width:100%;height:120px;object-fit:cover;border-radius:8px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip,.source{background:#f2f5f8;border:1px solid #cbd4dd;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.choices{display:grid;gap:8px}.choice{width:100%;text-align:left;padding:11px 13px;border:2px solid #c8d2de;border-radius:10px;background:#fff;font-weight:900}.choice.correct{border-color:#5a9d6b;background:#eef9f1}.choice.wrong{border-color:#cf7278;background:#fff2f2}.next,.close{margin-top:12px;min-width:110px;min-height:44px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:1000}.next{display:none}.next.show{display:inline-block}.result{text-align:center;padding:16px}.result strong{display:block;font-size:30px;margin:10px}.loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:#e9edf2;font-size:13px;font-weight:900}.loading.hide{display:none}
@media(max-width:980px) and (orientation:landscape){:root{--cell:34px}.main{grid-template-columns:1fr 164px}.joy{width:122px;height:122px}.card p{font-size:13px}}
</style>

<body><div class="game"><header class="hud"><b id="title">研究センター</b><span id="starHud">★ 0 / 100</span></header><main class="main"><section class="roomWrap"><div id="room" class="room"></div></section><aside class="side"><div><button id="action" class="action" disabled>アクション</button><div id="target" class="target">対象に近づこう</div></div><div id="joy" class="joy"><span class="mark u">▲</span><span class="mark d">▼</span><span class="mark l">◀</span><span class="mark r">▶</span><div id="knob" class="knob"></div></div><div class="hint">近づくだけでアクション可能<br>最も近い対象を自動選択</div></aside></main><footer id="message" class="message"><b>研究センター</b><p>気になる展示や人に近づいてみよう。</p></footer></div>
<div id="modal" class="modal"><div id="card" class="card"></div></div><div id="loading" class="loading">研究センターを準備しています…</div>
<script src="beta-save.js?v=r20260831-02"></script>
<script>
(()=>{'use strict';
const siteId=sessionStorage.getItem('whqActiveHeritageId')||'himeji',siteName=sessionStorage.getItem('whqActiveHeritageName')||'姫路城';
document.body.classList.add('site-'+siteId);
const rows=['##################','#####...Q...######','#####........#####','####..........####','###..B......R...##','###............###','###.....DX.....###','###.....XX.....###','###............###','#####........#####','######..E..#######'];
const meta={D:{id:'display',label:'展示',action:'みる'},B:{id:'book',label:'本',action:'よむ'},R:{id:'researcher',label:'調査員',action:'はなす'},Q:{id:'quiz',label:'腕試し',action:'ちょうせん'}};
let player={x:9,y:9},target=null,content=null,criteriaLabels={1:'基準1：人類の創造的傑作',2:'基準2：文化交流',3:'基準3：文化・文明の証拠',4:'基準4：建築・技術の代表例',5:'基準5：伝統的集落・土地利用',6:'基準6：出来事・思想との関連',7:'基準7：すぐれた自然美',8:'基準8：地球の歴史',9:'基準9：生態系の過程',10:'基準10：生物多様性'};
let quizIndex=0,quizScore=0,repeat=null;
function starsHtml(a,count){let h='<div class="quizStars" aria-label="星の取得状況">';for(let i=0;i<count;i++)h+='<span class="'+(a[i]?'starOn':'starOff')+'">★</span>';return h+'</div>'}
function updateStarHud(){const el=document.getElementById('starHud');if(el)el.textContent='★ '+WHQBetaSave.totalStarCount()+' / 100'}
const room=document.getElementById('room'),action=document.getElementById('action'),targetEl=document.getElementById('target'),message=document.getElementById('message'),joy=document.getElementById('joy'),knob=document.getElementById('knob'),modal=document.getElementById('modal'),card=document.getElementById('card');
document.getElementById('title').textContent=siteName+' 研究センター';
const state=()=>WHQBetaSave.centerState(siteId),tile=(x,y)=>rows[y]?.[x]||'#',blocked=(x,y)=>'#DBRQX'.includes(tile(x,y)),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function done(id){WHQBetaSave.setCenterState(siteId,{[id]:true})}function setMsg(t,x){message.innerHTML='<b>'+esc(t)+'</b><p>'+esc(x)+'</p>'}function dist(ax,ay,bx,by){return Math.abs(ax-bx)+Math.abs(ay-by)}
function targets(){const list=[];for(let y=0;y<rows.length;y++)for(let x=0;x<rows[y].length;x++){const c=tile(x,y);if(meta[c])list.push({x,y,...meta[c],type:'obj'});else if(c==='E')list.push({x,y,label:'出口',action:'でる',type:'exit'})}return list}
function findTarget(){document.querySelectorAll('.obj.near').forEach(o=>o.classList.remove('near'));const near=targets().map(t=>({...t,d:dist(player.x,player.y,t.x,t.y)})).filter(t=>t.d<=2).sort((a,b)=>a.d-b.d||a.y-b.y||a.x-b.x);target=near[0]||null;action.disabled=!target;action.textContent=target?.action||'アクション';targetEl.textContent=target?target.label+' にアクション':'対象に近づこう';if(target?.type==='obj')document.querySelector('.obj[data-object-id="'+target.id+'"]')?.classList.add('near')}
function render(){const s=state();room.innerHTML='';room.style.gridTemplateColumns='repeat('+rows[0].length+',var(--cell))';room.style.gridTemplateRows='repeat('+rows.length+',var(--cell))';for(let y=0;y<rows.length;y++)for(let x=0;x<rows[y].length;x++){const c=tile(x,y),cell=document.createElement('div');cell.className='cell '+(c==='#'?'wall':c==='E'?'exit':'floor');if(c==='E')cell.textContent='出';if(meta[c]){const m=meta[c],o=document.createElement('div');o.className='obj '+m.id;o.dataset.objectId=m.id;const d=dist(player.x,player.y,x,y);o.classList.toggle('visited',!!s[m.id]);o.classList.toggle('actionable',d<=2);o.onclick=e=>{if(e.target.closest('.badge'))return;if(d<=2){e.preventDefault();e.stopPropagation();use(m.id)}};const b=document.createElement('button');b.type='button';b.className='badge';b.setAttribute('aria-label',m.label+'を調べる');b.dataset.objectId=m.id;if(s[m.id]){b.classList.add('done');b.textContent='✓'}else if(d<=2){b.classList.add('show');b.textContent='!'}b.onclick=e=>{e.preventDefault();e.stopPropagation();if(d<=2)use(m.id)};o.appendChild(b);cell.appendChild(o)}if(x===player.x&&y===player.y){const p=document.createElement('div');p.className='player';cell.appendChild(p)}room.appendChild(cell)}findTarget()}
function move(dx,dy){const nx=player.x+dx,ny=player.y+dy;if(!blocked(nx,ny)){player={x:nx,y:ny};render()}}
function open(html){card.innerHTML=html+'<button class="close" id="close">閉じる</button>';modal.classList.add('show');document.getElementById('close').onclick=()=>modal.classList.remove('show')}
function use(id){if(id==='book'){done('book');render();const chips=(content?.book?.criteria||[]).map(n=>'<span class="chip">'+esc(criteriaLabels[n])+'</span>').join('');open('<h2>本</h2><div class="chips">'+chips+'</div><p>'+esc(content?.book?.text||'登録情報を調べた。')+'</p>');setMsg('本','登録基準と、その理由を読んだ。')}else if(id==='display'){done('display');render();const base='docs/assets/heritage/'+siteId+'/';open('<h2>展示</h2><p>'+esc(content?.display||'この遺産の特徴を展示しているよ。')+'</p><div class="photoGrid"><img src="'+base+'01.jpg" alt="'+esc(siteName)+' 代表景観"><img src="'+base+'02.jpg" alt="'+esc(siteName)+' 景観"><img src="'+base+'03.jpg" alt="'+esc(siteName)+' 詳細"></div>');setMsg('展示','展示の特徴と写真を見た。')}else if(id==='researcher'){done('researcher');render();open('<h2>調査員</h2><p>'+esc(content?.researcher||'この遺産について調査中だよ。')+'</p>');setMsg('調査員','調査員から話を聞いた。')}else if(id==='quiz')startQuiz()}
function startQuiz(){quizIndex=0;quizScore=0;modal.classList.add('show');updateStarHud();renderQuiz()}
function renderQuiz(){const qs=content?.quiz||[];if(quizIndex>=qs.length){done('quiz');render();updateStarHud();const label=quizScore===qs.length?quizScore+' / '+qs.length+' 全問正解！':quizScore+' / '+qs.length+' 問正解';const earned=WHQBetaSave.heritageStars(siteId);card.innerHTML='<div class="result"><span class="source">腕試し終了</span>'+starsHtml(earned,qs.length)+'<strong>'+esc(label)+'</strong><p>この遺産の星 '+earned.filter(Boolean).length+' / '+qs.length+'　｜　合計 ★'+WHQBetaSave.totalStarCount()+'/100</p><p>'+(quizScore===qs.length?'すばらしい！ この遺産のことをしっかり調べられたね。':'まだ取っていない星に、もう一度挑戦してみよう。')+'</p><button class="close" id="again">もう一度</button><button class="close" id="close">閉じる</button></div>';document.getElementById('again').onclick=startQuiz;document.getElementById('close').onclick=()=>{modal.classList.remove('show');setMsg('腕試し',label)};return}
const q=qs[quizIndex],earned=WHQBetaSave.heritageStars(siteId);card.innerHTML='<div class="chips"><span class="source">'+esc(q.source)+'</span><span class="source">'+esc(q.difficulty)+'</span></div>'+starsHtml(earned,qs.length)+'<h2>'+(quizIndex+1)+' / '+qs.length+' 問</h2><p>'+esc(q.q)+'</p><div class="choices">'+q.choices.map(c=>'<button class="choice" data-v="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div><div id="fb"></div><button class="next" id="next">'+(quizIndex===2?'結果へ':'次の問題へ')+'</button>';
card.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(card.dataset.answered==='1')return;card.dataset.answered='1';const ok=b.dataset.v===q.answer;if(ok){quizScore++;WHQBetaSave.awardHeritageStar(siteId,quizIndex);updateStarHud();}card.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(x.dataset.v===q.answer)x.classList.add('correct');else if(x===b&&!ok)x.classList.add('wrong')});if(ok){const sr=card.querySelector('.quizStars');if(sr)sr.outerHTML=starsHtml(WHQBetaSave.heritageStars(siteId),qs.length)}document.getElementById('fb').innerHTML='<p><b>'+(ok?'せいかい！':'おしい！')+'</b><br>'+esc(q.explanation)+'</p>';document.getElementById('next').classList.add('show')});document.getElementById('next').onclick=()=>{delete card.dataset.answered;quizIndex++;renderQuiz()}}
action.onclick=()=>{if(!target)return;if(target.type==='exit'){parent.postMessage({type:'whqExitCenter',site:siteId},'*');return}use(target.id)};
let joyDir=null;function updateJoy(e,moveNow=false){const r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),len=Math.hypot(x,y);if(len<14){joyDir=null;knob.style.transform='translate(-50%,-50%)';return}const m=Math.min(30,len),a=Math.atan2(y,x);knob.style.transform='translate(calc(-50% + '+(Math.cos(a)*m)+'px),calc(-50% + '+(Math.sin(a)*m)+'px))';const next=Math.abs(x)>Math.abs(y)?[Math.sign(x),0]:[0,Math.sign(y)];const changed=!joyDir||joyDir[0]!==next[0]||joyDir[1]!==next[1];joyDir=next;if(moveNow&&changed)move(...joyDir)}
function stop(){if(repeat)clearInterval(repeat);repeat=null;joyDir=null;knob.style.transform='translate(-50%,-50%)'}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joy.setPointerCapture(e.pointerId);updateJoy(e,true);repeat=setInterval(()=>{if(joyDir)move(...joyDir)},135)});joy.addEventListener('pointermove',e=>{if(!repeat)return;e.preventDefault();updateJoy(e,true)});joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);['selectstart','contextmenu','dragstart'].forEach(type=>joy.addEventListener(type,e=>{e.preventDefault();e.stopPropagation()},{capture:true}));window.addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();move(...m)}});
fetch('data/beta3-vertical-slice.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{content=(j.sites||[]).find(s=>s.slug===siteId);if(!content){content=(j.sites||[])[0];setMsg('Beta3 Vertical Slice','現在は姫路城・白川郷/五箇山・屋久島の3遺産を作り込んでいます。')}document.body.className=document.body.className.replace(/site-[^\s]+/g,'').replace(/heritage-(natural|cultural)/g,'').trim();document.body.classList.add('site-'+content.slug);document.body.classList.add(content.kind==='natural'?'heritage-natural':'heritage-cultural');document.getElementById('loading').classList.add('hide');updateStarHud();render()}).catch(()=>{document.getElementById('loading').textContent='研究センターを読み込めませんでした'});
})();
</script></body></html>
