<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>遺産発見エフェクト Lab</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9eef3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:#1d2940}body{padding:18px}.lab{max-width:980px;margin:auto}.top{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}.top h1{margin:0;font-size:24px}.top p{margin:4px 0 0;color:#68778b;font-size:13px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.controls label{font-size:12px;font-weight:800}.controls select{min-height:42px;border:1px solid #b8c4d1;border-radius:10px;background:white;padding:0 12px;font:inherit}.card{margin-top:18px;background:#fff;border:1px solid #c8d2dc;border-radius:16px;padding:14px;box-shadow:0 4px 18px #24364b12}.card h2{margin:0 0 5px;font-size:16px}.card p{font-size:12px;line-height:1.5;color:#68778b}.preview{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:13px;background:linear-gradient(#a9d8f0 0 55%,#82b86b 55%);border:1px solid #b6c2ce}.map-object{position:absolute;left:46%;top:47%;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #ffffff55,0 0 14px #fff;animation:blink 1s infinite alternate}.map-label{position:absolute;left:14px;top:12px;padding:6px 9px;border-radius:999px;background:#172238df;color:#fff;font-size:10px;font-weight:900}.stage{position:absolute;inset:0;pointer-events:none}.iris{position:absolute;inset:0;background:#000;clip-path:circle(0% at 50% 50%);z-index:2}.discovery{position:absolute;inset:0;display:grid;grid-template-rows:18% 64% 18%;background:#000;opacity:0;z-index:3}.titleBand,.messageBand{display:flex;align-items:center;justify-content:center;background:#000;padding:0 24px;text-align:center}.titleBand{font-family:"Yu Mincho","Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif JP",serif;color:#f4d06f;font-size:clamp(14px,2.1vw,25px);font-weight:700;letter-spacing:.04em}.messageBand{font-family:"Yu Mincho","Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif JP",serif;color:#fff;font-size:clamp(13px,1.7vw,20px);font-weight:700;letter-spacing:.08em}.photoWrap{background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}.photoWrap img{width:100%;height:100%;object-fit:cover;transform:scale(.96);opacity:0}.play{width:100%;min-height:48px;margin-top:10px;border:0;border-radius:11px;background:#172238;color:white;font-weight:900}.play:active{transform:translateY(1px)}.note{margin-top:18px;padding:14px 16px;border-left:4px solid #7a8fa5;background:#fff;font-size:13px;line-height:1.6}.time{font-variant-numeric:tabular-nums;font-weight:900}@keyframes blink{from{opacity:.35}to{opacity:1}}</style></head><body><main class="lab"><div class="top"><div><h1>遺産発見エフェクト Lab</h1><p>Beta2候補：円形フォーカス＋上下黒帯タイトル</p></div><div class="controls"><label>演出時間 <select id="speed"><option value="0.8">0.8秒</option><option value="1.0" selected>1.0秒</option><option value="1.2">1.2秒</option></select></label><label>文字色 <select id="tone"><option value="gold" selected>上：黄金／下：白</option><option value="white">上下：白</option></select></label></div></div><article class="card"><h2>C. 円形フォーカス — Beta2候補</h2><p>中央から黒が広がって画面を覆ったあと、黒帯の間に遺産写真を表示します。写真には文字を重ねず、上帯に正式名称、下帯に発見メッセージを表示します。</p><div class="preview" id="preview"><div class="map-label">富士山の近く</div><div class="map-object"></div><div class="stage"><div class="iris"></div><div class="discovery"><div class="titleBand">世界遺産：富士山 信仰の対象と芸術の源泉</div><div class="photoWrap"><img src="docs/assets/heritage/fujisan/01.jpg" alt="富士山"></div><div class="messageBand">新しい世界遺産を発見した</div></div></div></div><button class="play" id="play">再生 <span class="time">1.0秒</span></button></article><div class="note"><strong>確認ポイント：</strong>1.0秒で「特別な発見感」は出るか、上下の黒帯が写真の邪魔にならないか、明朝体＋黄金/白の文字が世界遺産らしい格式に見えるかを確認してください。</div></main><script>(()=>{'use strict';const speed=document.getElementById('speed'),tone=document.getElementById('tone'),play=document.getElementById('play'),preview=document.getElementById('preview'),iris=preview.querySelector('.iris'),discovery=preview.querySelector('.discovery'),img=preview.querySelector('img'),title=preview.querySelector('.titleBand'),time=document.querySelector('.time');const sleep=ms=>new Promise(r=>setTimeout(r,ms));function reset(){iris.removeAttribute('style');discovery.removeAttribute('style');img.removeAttribute('style')}function applyTone(){if(tone.value==='white'){title.style.color='#fff'}else{title.style.color='#f4d06f'}}async function run(){reset();applyTone();const t=Number(speed.value)*1000;time.textContent=Number(speed.value).toFixed(1)+'秒';iris.style.transition=`clip-path ${t*.48}ms cubic-bezier(.55,0,.9,.5)`;requestAnimationFrame(()=>iris.style.clipPath='circle(82% at 50% 50%)');await sleep(t*.5);discovery.style.opacity='1';discovery.style.transition=`opacity ${t*.08}ms linear`;img.style.opacity='1';img.style.transform='scale(1)';img.style.transition=`opacity ${t*.16}ms ease,transform ${t*.28}ms ease-out`;await sleep(t*.22)}play.addEventListener('click',run);speed.addEventListener('change',()=>time.textContent=Number(speed.value).toFixed(1)+'秒');tone.addEventListener('change',applyTone);applyTone();})();</script></body></html>
