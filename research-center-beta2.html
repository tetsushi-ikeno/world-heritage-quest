<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>世界遺産クエスト｜研究センター Beta2</title><style>:root{--cell:40px;--ink:#1d2940;--navy:#172238;--gold:#e3b53c;--floor:#d5c29e;--wall:#dbe4d9}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9edf2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:var(--ink);user-select:none}button{font:inherit}.game{height:100%;display:grid;grid-template-rows:52px 1fr 70px}.hud{display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#fff;border-bottom:1px solid #c6cfdb}.hud b{font-size:15px}.hud span{font-size:10px;font-weight:900;color:#6b788b}.main{min-height:0;display:grid;grid-template-columns:1fr 184px}.roomWrap{display:grid;place-items:center;overflow:hidden}.room{display:grid;box-shadow:0 10px 24px #2834452e}.cell{width:var(--cell);height:var(--cell);position:relative;display:grid;place-items:center}.wall{background:var(--wall);border:1px solid #c6d0c7}.floor{background:var(--floor);border:1px solid #c7ad82}.exit{background:#9aabba;border:2px solid #64778c;color:#fff;font-size:10px;font-weight:1000}.obj{width:78%;height:78%;display:grid;place-items:center;border:2px solid #596678;border-radius:6px;font-weight:1000;font-size:11px;position:relative}.display{background:#dce8dc}.book{background:#d8bd88}.researcher{background:#eef2f5}.quiz{background:#e6d9ef}.badge{position:absolute;right:-8px;top:-9px;width:20px;height:20px;border-radius:50%;display:none;place-items:center;border:2px solid #fff;background:#e14747;color:#fff;font-size:11px}.badge.show{display:grid}.badge.done{display:grid;background:var(--gold);color:#26354b}.player{width:64%;height:64%;background:#3157a3;border:2px solid #243b69;box-shadow:0 -7px 0 -4px #f1c49e;z-index:5}.side{border-left:1px solid #cad3dd;background:#fff;display:grid;grid-template-rows:auto 1fr auto;gap:9px;padding:12px}.action{width:100%;min-height:56px;border:2px solid var(--gold);border-radius:13px;background:var(--navy);color:#fff;font-size:14px;font-weight:1000}.action:disabled{opacity:.38;background:#667387;border-color:#9ea9b7}.target{text-align:center;font-size:9px;color:#65748a;font-weight:900;margin-top:4px}.joy{align-self:center;position:relative;width:138px;height:138px;margin:auto;border-radius:50%;background:radial-gradient(circle,#e3ebf4 0 30%,#263a59 31% 34%,#18263e 35% 100%);border:2px solid #879bb8;touch-action:none}.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(#edf3fa,#bac9dc);border:2px solid #fff}.mark{position:absolute;color:#dce6f4;font-weight:1000}.u{top:7px;left:50%;transform:translateX(-50%)}.d{bottom:7px;left:50%;transform:translateX(-50%)}.l{left:8px;top:50%;transform:translateY(-50%)}.r{right:8px;top:50%;transform:translateY(-50%)}.hint{text-align:center;font-size:9px;line-height:1.5;font-weight:900;color:#617087}.message{background:#fff9e8;border-top:1px solid #dccb95;padding:9px 14px;display:grid;align-content:center}.message b{font-size:10px}.message p{font-size:12px;font-weight:800;margin:3px 0}.modal{position:fixed;inset:0;z-index:50;background:#17223899;display:none;place-items:center;padding:18px}.modal.show{display:grid}.card{width:min(760px,92vw);max-height:88vh;overflow:auto;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:18px}.card h2{margin:0 0 10px}.card p{font-size:15px;line-height:1.6;font-weight:800}.photo{width:100%;max-height:310px;object-fit:cover;border-radius:10px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f2f5f8;border:1px solid #cbd4dd;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.choices{display:grid;gap:8px}.choice{width:100%;text-align:left;padding:11px 13px;border:2px solid #c8d2de;border-radius:10px;background:#fff;font-weight:900}.choice.correct{border-color:#5a9d6b;background:#eef9f1}.choice.wrong{border-color:#cf7278;background:#fff2f2}.close{margin-top:12px;min-width:110px;min-height:44px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:1000}.loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:#e9edf2;font-size:13px;font-weight:900}.loading.hide{display:none}@media(max-width:980px) and (orientation:landscape){:root{--cell:34px}.main{grid-template-columns:1fr 164px}.joy{width:122px;height:122px}.card p{font-size:13px}}</style></head><body><div class="game"><header class="hud"><b id="title">研究センター</b><span>奥へ進むと腕試し</span></header><main class="main"><section class="roomWrap"><div id="room" class="room"></div></section><aside class="side"><div><button id="action" class="action" disabled>アクション</button><div id="target" class="target">対象に近づこう</div></div><div id="joy" class="joy"><span class="mark u">▲</span><span class="mark d">▼</span><span class="mark l">◀</span><span class="mark r">▶</span><div id="knob" class="knob"></div></div><div class="hint">まず近づいてから調べよう<br>ぶつかった時は通路側へ補正</div></aside></main><footer id="message" class="message"><b>研究センター</b><p>奥へ進みながら、気になるものを調べてみよう。</p></footer></div><div id="modal" class="modal"><div id="card" class="card"></div></div><div id="loading" class="loading">研究センターを準備しています…</div><script src="beta-save.js"></script><script>(()=>{'use strict';const siteId=sessionStorage.getItem('whqActiveHeritageId')||'shiretoko',siteName=sessionStorage.getItem('whqActiveHeritageName')||'知床';const rows=['###############','#######Q#######','#######.#######','#######B#######','######...######','###..#####..###','###R.##D##..###','###.........###','#######.#######','#######E#######'];const meta={D:{id:'display',label:'展示',action:'みる',icon:'展'},B:{id:'book',label:'本',action:'よむ',icon:'本'},R:{id:'researcher',label:'調査員',action:'はなす',icon:'調'},Q:{id:'quiz',label:'腕試し',action:'ちょうせん',icon:'腕'}};let player={x:7,y:8},target=null,content=null,criteriaLabels={},lastH=0,lastV=-1,repeat=null;const room=document.getElementById('room'),action=document.getElementById('action'),targetEl=document.getElementById('target'),message=document.getElementById('message'),joy=document.getElementById('joy'),knob=document.getElementById('knob'),modal=document.getElementById('modal'),card=document.getElementById('card');document.getElementById('title').textContent=siteName+' 研究センター';const state=()=>WHQBetaSave.centerState(siteId),tile=(x,y)=>rows[y]?.[x]||'#',blocked=(x,y)=>'#DBRQE'.includes(tile(x,y)),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function done(id){WHQBetaSave.setCenterState(siteId,{[id]:true})}function setMsg(t,x){message.innerHTML='<b>'+esc(t)+'</b><p>'+esc(x)+'</p>'}function distance(x,y){return Math.abs(player.x-x)+Math.abs(player.y-y)}function render(){const s=state();room.innerHTML='';room.style.gridTemplateColumns=`repeat(${rows[0].length},var(--cell))`;room.style.gridTemplateRows=`repeat(${rows.length},var(--cell))`;for(let y=0;y<rows.length;y++)for(let x=0;x<rows[0].length;x++){const c=tile(x,y),cell=document.createElement('div');cell.className='cell '+(c==='#'?'wall':c==='E'?'exit':'floor');if(c==='E')cell.textContent='出';if(meta[c]){const m=meta[c],o=document.createElement('div');o.className='obj '+m.id;o.textContent=m.icon;const b=document.createElement('i');b.className='badge';if(s[m.id]){b.classList.add('done');b.textContent='✓'}else if(distance(x,y)<=2){b.classList.add('show');b.textContent='!'}o.appendChild(b);cell.appendChild(o)}if(x===player.x&&y===player.y){const p=document.createElement('div');p.className='player';cell.appendChild(p)}room.appendChild(cell)}findTarget()}function findTarget(){target=null;for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){const c=tile(player.x+dx,player.y+dy);if(meta[c]){target={type:'obj',...meta[c]};break}if(c==='E'){target={type:'exit',label:'出口',action:'でる'};break}}action.disabled=!target;action.textContent=target?.action||'アクション';targetEl.textContent=target?.label||'対象に近づこう'}function tryMove(dx,dy){if(dx)lastH=dx;if(dy)lastV=dy;const nx=player.x+dx,ny=player.y+dy;if(!blocked(nx,ny)){player={x:nx,y:ny};render();return}const candidates=[];if(dy){if(lastH)candidates.push([lastH,0],[-lastH,0]);else candidates.push([-1,0],[1,0])}else{if(lastV)candidates.push([0,lastV],[0,-lastV]);else candidates.push([0,-1],[0,1])}for(const [sx,sy] of candidates){if(!blocked(player.x+sx,player.y+sy)){player={x:player.x+sx,y:player.y+sy};render();return}}}function open(html){delete card.dataset.answered;card.innerHTML=html+'<button id="close" class="close">閉じる</button>';modal.classList.add('show');document.getElementById('close').onclick=()=>modal.classList.remove('show')}function use(id){if(id==='display'){done(id);render();open(`<h2>展示</h2><img class="photo" src="docs/assets/heritage/${siteId}/01.jpg" alt="${esc(siteName)}"><p>${esc(content?.display||'この遺産の特徴を展示しているよ。')}</p>`);setMsg('展示','展示を見た。')}else if(id==='researcher'){done(id);render();open(`<h2>調査員</h2><p>${esc(content?.researcher||'この遺産について調べているよ。')}</p>`);setMsg('調査員','調査員の話を聞いた。')}else if(id==='book'){done(id);render();const labels=(content?.criteria||[]).map(n=>criteriaLabels[String(n)]||'基準'+n);open(`<h2>本</h2><p><b>${esc(content?.year||'—')}年に世界遺産登録</b></p><div class="chips">${labels.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')}</div>`);setMsg('本','登録情報を読んだ。')}else if(id==='quiz')startQuiz()}function startQuiz(){const q=(content?.quiz||[])[0];if(!q){open('<h2>腕試し</h2><p>問題を準備中です。</p>');return}delete card.dataset.answered;card.innerHTML=`<h2>腕試し</h2><p>${esc(q.q)}</p><div class="choices">${q.choices.map(x=>`<button class="choice" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div><div id="fb"></div><button id="close" class="close">閉じる</button>`;modal.classList.add('show');document.getElementById('close').onclick=()=>modal.classList.remove('show');card.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(card.dataset.answered)return;card.dataset.answered='1';const ok=b.dataset.v===q.answer;b.classList.add(ok?'correct':'wrong');if(!ok)[...card.querySelectorAll('.choice')].find(x=>x.dataset.v===q.answer)?.classList.add('correct');document.getElementById('fb').innerHTML=`<p>${esc(q.explanation||'')}</p>`;done('quiz');render();setMsg('腕試し',ok?'正解！':'答えを確認した。')})}action.onclick=()=>{if(!target)return;if(target.type==='exit'){parent.postMessage({type:'whqExitCenter',site:siteId},'*');return}use(target.id)};function directionFromPoint(e){const r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);if(Math.hypot(x,y)<18)return null;return Math.abs(x)>Math.abs(y)?[Math.sign(x),0]:[0,Math.sign(y)]}function stop(){if(repeat)clearInterval(repeat);repeat=null;knob.style.transform='translate(-50%,-50%)'}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);const d=directionFromPoint(e);if(!d)return;tryMove(...d);repeat=setInterval(()=>tryMove(...d),150)});joy.addEventListener('pointermove',e=>{if(!repeat)return;const r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=Math.min(30,Math.hypot(x,y)),a=Math.atan2(y,x);knob.style.transform=`translate(calc(-50% + ${Math.cos(a)*m}px),calc(-50% + ${Math.sin(a)*m}px))`});joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);window.addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();tryMove(...m)}});fetch('data/beta-heritage-content.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{criteriaLabels=j.criteriaLabels||{};content=(j.sites||[]).find(s=>s.slug===siteId)||(j.sites||[]).find(s=>s.name===siteName)||null;document.getElementById('loading').classList.add('hide');render()}).catch(()=>{document.getElementById('loading').textContent='研究センターを読み込めませんでした'});})();</script></body></html>
