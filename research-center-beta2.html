<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>世界遺産クエスト｜研究センター Beta 2</title>
<style>
:root{--ink:#1d2940;--navy:#172238;--gold:#e3b53c;--bg:#e9edf2;--line:#c6cfdb;--floor:#d2bc96;--wall:#d8e3d6;--cell:42px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:var(--ink);user-select:none}button{font:inherit;touch-action:manipulation}.game{height:100%;display:grid;grid-template-rows:auto 1fr auto}.hud{display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);padding:9px 12px}.hud b{font-size:15px}.hud small{font-size:10px;font-weight:900;color:#68768b}.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 190px}.roomWrap{display:grid;place-items:center;overflow:hidden}.room{display:grid;box-shadow:0 9px 24px #2834452e}.cell{width:var(--cell);height:var(--cell);display:grid;place-items:center;position:relative}.wall{background:var(--wall);border:1px solid #bfc8c2}.floor{background:var(--floor);border:1px solid #c3a87e}.exit{background:#a7b6c2;border:2px solid #62758a}.exit:after{content:'出';font-size:10px;color:#fff;font-weight:1000}.obj{width:84%;height:84%;display:grid;place-items:center;border:2px solid #596678;border-radius:6px;font-size:12px;font-weight:1000;position:relative;cursor:pointer;touch-action:manipulation;box-shadow:0 2px 5px #0002}.obj:active{transform:scale(.95)}.display{background:#dce8dc}.book{background:#d8bd88}.researcher{background:#eef2f5}.quiz{background:#e6d9ef}.status{position:absolute;right:-7px;top:-8px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;font-style:normal;font-size:11px;font-weight:1000}.pending{background:#e14747;color:#fff}.done{background:var(--gold);color:#26354b}.player{width:70%;height:70%;background:#3157a3;border:2px solid #243b69;z-index:7;box-shadow:0 -7px 0 -4px #f1c49e}.side{background:#fffffff0;border-left:1px solid #cbd4de;display:grid;grid-template-rows:auto 1fr auto;align-items:center;gap:10px;padding:12px}.action{width:100%;min-height:58px;border:2px solid var(--gold);border-radius:13px;background:var(--navy);color:#fff;font-size:14px;font-weight:1000}.action:disabled{opacity:.4;background:#667387;border-color:#9ea9b7}.target{text-align:center;font-size:9px;color:#65748a;font-weight:900;min-height:16px}.joy{position:relative;width:142px;height:142px;margin:auto;border-radius:50%;background:radial-gradient(circle,#e3ebf4 0 30%,#263a59 31% 34%,#18263e 35% 100%);border:2px solid #879bb8;touch-action:none}.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(#edf3fa,#bac9dc);border:2px solid #fff}.mark{position:absolute;color:#dce6f4;font-weight:1000}.u{top:7px;left:50%;transform:translateX(-50%)}.d{bottom:7px;left:50%;transform:translateX(-50%)}.l{left:8px;top:50%;transform:translateY(-50%)}.r{right:8px;top:50%;transform:translateY(-50%)}.hint{text-align:center;font-size:9px;color:#617087;font-weight:900;line-height:1.5}.message{background:#fff9e8;border-top:1px solid #dccb95;padding:10px 14px;min-height:72px;display:grid;align-content:center}.message b{font-size:11px}.message p{font-size:12px;line-height:1.5;font-weight:800;margin:3px 0 0}.modal{position:fixed;inset:0;z-index:80;background:#161f2d94;display:none;place-items:center;padding:20px}.modal.show{display:grid}.card{width:min(760px,92vw);max-height:88vh;overflow:auto;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:18px;box-shadow:0 16px 46px #0005}.head{display:flex;justify-content:space-between;gap:10px}.head h2{font-size:22px;margin:3px 0 9px}.close{border:1px solid #b9c4d1;background:#fff;border-radius:10px;min-width:76px;min-height:42px;font-weight:1000}.body{font-size:16px;line-height:1.65;font-weight:800}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f3f6fa;border:1px solid #c9d3df;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:1000}.question{font-size:20px;line-height:1.45;font-weight:1000;margin:8px 0 13px}.choices{display:grid;gap:8px}.choice{width:100%;text-align:left;border:2px solid #c8d2de;background:#fff;border-radius:11px;padding:12px 14px;font-size:14px;font-weight:900}.correct{border-color:#5a9d6b!important;background:#eef9f1!important}.wrong{border-color:#cf7278!important;background:#fff2f2!important}.feedback{margin-top:12px;border-radius:11px;padding:11px 13px;background:#f4f7fa;font-size:13px;font-weight:800}.next{margin:12px 0 0 auto;display:block;min-width:110px;min-height:45px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:1000}.loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#e9edf2;font-size:13px;font-weight:1000}.loading.hide{display:none}@media(max-width:1050px) and (orientation:landscape){:root{--cell:36px}.main{grid-template-columns:minmax(0,1fr) 168px}.joy{width:126px;height:126px}.body{font-size:14px}}
</style></head><body>
<div class="game"><header class="hud"><b id="title">研究センター</b><small>歩いても、直接タップしてもOK</small></header><main class="main"><section class="roomWrap"><div id="room" class="room"></div></section><aside class="side"><div><button id="action" class="action" disabled>アクション</button><div id="target" class="target">対象に近づこう</div></div><div id="joy" class="joy"><span class="mark u">▲</span><span class="mark d">▼</span><span class="mark l">◀</span><span class="mark r">▶</span><div id="knob" class="knob"></div></div><div class="hint">スティック移動＋直接タップ<br>展示 → 本 → 調査員 → 腕試し</div></aside></main><footer id="message" class="message"><b>研究センター</b><p>気になるものをタップしても、歩いて近づいても調べられるよ。</p></footer></div>
<div id="info" class="modal"><div class="card"><div class="head"><h2 id="infoTitle"></h2><button id="infoClose" class="close">閉じる</button></div><div id="infoBody" class="body"></div></div></div><div id="quiz" class="modal"><div class="card"><div id="quizBody"></div></div></div><div id="loading" class="loading">研究センターを準備しています…</div>
<script src="beta-save.js"></script><script>(()=>{'use strict';
const siteId=sessionStorage.getItem('whqActiveHeritageId')||'shiretoko',siteNo=Number(sessionStorage.getItem('whqActiveHeritageNo')||13),siteName=sessionStorage.getItem('whqActiveHeritageName')||'知床';
const rows=['#############','#.........Q.#','#......R....#','#....B......#','#..D........#','#...........#','#...........#','######E######'];
const meta={D:{id:'display',label:'展示',action:'みる',icon:'展'},B:{id:'book',label:'本棚',action:'しらべる',icon:'本'},R:{id:'researcher',label:'調査員',action:'はなす',icon:'調'},Q:{id:'quiz',label:'腕試し',action:'ちょうせん',icon:'腕'}};
let player={x:6,y:6},target=null,content=null,criteriaLabels={},quizQuestions=[],quizIndex=0,quizScore=0,answered=false,pid=null,timer=null,dir=null;
const room=document.getElementById('room'),action=document.getElementById('action'),targetEl=document.getElementById('target'),msg=document.getElementById('message'),joy=document.getElementById('joy'),knob=document.getElementById('knob');document.getElementById('title').textContent=siteName+' 研究センター';
function state(){return WHQBetaSave.centerState(siteId)}function done(id){WHQBetaSave.setCenterState(siteId,{[id]:true})}function tile(x,y){return rows[y]?.[x]||'#'}function blocked(x,y){return '#DBRQE'.includes(tile(x,y))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setMsg(t,x){msg.innerHTML='<b>'+esc(t)+'</b><p>'+esc(x)+'</p>'}
function render(){const s=state(),h=rows.length,w=rows[0].length;room.innerHTML='';room.style.gridTemplateColumns=`repeat(${w},var(--cell))`;room.style.gridTemplateRows=`repeat(${h},var(--cell))`;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=rows[y][x],cell=document.createElement('div');cell.className='cell '+(c==='#'?'wall':c==='E'?'exit':'floor');if(meta[c]){const m=meta[c],o=document.createElement('button');o.type='button';o.className='obj '+m.id;o.dataset.id=m.id;o.innerHTML=m.icon+'<i class="status '+(s[m.id]?'done':'pending')+'">'+(s[m.id]?'✓':'!')+'</i>';o.addEventListener('click',e=>{e.stopPropagation();use(m.id)});cell.appendChild(o)}if(x===player.x&&y===player.y){const p=document.createElement('div');p.className='player';cell.appendChild(p)}room.appendChild(cell)}findTarget()}
function findTarget(){target=null;for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){const c=tile(player.x+dx,player.y+dy);if(meta[c]){target={type:'obj',...meta[c]};break}if(c==='E'){target={type:'exit',label:'出口',action:'でる'};break}}action.disabled=!target;action.textContent=target?.action||'アクション';targetEl.textContent=target?.label||'対象に近づこう'}function move(dx,dy){const nx=player.x+dx,ny=player.y+dy;if(blocked(nx,ny))return;player={x:nx,y:ny};render()}
function openInfo(title,html){document.getElementById('infoTitle').textContent=title;document.getElementById('infoBody').innerHTML=html;document.getElementById('info').classList.add('show')}
function use(id){if(id==='display'){done('display');render();openInfo('展示',`<p>${esc(content?.display||'この遺産の特徴を展示しているよ。')}</p>`);setMsg('展示','展示を見た。')}else if(id==='book'){done('book');render();const labels=(content?.criteria||[]).map(n=>criteriaLabels[String(n)]||'基準'+n);openInfo('本棚',`<p><b>${esc(content?.year||'—')}年に世界遺産登録</b></p><div class="chips">${labels.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')}</div>`);setMsg('本棚','登録情報を読んだ。')}else if(id==='researcher'){done('researcher');render();openInfo('調査員',`<p>${esc(content?.researcher||'この遺産について調べているよ。')}</p>`);setMsg('調査員','調査員の話を聞いた。')}else if(id==='quiz')startQuiz()}
function interact(){if(!target)return;if(target.type==='exit'){if(parent!==window)parent.postMessage({type:'whqExitCenter',site:siteId,heritageId:siteNo},'*');return}use(target.id)}action.addEventListener('click',interact);document.getElementById('infoClose').onclick=()=>document.getElementById('info').classList.remove('show');
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function startQuiz(){quizQuestions=(content?.quiz||[]).slice(0,3);quizIndex=0;quizScore=0;answered=false;document.getElementById('quiz').classList.add('show');renderQuiz()}function renderQuiz(){const box=document.getElementById('quizBody');if(!quizQuestions.length){box.innerHTML='<h2>準備中</h2><p>この遺産の問題を読み込めませんでした。</p><button class="next" id="qclose">閉じる</button>';document.getElementById('qclose').onclick=()=>document.getElementById('quiz').classList.remove('show');return}if(quizIndex>=quizQuestions.length){done('quiz');render();box.innerHTML=`<h2>腕試し終了！</h2><p class="question">${quizQuestions.length}もん中 ${quizScore}もん正解！</p><button class="next" id="qclose">閉じる</button>`;document.getElementById('qclose').onclick=()=>{document.getElementById('quiz').classList.remove('show');setMsg('腕試し','腕試しを最後まで体験した。')};return}answered=false;const q=quizQuestions[quizIndex],choices=shuffle(q.choices||[]);box.innerHTML=`<small>${quizIndex+1} / ${quizQuestions.length} もん</small><div class="question">${esc(q.q)}</div><div class="choices">${choices.map(c=>`<button class="choice" data-choice="${esc(c)}">${esc(c)}</button>`).join('')}</div><div id="fb"></div>`;box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b,q))}function answer(btn,q){if(answered)return;answered=true;const ok=btn.dataset.choice===q.answer;if(ok)quizScore++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.choice===q.answer)b.classList.add('correct');else if(b===btn&&!ok)b.classList.add('wrong')});document.getElementById('fb').innerHTML=`<div class="feedback"><b>${ok?'せいかい！':'おしい！ 正解は「'+esc(q.answer)+'」'}</b><br>${esc(q.explanation||'')}</div><button class="next" id="qn">${quizIndex===quizQuestions.length-1?'結果へ':'つぎへ'}</button>`;document.getElementById('qn').onclick=()=>{quizIndex++;renderQuiz()}}
window.addEventListener('keydown',e=>{if(document.querySelector('.modal.show'))return;const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});function direction(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;if(Math.hypot(dx,dy)<12)return null;return Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]}function place(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=40,dist=Math.hypot(dx,dy)||1,q=Math.min(1,m/dist);knob.style.transform=`translate(calc(-50% + ${dx*q}px),calc(-50% + ${dy*q}px))`}function stop(){pid=null;dir=null;clearInterval(timer);timer=null;knob.style.transform='translate(-50%,-50%)'}joy.onpointerdown=e=>{if(document.querySelector('.modal.show'))return;pid=e.pointerId;joy.setPointerCapture(pid);place(e);dir=direction(e);if(dir)move(...dir);timer=setInterval(()=>{if(dir)move(...dir)},180)};joy.onpointermove=e=>{if(e.pointerId!==pid)return;place(e);dir=direction(e)};joy.onpointerup=stop;joy.onpointercancel=stop;
async function load(){try{const r=await fetch('data/beta-heritage-content.json',{cache:'no-store'}),j=await r.json();criteriaLabels=j.criteriaLabels||{};content=(j.sites||[]).find(s=>s.slug===siteId)||(j.sites||[]).find(s=>Number(s.id)===siteNo)||null}catch(e){console.warn(e)}render();document.getElementById('loading').classList.add('hide')}render();load();})();</script></body></html>
