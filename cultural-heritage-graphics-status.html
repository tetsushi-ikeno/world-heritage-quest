const key="whq-cultural-graphics-status-v1";
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
let filter="all";
const grid=document.getElementById("grid");
function statusOf(s){return saved[s[0]]||s[2]}
function render(){
 grid.innerHTML="";
 let confirmed=0;
 initial.forEach(s=>{const st=statusOf(s);if(st==="confirmed")confirmed++;if(filter!=="all"&&filter!==st)return;
  const card=document.createElement("section");card.className="card "+st;
  const image=s[3]?'<img src="'+s[3]+'" alt="'+s[1]+'">':'<div class="empty">確定画像なし</div>';
  card.innerHTML='<div class="thumb">'+image+'<span class="statusBadge">'+(st==="confirmed"?"確定":"未確定")+'</span></div><div class="body"><h2>'+s[1]+'</h2><div class="meta">'+(s[4]?("表示形式："+s[4]+"<br>"):"")+(s[5]||"")+'</div><div class="toggle"><button class="'+(st==="confirmed"?"on":"")+'" data-set="confirmed">確定</button><button class="'+(st==="unconfirmed"?"off":"")+'" data-set="unconfirmed">未確定</button></div></div>';
  card.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{saved[s[0]]=b.dataset.set;localStorage.setItem(key,JSON.stringify(saved));render()});
  grid.appendChild(card);
 });
 document.getElementById("count").textContent=confirmed+" / "+initial.length;
 document.getElementById("bar").style.width=(confirmed/initial.length*100)+"%";
}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()});
document.getElementById("reset").onclick=()=>{if(confirm("ステータスを初期状態に戻しますか？")){saved={};localStorage.removeItem(key);render()}};
document.getElementById("copy").onclick=async()=>{const out={updatedAt:new Date().toISOString(),statuses:Object.fromEntries(initial.map(s=>[s[0],statusOf(s)]))};await navigator.clipboard.writeText(JSON.stringify(out,null,2));alert("確定状況JSONをコピーしました")};
render();
</script></body></html>
