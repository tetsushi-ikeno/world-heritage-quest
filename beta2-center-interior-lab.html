<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beta2 研究センター内装 Lab</title><style>:root{--ink:#1d2940;--bg:#e9eef3;--line:#c8d2dc;--navy:#172238;--gold:#e3b53c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:var(--ink)}main{max-width:1180px;margin:auto;padding:18px}h1{margin:0;font-size:24px}p{color:#627187;line-height:1.6}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{border:1px solid #abb9c8;background:#fff;border-radius:10px;padding:10px 15px;font-weight:900}.tabs button.active{background:var(--navy);color:#fff}.set{display:none}.set.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 5px 18px #24364b14}.room{position:relative;width:min(900px,94vw);aspect-ratio:15/10;margin:12px auto;border-radius:8px;overflow:hidden;box-shadow:0 12px 30px #24364b33}.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(10,1fr)}.cell{border:1px solid rgba(40,50,60,.12)}.floor{background:var(--floor)}.wall{background:var(--wall)}.path{background:var(--path)}.rug{background:var(--rug)}.woodline{box-shadow:inset 0 5px 0 rgba(80,50,25,.18)}.object{position:absolute;display:grid;place-items:center;filter:drop-shadow(0 3px 2px #0003)}.book{width:38px;height:32px;background:#8b4e32;border:3px solid #57331f;border-radius:3px;box-shadow:inset 10px 0 #d9ba70}.book:after{content:'';width:3px;height:25px;background:#f2dfa9;position:absolute}.researcher{width:32px;height:43px}.researcher:before{content:'';position:absolute;left:8px;top:8px;width:16px;height:15px;background:#efbd86;border:2px solid #5b3a2b}.researcher:after{content:'';position:absolute;left:5px;top:24px;width:22px;height:17px;background:#d8e3ea;border:2px solid #4c5a69}.hat{position:absolute;left:4px;top:2px;width:24px;height:8px;background:#c8ad70;border:2px solid #6d5a38;z-index:3}.glass{position:absolute;right:-4px;top:20px;width:10px;height:10px;border:3px solid #40556a;border-radius:50%;z-index:4}.glass:after{content:'';position:absolute;width:8px;height:3px;background:#40556a;right:-6px;bottom:-4px;transform:rotate(45deg)}.quiz{width:42px;height:38px;border:3px solid #5a6170;border-radius:6px;background:#eee2f4}.quiz:before{content:'?';font:900 26px Georgia;color:#604479}.player{width:30px;height:43px}.player:before{content:'';position:absolute;left:7px;top:9px;width:16px;height:14px;background:#efbd86;border:2px solid #5d3d2c}.player:after{content:'';position:absolute;left:4px;top:25px;width:22px;height:17px;background:#c5a567;border:2px solid #665239}.player .hat{left:2px;width:26px}.display{width:94px;height:78px}.nature .mount{position:absolute;left:5px;bottom:8px;border-left:38px solid transparent;border-right:38px solid transparent;border-bottom:53px solid #78994d}.nature .mount:after{content:'';position:absolute;left:-11px;top:18px;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:16px solid #eef4df}.nature .tree{position:absolute;right:7px;bottom:8px;width:9px;height:24px;background:#6d4b31}.nature .tree:before{content:'';position:absolute;left:-10px;top:-17px;width:29px;height:25px;border-radius:50%;background:#4c8748}.nature .water{position:absolute;left:4px;right:4px;bottom:2px;height:10px;background:#74b9cf;border-radius:50%}.culture .base{position:absolute;left:8px;bottom:8px;width:78px;height:10px;background:#b4976e}.culture .body{position:absolute;left:22px;bottom:18px;width:50px;height:34px;background:#eadfc9;border:3px solid #6d5748}.culture .roof{position:absolute;left:13px;bottom:47px;width:68px;height:26px;background:#8d5142;clip-path:polygon(50% 0,100% 100%,0 100%)}.culture .door{position:absolute;left:41px;bottom:18px;width:13px;height:22px;background:#704b36}.shelf{position:absolute;width:72px;height:30px;background:repeating-linear-gradient(90deg,#6b4a32 0 8px,#c4a16b 8px 12px);border:4px solid #58402e}.lamp{position:absolute;width:18px;height:18px;border-radius:50%;background:#ffd876;box-shadow:0 0 18px #ffd87699}.plaque{position:absolute;background:#efe7d0;border:2px solid #8c7758;border-radius:4px;width:50px;height:18px}.note{font-size:12px;color:#627187}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.legend div{background:#f6f8fa;border-radius:10px;padding:10px;font-size:12px;line-height:1.5}.set[data-set="a"]{--floor:#b98c5e;--wall:#6e5139;--path:#d6b989;--rug:#7f3f34}.set[data-set="b"]{--floor:#c5b99c;--wall:#5f6c73;--path:#e1d7bd;--rug:#546d78}.set[data-set="c"]{--floor:#9f8f78;--wall:#4c4a45;--path:#c9bca3;--rug:#6d5947}.set[data-set="a"] .room{background:#6e5139}.set[data-set="b"] .room{background:#5f6c73}.set[data-set="c"] .room{background:#4c4a45}.titlebar{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{font-size:11px;font-weight:900;border:1px solid #c7d0d9;border-radius:999px;padding:5px 9px;background:#f4f7f9}@media(max-width:800px){.legend{grid-template-columns:1fr}.room{width:98vw}}</style></head><body><main><h1>Beta2 研究センター内装 Lab</h1><p>A案のオブジェクトを共通にし、内装だけを比較します。レイアウトはBeta2で確定した「入口→中央展示→左右分岐→合流→本→最奥の腕試し」を維持しています。</p><div class="tabs"><button class="active" data-set="a">A 探検隊の研究ロッジ</button><button data-set="b">B 世界遺産ミュージアム</button><button data-set="c">C 石造りの資料館</button></div><div id="sets"></div></main><script>const layouts={a:{title:'A：探検隊の研究ロッジ',tag:'推奨',desc:'木床・濃い木壁・赤い敷物・本棚・暖色照明。昔のRPGの拠点感と、探検隊の基地らしさを両立。'},b:{title:'B：世界遺産ミュージアム',tag:'明るい',desc:'石調の床・青灰色の壁・展示プレート・白っぽい通路。研究施設としての説得力が強い。'},c:{title:'C：石造りの資料館',tag:'RPG感強め',desc:'石壁・落ち着いた床・茶系の通路。遺跡の中の資料館のような雰囲気で、冒険ゲーム感が最も強い。'}};const rows=['###############','#######Q#######','#######.#######','######B.#######','###.........###','###..#####..###','###R.##D##..###','###.........###','#######.#######','#######E#######'];function roomHtml(k){let cells='';for(let y=0;y<10;y++)for(let x=0;x<15;x++){const c=rows[y][x];cells+=`<div class="cell ${c==='#'?'wall':'floor'} ${c==='.'?'path':''} ${c==='E'?'rug':''}"></div>`}const pos=(x,y,w=1,h=1)=>`left:${x/15*100}%;top:${y/10*100}%;width:${w/15*100}%;height:${h/10*100}%;`;return `<div class="room"><div class="grid">${cells}</div><div class="object display nature" style="${pos(6.25,5.75,2.1,1.7)}"><i class="mount"></i><i class="tree"></i><i class="water"></i></div><div class="object researcher" style="${pos(3.35,6.05)}"><i class="hat"></i><i class="glass"></i></div><div class="object book" style="${pos(6.25,3.15)}"></div><div class="object quiz" style="${pos(6.85,.35)}"></div><div class="object player" style="${pos(6.85,8.2)}"><i class="hat"></i></div><div class="shelf" style="left:12%;top:14%"></div><div class="shelf" style="right:12%;top:14%"></div><div class="lamp" style="left:22%;top:40%"></div><div class="lamp" style="right:22%;top:40%"></div><div class="plaque" style="left:45%;top:52%"></div></div>`}const root=document.getElementById('sets');root.innerHTML=Object.entries(layouts).map(([k,v],i)=>`<section class="set ${i===0?'active':''}" data-set="${k}"><div class="card"><div class="titlebar"><h2>${v.title}</h2><span class="tag">${v.tag}</span></div><p>${v.desc}</p>${roomHtml(k)}<div class="legend"><div><b>床・壁</b><br>${k==='a'?'木材中心。センターを「建物」に見せやすい。':k==='b'?'石・タイル中心。博物館らしく整理された印象。':'石材中心。ダンジョンと研究施設の中間。'}</div><div><b>展示</b><br>自然遺産はフラットな山・森・水辺。文化遺産時は同じ2×2枠に建物模型を表示。</div><div><b>装飾</b><br>${k==='a'?'本棚・暖色ランプ・敷物を少量。':'展示プレートや照明などを少量。'} 通路を邪魔する装飾は置かない。</div></div></div></section>`).join('');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.set').forEach(s=>s.classList.toggle('active',s.dataset.set===b.dataset.set))});</script></body></html>
