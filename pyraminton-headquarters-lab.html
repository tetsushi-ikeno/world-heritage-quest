<main class="main" id="vp"><div class="world" id="world">
<div class="area north" id="north"><h2>北海道エリア</h2></div>

<script>
const groups=[{"title":"北海道エリア","cls":"north","items":["知床","北海道・北東北の縄文遺跡群"]},{"title":"西日本エリア","cls":"west","items":["白川郷・五箇山","石見銀山","古都京都","姫路城","古都奈良","法隆寺地域","百舌鳥・古市古墳群","飛鳥・藤原の宮都","原爆ドーム","厳島神社","紀伊山地"]},{"title":"東日本エリア","cls":"east","items":["白神山地","平泉","佐渡島の金山","日光の社寺","富岡製糸場","ル・コルビュジエ","富士山","小笠原諸島"]},{"title":"九州・沖縄エリア","cls":"south","items":["宗像・沖ノ島","明治日本の産業革命遺産","長崎と天草地方の潜伏キリシタン関連遺産","屋久島","奄美・徳之島・沖縄島北部・西表島","琉球王国のグスク"]}];
const cfg={
 north:{cols:2,startX:28,startY:96,gapX:185,gapY:145},
 west:{cols:2,startX:18,startY:95,gapX:190,gapY:145},
 east:{cols:2,startX:18,startY:95,gapX:190,gapY:145},
 south:{cols:2,startX:28,startY:95,gapX:185,gapY:145}
};
groups.forEach(g=>{const host=document.getElementById(g.cls),c=cfg[g.cls];g.items.forEach((name,i)=>{const s=document.createElement('div');s.className='sign';s.style.left=(c.startX+(i%c.cols)*c.gapX)+'px';s.style.top=(c.startY+Math.floor(i/c.cols)*c.gapY)+'px';s.textContent=name;host.appendChild(s)})});
const vp=document.getElementById('vp'),world=document.getElementById('world'),playerEl=document.getElementById('player'),mini=document.getElementById('miniP'),joy=document.getElementById('joy'),knob=document.getElementById('knob');
let player={x:660,y:690},joyDir=null,repeat=null;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
const PLAYER_R=14;
const walkableRects=[
  // 北海道
  {x:478,y:58,w:364,h:384},
  // 西日本
  {x:48,y:488,w:354,h:974},
  // 東日本
  {x:918,y:488,w:354,h:784},
  // 九州・沖縄
  {x:478,y:988,w:364,h:574},
  // 中央ホール
  {x:478,y:618,w:364,h:144},
  // 接続通路（すべて2マス相当以上）
  {x:588,y:452,w:144,h:182},
  {x:398,y:648,w:112,h:124},
  {x:810,y:648,w:112,h:124},
  {x:588,y:750,w:144,h:238}
];
function insideRect(x,y,r){
  return x>=r.x+PLAYER_R && x<=r.x+r.w-PLAYER_R && y>=r.y+PLAYER_R && y<=r.y+r.h-PLAYER_R;
}
function hitsSign(x,y){
  const p={l:x-PLAYER_R,r:x+PLAYER_R,t:y-PLAYER_R,b:y+PLAYER_R};
  return [...document.querySelectorAll('.sign')].some(el=>{
    const l=parseFloat(el.style.left)+(el.parentElement.offsetLeft||0);
    const t=parseFloat(el.style.top)+(el.parentElement.offsetTop||0);
    const w=145,h=Math.max(78,el.offsetHeight||78);
    const rr={l:l-6,r:l+w+6,t:t-6,b:t+h+36};
    return p.r>rr.l&&p.l<rr.r&&p.b>rr.t&&p.t<rr.b;
  });
}
function canStand(x,y){
  return walkableRects.some(r=>insideRect(x,y,r)) && !hitsSign(x,y);
}
function render(){playerEl.style.left=(player.x-16)+'px';playerEl.style.top=(player.y-20)+'px';const vw=vp.clientWidth,vh=vp.clientHeight;const cx=clamp(vw/2-player.x,vw-1320,0),cy=clamp(vh/2-player.y,vh-1650,0);world.style.transform='translate('+cx+'px,'+cy+'px)';mini.style.left=(player.x/1320*90)+'px';mini.style.top=(player.y/1650*122)+'px'}
function move(dx,dy){
  const step=12;
  const nx=player.x+dx*step, ny=player.y+dy*step;
  if(canStand(nx,ny)){player.x=nx;player.y=ny}
  else if(dx&&canStand(nx,player.y)){player.x=nx}
  else if(dy&&canStand(player.x,ny)){player.y=ny}
  render();
}
function updateJoy(e,moveNow=false){const r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),len=Math.hypot(x,y);if(len<14){joyDir=null;knob.style.transform='translate(-50%,-50%)';return}const m=Math.min(30,len),a=Math.atan2(y,x);knob.style.transform='translate(calc(-50% + '+(Math.cos(a)*m)+'px),calc(-50% + '+(Math.sin(a)*m)+'px))';const next=Math.abs(x)>Math.abs(y)?[Math.sign(x),0]:[0,Math.sign(y)];const changed=!joyDir||joyDir[0]!==next[0]||joyDir[1]!==next[1];joyDir=next;if(moveNow&&changed)move(...joyDir)}
function stop(){if(repeat)clearInterval(repeat);repeat=null;joyDir=null;knob.style.transform='translate(-50%,-50%)'}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joy.setPointerCapture(e.pointerId);updateJoy(e,true);repeat=setInterval(()=>{if(joyDir)move(...joyDir)},75)});
joy.addEventListener('pointermove',e=>{if(!repeat)return;e.preventDefault();updateJoy(e,true)});joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);
['selectstart','contextmenu','dragstart'].forEach(t=>joy.addEventListener(t,e=>{e.preventDefault();e.stopPropagation()},{capture:true}));
window.addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();move(...m)}});window.addEventListener('resize',render);render();
</script></body></html>
