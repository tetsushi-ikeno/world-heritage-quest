    const l=el.parentElement.offsetLeft+parseFloat(el.style.left),t=el.parentElement.offsetTop+parseFloat(el.style.top);
    const w=el.offsetWidth,h=el.offsetHeight;
    return {l:l-8,r:l+w+8,t:t-8,b:t+h+8};
  });
}
function hitsSign(x,y){const p={l:x-R,r:x+R,t:y-R,b:y+R};return signRects.some(rr=>p.r>rr.l&&p.l<rr.r&&p.b>rr.t&&p.t<rr.b)}
function canStand(x,y){return walkable.some(r=>inside(x,y,r))&&!hitsSign(x,y)}
function connectivityCheck(){
  rebuildSignRects();
  const step=12,start={x:840,y:780};
  const goals=[{name:'北海道',x:840,y:260},{name:'西日本',x:282,y:1000},{name:'東日本',x:1362,y:1000},{name:'九州・沖縄',x:840,y:1450}];
  const key=(x,y)=>x+','+y,q=[start],seen=new Set([key(start.x,start.y)]);let qi=0;
  while(qi<q.length&&seen.size<50000){
    const p=q[qi++];
    for(const [dx,dy] of [[step,0],[-step,0],[0,step],[0,-step]]){
      const nx=p.x+dx,ny=p.y+dy,k=key(nx,ny);
      if(!seen.has(k)&&canStand(nx,ny)){seen.add(k);q.push({x:nx,y:ny})}
    }
  }
  const reachable=g=>[...seen].some(k=>{const [x,y]=k.split(',').map(Number);return Math.abs(x-g.x)<=30&&Math.abs(y-g.y)<=30});
  const failed=goals.filter(g=>!reachable(g));
  if(failed.length){
    const b=document.createElement('div');
    b.style.cssText='position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:100;background:#a62626;color:#fff;padding:8px 12px;border-radius:9px;font-size:11px;font-weight:900';
    b.textContent='接続テストNG：'+failed.map(x=>x.name).join('／');vp.appendChild(b);return false
  }
  return true;
}
function render(){
  playerEl.style.left=(player.x-16)+'px';playerEl.style.top=(player.y-20)+'px';
  const vw=vp.clientWidth,vh=vp.clientHeight,cx=clamp(vw/2-player.x,vw-1680,0),cy=clamp(vh/2-player.y,vh-1880,0);
  world.style.transform='translate('+cx+'px,'+cy+'px)';
  mini.style.left=(player.x/1680*98)+'px';mini.style.top=(player.y/1880*128)+'px'
}
function move(dx,dy){
  const step=12,nx=player.x+dx*step,ny=player.y+dy*step;
  if(canStand(nx,ny)){player.x=nx;player.y=ny}
  else if(dx&&canStand(nx,player.y))player.x=nx;
  else if(dy&&canStand(player.x,ny))player.y=ny;
  render()
}
function updateJoy(e,moveNow=false){
  const r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),len=Math.hypot(x,y);
  if(len<14){joyDir=null;knob.style.transform='translate(-50%,-50%)';return}
  const m=Math.min(30,len),a=Math.atan2(y,x);
  knob.style.transform='translate(calc(-50% + '+(Math.cos(a)*m)+'px),calc(-50% + '+(Math.sin(a)*m)+'px))';
  const next=Math.abs(x)>Math.abs(y)?[Math.sign(x),0]:[0,Math.sign(y)];
  const changed=!joyDir||joyDir[0]!==next[0]||joyDir[1]!==next[1];
  joyDir=next;if(moveNow&&changed)move(...joyDir)
}
function stop(){
  if(repeat)clearInterval(repeat);repeat=null;joyDir=null;knob.style.transform='translate(-50%,-50%)'
}
joy.addEventListener('pointerdown',e=>{
  e.preventDefault();joy.setPointerCapture(e.pointerId);updateJoy(e,true);
  repeat=setInterval(()=>{if(joyDir)move(...joyDir)},75)
});
joy.addEventListener('pointermove',e=>{if(!repeat)return;e.preventDefault();updateJoy(e,true)});
joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);
['selectstart','contextmenu','dragstart'].forEach(t=>joy.addEventListener(t,e=>{e.preventDefault();e.stopPropagation()},{capture:true}));
window.addEventListener('keydown',e=>{
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
  if(m){e.preventDefault();move(...m)}
});
window.addEventListener('resize',()=>{rebuildSignRects();render()});
rebuildSignRects();connectivityCheck();render();
</script>
</body>
