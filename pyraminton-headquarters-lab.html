<script>
const groups=[{"id":"north","title":"北海道エリア","items":["知床","北海道・北東北の縄文遺跡群"]},{"id":"west","title":"西日本エリア","items":["白川郷・五箇山","石見銀山","古都京都","姫路城","古都奈良","法隆寺地域","百舌鳥・古市古墳群","飛鳥・藤原の宮都","原爆ドーム","厳島神社","紀伊山地"]},{"id":"east","title":"東日本エリア","items":["白神山地","平泉","佐渡島の金山","日光の社寺","富岡製糸場","ル・コルビュジエ","富士山","小笠原諸島"]},{"id":"south","title":"九州・沖縄エリア","items":["宗像・沖ノ島","明治日本の産業革命遺産","長崎と天草地方の潜伏キリシタン関連遺産","屋久島","奄美・徳之島・沖縄島北部・西表島","琉球王国のグスク"]}];
const roomCfg={
 north:{rows:1, top:100, gap:140},
 west:{rows:6, top:100, gap:150},
 east:{rows:4, top:100, gap:150},
 south:{rows:3, top:100, gap:150}
};
groups.forEach(g=>{
 const host=document.getElementById(g.id),cfg=roomCfg[g.id];
 g.items.forEach((name,i)=>{
   const s=document.createElement('div');s.className='sign';
   const row=Math.floor(i/2),right=i%2===1;
   s.style.left=(right?330:40)+'px';
   s.style.top=(cfg.top+row*cfg.gap)+'px';
   s.textContent=name;host.appendChild(s);
 });
});
const vp=document.getElementById('vp'),world=document.getElementById('world'),playerEl=document.getElementById('player'),mini=document.getElementById('miniP'),joy=document.getElementById('joy'),knob=document.getElementById('knob');
let player={x:840,y:780},joyDir=null,repeat=null;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
const R=14;
// 歩行可能領域は「部屋内床」と「通路」を1つの床面として定義する。
// 部屋内床は壁厚を差し引いた座標、通路は両側へ60px以上食い込ませる。
// canStand側では二重に余白を引かない（旧版の見えない隙間の原因だった）。
const walkable=[
 {x:598,y:58,w:484,h:324},       // 北海道 室内床
 {x:58,y:538,w:484,h:1084},      // 西日本 室内床
 {x:1138,y:538,w:484,h:824},     // 東日本 室内床
 {x:598,y:1198,w:484,h:584},     // 九州沖縄 室内床
 {x:608,y:668,w:464,h:224},      // 中央ホール 室内床
 {x:730,y:330,w:220,h:390},      // 北通路（北海道床〜中央床へ深く重なる）
 {x:480,y:690,w:180,h:180},      // 西通路（西日本床〜中央床）
 {x:1020,y:690,w:180,h:180},     // 東通路（中央床〜東日本床）
 {x:730,y:840,w:220,h:410}       // 南通路（中央床〜九州沖縄床）
];
function inside(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h}
let signRects=[];
function rebuildSignRects(){
 signRects=[...document.querySelectorAll('.sign')].map(el=>{
   const l=el.parentElement.offsetLeft+parseFloat(el.style.left), t=el.parentElement.offsetTop+parseFloat(el.style.top);
   return {l:l-8,r:l+158,t:t-8,b:t+114};
 });
}
function hitsSign(x,y){
 const p={l:x-R,r:x+R,t:y-R,b:y+R};
 return signRects.some(rr=>p.r>rr.l&&p.l<rr.r&&p.b>rr.t&&p.t<rr.b);
}
function canStand(x,y){return walkable.some(r=>inside(x,y,r))&&!hitsSign(x,y)}

// 公開前の回帰チェック：中央ホールから4エリアの中央通路へ実際に到達できるかを自動検証。
// 失敗した版は画面上に赤い警告を出す。
function connectivityCheck(){
 rebuildSignRects();
 const step=12, start={x:840,y:780};
 const goals=[
   {name:'北海道',x:840,y:300},
   {name:'西日本',x:250,y:900},
   {name:'東日本',x:1380,y:900},
   {name:'九州・沖縄',x:840,y:1450}
 ];
 const key=(x,y)=>x+','+y, q=[start], seen=new Set([key(start.x,start.y)]);
 let qi=0;
 while(qi<q.length && seen.size<40000){
   const p=q[qi++];
   for(const [dx,dy] of [[step,0],[-step,0],[0,step],[0,-step]]){
     const nx=p.x+dx,ny=p.y+dy,k=key(nx,ny);
     if(!seen.has(k)&&canStand(nx,ny)){seen.add(k);q.push({x:nx,y:ny})}
   }
 }
 const reachable=(g)=>[...seen].some(k=>{
   const [x,y]=k.split(',').map(Number);return Math.abs(x-g.x)<=24&&Math.abs(y-g.y)<=24;
 });
 const failed=goals.filter(g=>!reachable(g));
 if(failed.length){
   const b=document.createElement('div');
   b.style.cssText='position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:100;background:#a62626;color:#fff;padding:8px 12px;border-radius:9px;font-size:11px;font-weight:900';
   b.textContent='接続テストNG：'+failed.map(x=>x.name).join('／');
   vp.appendChild(b);
   return false;
 }
 return true;
}
function render(){
 playerEl.style.left=(player.x-16)+'px';playerEl.style.top=(player.y-20)+'px';
 const vw=vp.clientWidth,vh=vp.clientHeight,cx=clamp(vw/2-player.x,vw-1680,0),cy=clamp(vh/2-player.y,vh-1880,0);
 world.style.transform='translate('+cx+'px,'+cy+'px)';
 mini.style.left=(player.x/1680*98)+'px';mini.style.top=(player.y/1880*128)+'px';
}
function move(dx,dy){const step=12,nx=player.x+dx*step,ny=player.y+dy*step;if(canStand(nx,ny)){player.x=nx;player.y=ny}else if(dx&&canStand(nx,player.y))player.x=nx;else if(dy&&canStand(player.x,ny))player.y=ny;render()}
function updateJoy(e,moveNow=false){const r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),len=Math.hypot(x,y);if(len<14){joyDir=null;knob.style.transform='translate(-50%,-50%)';return}const m=Math.min(30,len),a=Math.atan2(y,x);knob.style.transform='translate(calc(-50% + '+(Math.cos(a)*m)+'px),calc(-50% + '+(Math.sin(a)*m)+'px))';const next=Math.abs(x)>Math.abs(y)?[Math.sign(x),0]:[0,Math.sign(y)];const changed=!joyDir||joyDir[0]!==next[0]||joyDir[1]!==next[1];joyDir=next;if(moveNow&&changed)move(...joyDir)}
function stop(){if(repeat)clearInterval(repeat);repeat=null;joyDir=null;knob.style.transform='translate(-50%,-50%)'}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joy.setPointerCapture(e.pointerId);updateJoy(e,true);repeat=setInterval(()=>{if(joyDir)move(...joyDir)},75)});
joy.addEventListener('pointermove',e=>{if(!repeat)return;e.preventDefault();updateJoy(e,true)});joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);
['selectstart','contextmenu','dragstart'].forEach(t=>joy.addEventListener(t,e=>{e.preventDefault();e.stopPropagation()},{capture:true}));
window.addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();move(...m)}});window.addEventListener('resize',()=>{rebuildSignRects();render()});rebuildSignRects();connectivityCheck();render();
</script></body></html>
