<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界遺産クエスト｜画像クレジット</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#203047;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}main{max-width:980px;margin:auto;padding:28px 18px 60px}h1{font-size:26px;margin:0 0 8px}p{color:#627187;line-height:1.65}.site{background:#fff;border:1px solid #d6dde5;border-radius:14px;padding:16px;margin:14px 0}.site h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.credit{border:1px solid #dde3ea;border-radius:10px;padding:10px;min-width:0}.credit b{display:block;font-size:12px;margin-bottom:5px}.credit span{display:block;font-size:10px;line-height:1.45;color:#627187;overflow-wrap:anywhere}.credit a{font-size:10px;color:#315b92}.back{display:inline-block;margin-top:12px;color:#315b92;font-weight:800;text-decoration:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
</head>
<body><main><h1>画像クレジット</h1><p>世界遺産クエストで使用している画像の作者・ライセンス・Wikimedia Commons上の出典です。画像は各ファイルの再利用条件を確認したうえで使用しています。</p><div id="list">読み込み中…</div><a class="back" href="beta.html">← ベータ版へ戻る</a></main>
<script>
(async()=>{const list=document.getElementById('list');try{const r=await fetch('data/heritage-images.json',{cache:'no-store'}),j=await r.json();list.innerHTML=(j.sites||[]).map(s=>`<section class="site"><h2>${esc(s.nameJa)}</h2><div class="grid">${(s.images||[]).map((img,i)=>`<div class="credit"><b>${i+1}. ${esc(img.roleJa||'画像')}</b><span>作者: ${esc(img.author||'不明')}</span><span>ライセンス: ${esc(img.license||'')}</span><a href="${attr(img.sourcePage)}" target="_blank" rel="noopener noreferrer">Wikimedia Commons 出典</a>${img.licenseUrl?`<br><a href="${attr(img.licenseUrl)}" target="_blank" rel="noopener noreferrer">ライセンス詳細</a>`:''}</div>`).join('')}</div></section>`).join('')}catch(e){list.textContent='クレジット情報を読み込めませんでした。'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(v){return esc(v||'#')}})();
</script></body></html>
