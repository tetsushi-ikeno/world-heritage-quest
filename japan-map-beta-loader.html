<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>BETA map loader</title></head>
<body>
<script>
(async()=>{
  const source=await fetch('japan-6x-map-lab.html?source=r9',{cache:'no-store'}).then(r=>r.text());
  let patched=source
    .replace("{id:21,name:'「神宿る島」宗像・沖ノ島と関連遺産群',x:26,y:50,type:'文化'}","{id:21,name:'「神宿る島」宗像・沖ノ島と関連遺産群',x:24,y:49,type:'文化'}")
    .replace("{id:22,name:'長崎と天草地方の潜伏キリシタン関連遺産',x:23,y:54,type:'文化'}","{id:22,name:'長崎と天草地方の潜伏キリシタン関連遺産',x:24,y:54,type:'文化'}");

  const renderHook='function render(){if(!canvas.width)return;';
  if(!patched.includes(renderHook))throw new Error('native facility render injection point not found');
  const helpers=`const BETA_BRANCHES=[['miyagi-taga',58,38],['yamagata-yamadera',55,37],['fukushima-miharu',55,41],['ibaraki-kodokan',57,45],['saitama-sakitama',53,45],['chiba-kasori',57,47],['kanagawa-kamakura',54,47],['ishikawa-kenrokuen',47,42],['fukui-ichijodani',46,44],['nagano-kamikochi',50,43],['aichi-nagoya',48,47],['tottori-dunes',39,46],['okayama-shizutani',39,49],['tokushima-castle',40,52],['kagawa-ritsurin',40,50],['ehime-matsuyama',36,52],['kochi-ryugado',38,54],['oita-usuki',29,54],['miyazaki-saitobaru',29,57]];\nfunction betaState(){try{return JSON.parse(localStorage.getItem('whqBetaSaveV1')||'null')||{}}catch(_){return{}}}\nfunction betaDiscovered(){const s=betaState();return new Set(Array.isArray(s?.discovered)?s.discovered.map(Number):[])}\nfunction betaBranches(){const s=betaState();return new Set(Array.isArray(s?.branches)?s.branches:[])}\nfunction drawBetaBranch(found,x,y){ctx.save();ctx.translate(x,y);if(!found){ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#49586a';ctx.stroke();ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.stroke()}else{ctx.fillStyle='#6d7783';ctx.beginPath();ctx.moveTo(-12,-4);ctx.lineTo(-7,-12);ctx.lineTo(7,-12);ctx.lineTo(12,-4);ctx.closePath();ctx.fill();ctx.fillStyle='#c9d0d6';ctx.strokeStyle='#596574';ctx.lineWidth=1.5;ctx.fillRect(-10,-4,20,14);ctx.strokeRect(-10,-4,20,14);ctx.fillStyle='#738798';ctx.fillRect(-6,3,5,7)}ctx.restore()}\nfunction drawBetaFacility(s,x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#46536a';ctx.beginPath();ctx.moveTo(-19,-8);ctx.lineTo(-12,-21);ctx.lineTo(12,-21);ctx.lineTo(19,-8);ctx.closePath();ctx.fill();ctx.fillStyle='#e5efe1';ctx.strokeStyle='#3f4a5d';ctx.lineWidth=2;ctx.fillRect(-16,-8,32,27);ctx.strokeRect(-16,-8,32,27);ctx.fillStyle='#8ea8b8';ctx.strokeStyle='#38465b';ctx.lineWidth=1;ctx.fillRect(-10,5,9,14);ctx.strokeRect(-10,5,9,14);ctx.fillStyle='#b9dce8';ctx.strokeStyle='#40516b';ctx.fillRect(5,-1,8,8);ctx.strokeRect(5,-1,8,8);const label=s.name.length>20?s.name.slice(0,20)+'…':s.name;ctx.font='900 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const w=Math.max(54,ctx.measureText(label).width+12);ctx.fillStyle='rgba(255,255,255,.97)';ctx.strokeStyle='rgba(85,105,128,.45)';ctx.lineWidth=1;const lx=-w/2,ly=25,lh=20,r=9;ctx.beginPath();ctx.moveTo(lx+r,ly);ctx.lineTo(lx+w-r,ly);ctx.quadraticCurveTo(lx+w,ly,lx+w,ly+r);ctx.lineTo(lx+w,ly+lh-r);ctx.quadraticCurveTo(lx+w,ly+lh,lx+w-r,ly+lh);ctx.lineTo(lx+r,ly+lh);ctx.quadraticCurveTo(lx,ly+lh,lx,ly+lh-r);ctx.lineTo(lx,ly+r);ctx.quadraticCurveTo(lx,ly,lx+r,ly);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#243952';ctx.fillText(label,0,ly+lh/2+.5);ctx.restore()}\n`;
  patched=patched.replace(renderHook,helpers+renderHook);

  const markerBlock="const isSel=selected?.id===s.id;ctx.fillStyle=isSel?'#f5cf63':'#fff7df';ctx.strokeStyle=s.type==='自然'?'#246a47':'#784735';ctx.lineWidth=isSel?3:2;ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=s.type==='自然'?'#246a47':'#5f302b';ctx.font='900 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',x,y+1);hitSites.push({s,x,y,r:17});if(showNames){ctx.font='900 10px sans-serif';const label=s.name.length>15?s.name.slice(0,15)+'…':s.name,w=Math.max(56,ctx.measureText(label).width+10);ctx.fillStyle='rgba(255,255,255,.95)';ctx.fillRect(x-w/2,y+16,w,18);ctx.fillStyle='#273b56';ctx.fillText(label,x,y+25)}";
  if(!patched.includes(markerBlock))throw new Error('heritage marker replacement point not found');
  const nativeMarker="const found=betaDiscovered().has(s.id),isSel=selected?.id===s.id;if(found){drawBetaFacility(s,x,y)}else{ctx.fillStyle=isSel?'#f5cf63':'#fff7df';ctx.strokeStyle=s.type==='自然'?'#246a47':'#784735';ctx.lineWidth=isSel?3:2;ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=s.type==='自然'?'#246a47':'#5f302b';ctx.font='900 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',x,y+1);if(showNames){ctx.font='900 10px sans-serif';const label=s.name.length>15?s.name.slice(0,15)+'…':s.name,w=Math.max(56,ctx.measureText(label).width+10);ctx.fillStyle='rgba(255,255,255,.95)';ctx.fillRect(x-w/2,y+16,w,18);ctx.fillStyle='#273b56';ctx.fillText(label,x,y+25)}}hitSites.push({s,x,y,r:17});";
  patched=patched.replace(markerBlock,nativeMarker);

  const branchDrawHook="ctx.restore();\n ctx.save();const px=cw/2,py=ch/2;";
  if(!patched.includes(branchDrawHook))throw new Error('branch canvas injection point not found');
  patched=patched.replace(branchDrawHook,"ctx.restore();\n const branchFound=betaBranches();ctx.save();for(const b of BETA_BRANCHES){const wp=nearestWalkable(b[1],b[2]),x=(wp.x-viewLeft)*TILE,y=(wp.y-viewTop)*TILE;if(x<-30||y<-30||x>cw+30||y>ch+30)continue;drawBetaBranch(branchFound.has(b[0]),x,y)}ctx.restore();\n ctx.save();const px=cw/2,py=ch/2;");

  const miniOld="mctx.beginPath();mctx.arc(x,y,n>1?9:3.5,0,Math.PI*2);mctx.fillStyle=n>1?'#1f6d51':'#70463b';mctx.fill();if(n>1){mctx.fillStyle='#fff';mctx.font='900 9px sans-serif';mctx.textAlign='center';mctx.textBaseline='middle';mctx.fillText(String(n),x,y+.5)}";
  if(!patched.includes(miniOld))throw new Error('minimap injection point not found');
  patched=patched.replace(miniOld,"mctx.beginPath();mctx.arc(x,y,8,0,Math.PI*2);mctx.fillStyle='#1f6d51';mctx.fill();mctx.fillStyle='#fff';mctx.font='900 9px sans-serif';mctx.textAlign='center';mctx.textBaseline='middle';mctx.fillText(String(n),x,y+.5)");

  const hook="window.addEventListener('resize',resize);requestAnimationFrame(resize);renderMini();";
  if(!patched.includes(hook))throw new Error('map API injection point not found');
  patched=patched.replace(hook,`window.WHQMapAPI={
    getPosition(){return{x:player.x,y:player.y}},
    setPosition(x,y){
      let nx=Math.round(Number(x)),ny=Math.round(Number(y));
      if(!Number.isFinite(nx)||!Number.isFinite(ny))return false;
      if(!walkable(nx,ny)){
        let found=null;
        for(let r=1;r<=24&&!found;r++)for(let yy=ny-r;yy<=ny+r&&!found;yy++)for(let xx=nx-r;xx<=nx+r;xx++)if(walkable(xx,yy)){found={x:xx,y:yy};break}
        if(!found)return false;nx=found.x;ny=found.y;
      }
      player={x:nx,y:ny};selected=null;document.getElementById('selected').hidden=true;render();camera.focus();return true;
    },
    refresh(){render()},
    nearestWalkableForBase(x,y){const p=nearestWalkable(Number(x),Number(y));return p?{x:p.x,y:p.y}:null},
    revision:'beta2-feedback-1'
  };${hook}`);
  document.open();document.write(patched);document.close();
})().catch(err=>{document.body.textContent='全国マップの読み込みに失敗しました: '+err.message});
</script>
</body>
</html>
