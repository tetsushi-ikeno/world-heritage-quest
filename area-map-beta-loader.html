<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>BETA2 area loader</title></head>
<body>
<script>
(async()=>{
  const source=await fetch('area-map-game.html?source=beta2',{cache:'no-store'}).then(r=>r.text());
  const must=(text,from,to,label)=>{if(!text.includes(from))throw new Error(label+' injection point not found');return text.replace(from,to)};
  let patched=source
    .replace('<script src="beta-save.js"></'+'script>','<script src="beta-save.js?v=r20260901-01"></'+'script>')
    .replace('japan-6x-map-lab.html?game=1','japan-map-beta-loader.html?game=1&rev=r20260827-03&nocache='+Date.now())
    .replace("{id:21,slug:'okinoshima',name:'「神宿る島」宗像・沖ノ島と関連遺産群',x:26,y:50,type:'文化'}","{id:21,slug:'okinoshima',name:'「神宿る島」宗像・沖ノ島と関連遺産群',x:24,y:49,type:'文化'}")
    .replace("{id:22,slug:'hidden-christian',name:'長崎と天草地方の潜伏キリシタン関連遺産',x:23,y:54,type:'文化'}","{id:22,slug:'hidden-christian',name:'長崎と天草地方の潜伏キリシタン関連遺産',x:24,y:54,type:'文化'}")
    .replace('.centerMarker{position:absolute','#centerLayer{display:none!important}.centerMarker{position:absolute');

  const extraCss=`
.progressStack{margin-top:6px;border-top:1px solid #cbd5df;padding-top:5px;display:grid;gap:2px}.branchProgress{margin-top:0;border-top:0;padding-top:0;text-align:center;font-size:10px;font-weight:1000;color:#4d5f76}.heritageProgress{text-align:center;font-size:10px;font-weight:1000;color:#344b68}.branchLayer{display:none!important}
.branchDiscover{position:fixed;inset:0;z-index:1200;display:none;place-items:center;pointer-events:none}.branchDiscover.show{display:grid;pointer-events:auto;background:rgba(23,34,56,.08)}.branchCard{pointer-events:auto;width:min(470px,72vw);background:#fff;border:1px solid #aeb9c5;border-radius:16px;padding:12px;box-shadow:0 16px 40px #16223566;animation:branchCardIn .5s cubic-bezier(.2,.8,.2,1) both}.branchCard .designation{display:inline-block;background:#edf1f4;border:1px solid #c1cad3;border-radius:999px;padding:4px 9px;font-size:10px;font-weight:1000;color:#4b5c70}.branchCard img{display:block;width:100%;height:min(42vh,260px);object-fit:cover;border-radius:10px;margin:8px 0}.branchCard h2{font-size:20px;margin:4px 0 10px}.branchCardActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.branchCardActions button{min-height:45px;border-radius:10px;font-weight:1000}.branchClose{border:1px solid #bcc6d0;background:#fff;color:#314057}.branchQuizGo{border:0;background:#293b55;color:#fff}@keyframes branchCardIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.branchQuizModal{position:fixed;inset:0;z-index:1250;display:none;place-items:center;background:#17223873;padding:18px}.branchQuizModal.show{display:grid}.branchQuizBox{width:min(680px,88vw);background:#fff;border:2px solid #8f9baa;border-radius:16px;padding:18px;box-shadow:0 15px 42px #0005}.branchQuizBox small{font-weight:1000;color:#6a7687}.branchQuizBox h2{margin:5px 0 12px;font-size:20px}.branchQuizChoices{display:grid;gap:8px}.branchQuizChoice{width:100%;text-align:left;min-height:48px;border:2px solid #ccd4dd;background:#fff;border-radius:10px;padding:9px 12px;font-weight:900}.branchQuizChoice.correct{border-color:#5a9d6b;background:#eef9f1}.branchQuizChoice.wrong{border-color:#cf7278;background:#fff2f2}.branchQuizDone{margin-top:12px;min-height:44px;width:100%;border:0;border-radius:10px;background:#293b55;color:#fff;font-weight:1000}.branchFeedback{font-size:12px;font-weight:900;margin-top:10px;color:#405168}.branchStarRow{font-size:24px;line-height:1;margin:6px 0 10px}.branchStarRow .on{color:#f2b928;text-shadow:0 1px 0 #8f6b13}.branchStarRow .off{color:#c8cdd4}
.piramitonQuiz{display:flex;align-items:center;gap:12px;margin:4px 0 12px;padding:8px 10px;background:#f5f1e8;border-radius:12px}.piramitonFace{width:76px;height:70px;flex:0 0 auto;background-image:var(--piramiton-sheet);background-size:222px 166px;background-position:-4px -17px;background-repeat:no-repeat;image-rendering:pixelated;filter:drop-shadow(0 4px 0 #0002)}.piramitonFace.happy{transform:translateY(-2px) rotate(-2deg)}.piramitonFace.troubled{filter:drop-shadow(0 4px 0 #0002) saturate(.8)}.piramitonSays{font-size:12px;font-weight:1000;line-height:1.5;color:#34465e}.spotIntro{position:fixed;inset:0;z-index:1300;display:none;place-items:center;background:#17223873;padding:18px}.spotIntro.show{display:grid}.spotIntroBox{width:min(650px,88vw);background:#fff;border:2px solid #d4b35c;border-radius:18px;padding:18px;box-shadow:0 18px 48px #0005}.spotIntroRow{display:flex;gap:18px;align-items:center}.spotIntro .piramitonFace{width:110px;height:100px;background-size:322px 242px;background-position:-5px -24px}.spotIntroText{font-size:16px;font-weight:900;line-height:1.7;color:#26364d}.spotIntroNext{margin-top:14px;width:100%;min-height:48px;border:0;border-radius:11px;background:#293b55;color:#fff;font-weight:1000}
.discovery{background:#000!important;overflow:hidden}.heritageIris{position:absolute;inset:0;background:#000;clip-path:circle(0 at 50% 50%);z-index:1}.discovery.show .heritageIris{animation:heritageIris 1s cubic-bezier(.55,0,.9,.5) both}.heritageReveal{position:absolute;inset:0;z-index:2;display:grid;grid-template-rows:18% 1fr 72px;background:#000;opacity:0}.discovery.show .heritageReveal{animation:heritageReveal .12s .5s linear both}.heritageTitle{display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px;background:#000;color:#f4d06f;font-family:'Yu Mincho','Hiragino Mincho ProN','Hiragino Mincho Pro','Noto Serif JP',serif;font-weight:700;font-size:clamp(16px,2.3vw,28px);letter-spacing:.04em}.heritagePhoto{position:relative;overflow:hidden;background:#000;display:grid;place-items:center}.heritagePhoto img{position:static!important;width:100%!important;height:100%!important;object-fit:cover!important;background:#000!important;opacity:0;transform:scale(.97)}.discovery.show .heritagePhoto img{animation:heritagePhoto .28s .5s ease-out both}.heritageCredit{position:absolute;right:8px;bottom:6px;background:#0009;color:#e8ebef;padding:3px 6px;border-radius:5px;font-size:8px}.heritageActions{display:grid;grid-template-columns:minmax(140px,240px) minmax(140px,240px);justify-content:space-between;column-gap:clamp(48px,12vw,180px);padding:9px clamp(20px,7vw,100px);background:#000;opacity:0}.discovery.show .heritageActions{animation:heritageActions .18s .82s ease both}.heritageActions button{min-height:48px;border-radius:10px;font-weight:1000}.heritageActions .enterBtn{border:1px solid #f4d06f;background:#fff;color:#172238}.heritageActions .laterBtn{border:1px solid #657080;background:#1f2938;color:#fff}@keyframes heritageIris{0%{clip-path:circle(0 at 50% 50%)}50%,100%{clip-path:circle(82% at 50% 50%)}}@keyframes heritageReveal{to{opacity:1}}@keyframes heritagePhoto{to{opacity:1;transform:scale(1)}}@keyframes heritageActions{to{opacity:1}}
`;
  patched=must(patched,'</style>',extraCss+'</style>','style');
  patched=must(patched,'</head>','<script src="piramiton-expr.js"></'+'script></head>','piramiton sheet');

  patched=must(patched,'<div id="centerLayer"></div>','<div id="centerLayer"></div><div id="branchLayer" class="branchLayer"></div>','branch layer');
  patched=must(patched,'<div class="miniHint">北固定｜現在地を表示</div>','<div class="miniHint">北固定｜現在地を表示</div><div class="progressStack"><div id="heritageProgress" class="heritageProgress">世界遺産 0 / 27</div><div id="branchProgress" class="branchProgress">ピラミトンスポット 0 / 19</div></div>','branch HUD');

  const oldDiscovery=`<div id="discovery" class="discovery" role="dialog" aria-modal="true"><img id="discoveryImg" alt=""><div class="discoveryShade"></div><div class="discoveryTitle"><small>世界遺産を発見！</small><h1 id="discoveryName"></h1><div id="discoveryCredit" class="credit"></div></div><div class="discoveryActions"><button id="enterCenter" class="enterBtn" type="button">センターへ入る</button><button id="laterBtn" class="laterBtn" type="button">あとで</button></div></div>`;
  const newDiscovery=`<div id="discovery" class="discovery" role="dialog" aria-modal="true"><div class="heritageIris"></div><div class="heritageReveal"><div id="discoveryName" class="heritageTitle"></div><div class="heritagePhoto"><img id="discoveryImg" alt=""><div id="discoveryCredit" class="heritageCredit"></div></div><div class="heritageActions"><button id="laterBtn" class="laterBtn" type="button">あとで</button><button id="enterCenter" class="enterBtn" type="button">センターへ入る</button></div></div></div>`;
  patched=must(patched,oldDiscovery,newDiscovery,'heritage discovery HTML');

  const branchHtml=`<div id="branchDiscover" class="branchDiscover"><div class="branchCard"><span id="branchDesignation" class="designation"></span><img id="branchImage" alt=""><h2 id="branchName"></h2><div class="branchCardActions"><button id="branchClose" class="branchClose">閉じる</button><button id="branchQuizGo" class="branchQuizGo">スポットに入る</button></div></div></div><div id="spotIntro" class="spotIntro"><div class="spotIntroBox"><div class="spotIntroRow"><div class="piramitonFace"></div><div id="spotIntroText" class="spotIntroText"></div></div><button id="spotIntroNext" class="spotIntroNext">つぎへ</button></div></div><div id="branchQuizModal" class="branchQuizModal"><div class="branchQuizBox"><small id="branchQuizSource"></small><div id="branchStarRow" class="branchStarRow"></div><div class="piramitonQuiz"><div id="quizPiramiton" class="piramitonFace"></div><div id="quizPiramitonSays" class="piramitonSays">ぼくから1問！ わかるかな？</div></div><h2 id="branchQuizQuestion"></h2><div id="branchQuizChoices" class="branchQuizChoices"></div><div id="branchFeedback" class="branchFeedback"></div><button id="branchQuizDone" class="branchQuizDone">全国マップへ戻る</button></div></div>`;
  patched=must(patched,'<div id="loading" class="loading">',branchHtml+'<div id="loading" class="loading">','branch modals');

  const oldPlayerPos="function playerPos(){const t=doc()?.getElementById('posChip')?.textContent||'';const m=t.match(/(-?\\d+)\\s*,\\s*(-?\\d+)/);return m?{x:+m[1],y:+m[2]}:null}";
  const newPlayerPos="function playerPos(){const d=doc(),api=d?.defaultView?.WHQMapAPI;if(api?.getPosition){const p=api.getPosition();if(p&&Number.isFinite(+p.x)&&Number.isFinite(+p.y))return{x:+p.x,y:+p.y}}const t=d?.getElementById('posChip')?.textContent||'';const m=t.match(/(-?\\d+)\\s*,\\s*(-?\\d+)/);return m?{x:+m[1],y:+m[2]}:null}";
  patched=must(patched,oldPlayerPos,newPlayerPos,'player position');
  const oldSiteFine="function siteFine(s){return{x:(s.x+.5)*SCALE,y:(s.y+.5)*SCALE}}";
  const newSiteFine="function siteFine(s){const api=doc()?.defaultView?.WHQMapAPI;if(api?.nearestLandForBase){const p=api.nearestLandForBase(s.x,s.y);if(p)return p}return{x:(s.x+.5)*SCALE,y:(s.y+.5)*SCALE}}";
  patched=must(patched,oldSiteFine,newSiteFine,'heritage land snap');

  const branchJs=`
const BRANCH_COORDS={'miyagi-taga':[58,38],'yamagata-yamadera':[55,37],'fukushima-miharu':[55,41],'ibaraki-kodokan':[57,45],'saitama-sakitama':[53,45],'chiba-kasori':[57,47],'kanagawa-kamakura':[54,47],'ishikawa-kenrokuen':[47,42],'fukui-ichijodani':[46,44],'nagano-kamikochi':[50,43],'aichi-nagoya':[48,47],'tottori-dunes':[39,46],'okayama-shizutani':[39,49],'tokushima-castle':[40,52],'kagawa-ritsurin':[40,50],'ehime-matsuyama':[36,52],'kochi-ryugado':[38,54],'oita-usuki':[29,54],'miyazaki-saitobaru':[29,57]};
let branchSites=[],branchQuizMap=new Map(),nearBranch=null,pendingBranch=null,branchLatched=null,spotIntroStep=0;
function branchFine(b){const q=BRANCH_COORDS[b.id]||[0,0],api=doc()?.defaultView?.WHQMapAPI;if(api?.nearestLandForBase){const p=api.nearestLandForBase(q[0],q[1]);if(p)return p}return{x:(q[0]+.5)*SCALE,y:(q[1]+.5)*SCALE}}
function branchFoundSet(){return new Set(saveState().branches||[])}
function branchModalOpen(){return document.getElementById('branchDiscover')?.classList.contains('show')||document.getElementById('branchQuizModal')?.classList.contains('show')}
function renderBranches(p){if(!p)return;const found=branchFoundSet();let best=Infinity;nearBranch=null;for(const b of branchSites){const q=branchFine(b),dist=Math.hypot(q.x-p.x,q.y-p.y);if(dist<best){best=dist;nearBranch=b;nearBranch._dist=dist}}const hp=document.getElementById('heritageProgress');if(hp)hp.textContent='世界遺産 '+(saveState().discovered||[]).length+' / 27';const progress=document.getElementById('branchProgress');if(progress)progress.textContent='★ '+window.WHQBetaSave.totalStarCount()+' / 100';if(!nearBranch||best>CONTACT)nearBranch=null;doc()?.defaultView?.WHQMapAPI?.refresh?.()}
function lockBranch(id){window.WHQBetaSave.update(s=>{s.map.returnLockBranchId=id;return s});branchLatched=id}
function clearBranchLock(){window.WHQBetaSave.update(s=>{s.map.returnLockBranchId=null;return s})}
function showBranch(b,first){pendingBranch=b;if(first)window.WHQBetaSave.discoverBranch(b.id);document.getElementById('branchDesignation').textContent=b.designation;document.getElementById('branchName').textContent=b.name;const img=document.getElementById('branchImage');img.src=b.image;img.alt=b.name;document.getElementById('branchDiscover').classList.add('show');setMessage('ピラミトンスポット',b.name+'の近くにスポットを見つけた！');renderBranches(playerPos())}
function closeBranch(){if(pendingBranch)lockBranch(pendingBranch.id);document.getElementById('branchDiscover').classList.remove('show');pendingBranch=null;sync()}
function showSpotIntro(b){pendingBranch=b;spotIntroStep=0;document.getElementById('branchDiscover').classList.remove('show');const modal=document.getElementById('spotIntro'),txt=document.getElementById('spotIntroText'),btn=document.getElementById('spotIntroNext');const pages=["ここは『ピラミトンスポット』！ ぼくが にほんじゅうにつくった、ゲームの中の調査スポットだよ！","世界遺産がない都道府県にも、すごい歴史や自然がいっぱい！ そんな場所の近くにスポットをかくしてあるよ。","ぜんぶで19か所！ 見つけたら、ぼくの世界遺産クイズに1問チャレンジしてみよう！"];txt.textContent=pages[0];btn.textContent='つぎへ';modal.classList.add('show');btn.onclick=()=>{spotIntroStep++;if(spotIntroStep<pages.length){txt.textContent=pages[spotIntroStep];btn.textContent=spotIntroStep===pages.length-1?'クイズへ':'つぎへ';return}modal.classList.remove('show');window.WHQBetaSave.update(s=>{s.piramitonSpotIntroSeen=true;return s});openBranchQuiz(b)}}
function enterPiramitonSpot(b){if(!saveState().piramitonSpotIntroSeen)showSpotIntro(b);else openBranchQuiz(b)}
function openBranchQuiz(b){const q=branchQuizMap.get(b.id);document.getElementById('branchDiscover').classList.remove('show');if(!q){setMessage('ピラミトンスポット','問題を準備中です。');lockBranch(b.id);return}const modal=document.getElementById('branchQuizModal'),choices=document.getElementById('branchQuizChoices'),face=document.getElementById('quizPiramiton'),says=document.getElementById('quizPiramitonSays');face.className='piramitonFace';says.textContent='ぼくから1問！ わかるかな？';document.getElementById('branchQuizSource').textContent='ピラミトンスポット｜'+b.prefecture+'｜'+b.designation;document.getElementById('branchQuizQuestion').textContent=q.question;document.getElementById('branchFeedback').textContent='';const starRow=document.getElementById('branchStarRow');const starOn=window.WHQBetaSave.branchStars(b.id)[0];starRow.innerHTML='<span class="'+(starOn?'on':'off')+'">★</span>';choices.innerHTML='';modal.dataset.answered='';q.choices.forEach((c,i)=>{const btn=document.createElement('button');btn.className='branchQuizChoice';btn.textContent=c;btn.onclick=()=>{if(modal.dataset.answered==='1')return;modal.dataset.answered='1';const ok=i===q.answer;face.classList.add(ok?'happy':'troubled');says.textContent=ok?'やった！ 正解！':'うーん、おしい！ 答えを見てみよう。';btn.classList.add(ok?'correct':'wrong');if(!ok)choices.children[q.answer]?.classList.add('correct');if(ok){window.WHQBetaSave.awardBranchStar(b.id,0);starRow.innerHTML='<span class="on">★</span>'}document.getElementById('branchFeedback').textContent=ok?'正解！ 星をひとつ獲得！':'おしい！ ピラミトンが困った顔で答えを教えてくれた。';window.WHQBetaSave.finishBranchQuiz(b.id);renderBranches(playerPos())};choices.appendChild(btn)});modal.classList.add('show')}
function handleBranchContact(p){if(!ready||restoring||branchModalOpen()||document.getElementById('discovery').classList.contains('show')||document.getElementById('visitCommand').classList.contains('show')||!branchSites.length)return;const lock=saveState().map.returnLockBranchId;if(lock){const lb=branchSites.find(b=>b.id===lock);if(lb){const q=branchFine(lb);if(Math.hypot(q.x-p.x,q.y-p.y)>LEAVE){clearBranchLock();branchLatched=null}}}if(!nearBranch)return;if(saveState().map.returnLockBranchId===nearBranch.id||branchLatched===nearBranch.id)return;branchLatched=nearBranch.id;showBranch(nearBranch,!branchFoundSet().has(nearBranch.id))}
function syncBranches(p){renderBranches(p);if(nearBranch&&!nearSite){actionBtn.disabled=false;actionBtn.textContent='入る';actionSub.textContent=nearBranch.name}handleBranchContact(p)}
async function loadBranchData(){try{const [s,q]=await Promise.all([fetch('data/branch-sites.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/branch-quiz-data.json',{cache:'no-store'}).then(r=>r.json())]);branchSites=s.sites||[];branchQuizMap=new Map((q.quizzes||[]).map(x=>[x.branchId,x]));sync()}catch(e){console.warn('branch data unavailable',e)}}
`;
  patched=must(patched,'async function loadManifest(){',branchJs+'\nasync function loadManifest(){','branch JS');

  const oldHandleGuard="function handleContact(p,found){if(!ready||restoring||document.getElementById('discovery').classList.contains('show')||document.getElementById('visitCommand').classList.contains('show'))return;";
  const newHandleGuard="function handleContact(p,found){if(!ready||restoring||branchModalOpen()||document.getElementById('discovery').classList.contains('show')||document.getElementById('visitCommand').classList.contains('show'))return;";
  patched=must(patched,oldHandleGuard,newHandleGuard,'contact guard');

  const syncTail="if(ready&&!restoring)window.WHQBetaSave.update(s=>{s.map.position=p;return s});handleContact(p,found)}";
  patched=must(patched,syncTail,"syncBranches(p);if(ready&&!restoring)window.WHQBetaSave.update(s=>{s.map.position=p;return s});handleContact(p,found)}",'sync branch hook');

  const oldShow="function showDiscovery(s){pendingSite=s;markDiscovered(s);const m=manifest.get(s.name),img=m?.images?.find(x=>x.role==='representative')||m?.images?.[0];const box=document.getElementById('discovery'),pic=document.getElementById('discoveryImg');document.getElementById('discoveryName').textContent=s.name;pic.alt=s.name;if(img){pic.src=`docs/assets/heritage/${s.slug}/${img.file}`;document.getElementById('discoveryCredit').textContent=`Photo: ${img.author||'Wikimedia Commons'} / ${img.license||''}`.trim()}else{pic.removeAttribute('src');document.getElementById('discoveryCredit').textContent='画像情報を読み込めませんでした'}box.classList.add('show');setMessage('世界遺産を発見！',`${s.name}を発見した！`);sync()}";
  const newShow="function showDiscovery(s){pendingSite=s;markDiscovered(s);const m=manifest.get(s.name),img=m?.images?.find(x=>x.role==='representative')||m?.images?.[0];const box=document.getElementById('discovery'),pic=document.getElementById('discoveryImg');document.getElementById('discoveryName').textContent='世界遺産：'+s.name;pic.alt=s.name;if(img){pic.src=`docs/assets/heritage/${s.slug}/${img.file}`;document.getElementById('discoveryCredit').textContent=`Photo: ${img.author||'Wikimedia Commons'} / ${img.license||''}`.trim()}else{pic.removeAttribute('src');document.getElementById('discoveryCredit').textContent='画像情報を読み込めませんでした'}box.classList.remove('show');void box.offsetWidth;box.classList.add('show');setMessage('世界遺産',s.name);sync()}";
  patched=must(patched,oldShow,newShow,'heritage effect');

  const oldAction="actionBtn.addEventListener('click',()=>{if(!nearSite)return;const found=discoveredSet();if(found.has(nearSite.id))showVisit(nearSite);else showDiscovery(nearSite)});";
  const newAction="actionBtn.addEventListener('click',()=>{if(nearSite){const found=discoveredSet();if(found.has(nearSite.id))showVisit(nearSite);else showDiscovery(nearSite);return}if(nearBranch)showBranch(nearBranch,!branchFoundSet().has(nearBranch.id))});";
  patched=must(patched,oldAction,newAction,'action button');

  const branchListeners=`document.documentElement.style.setProperty('--piramiton-sheet',\`url(\${window.PIRAMITON_EXPR_SHEET||''})\`);document.getElementById('branchClose').addEventListener('click',closeBranch);document.getElementById('branchQuizGo').addEventListener('click',()=>{if(pendingBranch)enterPiramitonSpot(pendingBranch)});document.getElementById('branchQuizDone').addEventListener('click',()=>{document.getElementById('branchQuizModal').classList.remove('show');if(pendingBranch)lockBranch(pendingBranch.id);pendingBranch=null;sync()});`;
  patched=must(patched,"document.getElementById('enterCenter').addEventListener('click'",branchListeners+"document.getElementById('enterCenter').addEventListener('click'",'branch listeners');

  const oldPrepare="function prepare(){patchMap();setTimeout(()=>{replaySavedPath();ready=true;document.getElementById('loading').classList.add('hide');sync()},90)}";
  const newPrepare=`function prepare(){patchMap();if(prepare._timer)clearInterval(prepare._timer);let tries=0;prepare._timer=setInterval(()=>{patchMap();const d=doc(),api=d?.defaultView?.WHQMapAPI;if(!d||!api?.getPosition||!api?.setPosition){if(++tries<200)return;clearInterval(prepare._timer);prepare._timer=null;document.getElementById('loading').textContent='現在地の復元に失敗しました。再読み込みしてください。';return}clearInterval(prepare._timer);prepare._timer=null;const state=saveState(),target=state.map.position;restoring=true;let restored=false;if(target)restored=api.setPosition(target.x,target.y);if(!target)goBetaStart();else if(!restored)console.warn('saved position adjusted',target);restoring=false;const p=api.getPosition();if(p)window.WHQBetaSave.update(s=>{s.map.position={x:p.x,y:p.y};s.map.path=[];return s});ready=true;document.getElementById('loading').classList.add('hide');api.refresh?.();sync();loadBranchData()},50)} `;
  patched=must(patched,oldPrepare,newPrepare,'restore');

  const oldMark="function markDiscovered(s){window.WHQBetaSave.update(st=>{if(!st.discovered.includes(s.id))st.discovered.push(s.id);return st})}";
  const newMark="function markDiscovered(s){window.WHQBetaSave.update(st=>{if(!st.discovered.includes(s.id))st.discovered.push(s.id);return st});doc()?.defaultView?.WHQMapAPI?.refresh?.()}";
  patched=must(patched,oldMark,newMark,'discovery refresh');

  const listenerHook="frame.addEventListener('load',()=>{clearInterval(poll);prepare();poll=setInterval(sync,120)});window.addEventListener('message',e=>{if(e.data?.type==='whqRefreshMap')sync()});loadManifest();";
  const listenerReplacement=`function persistMapPosition(){if(!ready||restoring)return;const p=playerPos();if(p)window.WHQBetaSave.update(s=>{s.map.position={x:p.x,y:p.y};return s})}window.addEventListener('pagehide',persistMapPosition);window.addEventListener('beforeunload',persistMapPosition);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persistMapPosition()});frame.addEventListener('load',()=>{clearInterval(poll);prepare();poll=setInterval(sync,120)});window.addEventListener('message',e=>{if(e.data?.type==='whqRefreshMap'){doc()?.defaultView?.WHQMapAPI?.refresh?.();sync()}});loadManifest();`;
  patched=must(patched,listenerHook,listenerReplacement,'persist listener');

  document.open();document.write(patched);document.close();
})().catch(err=>{document.body.textContent='移動画面の読み込みに失敗しました: '+err.message});
</script>
</body>
