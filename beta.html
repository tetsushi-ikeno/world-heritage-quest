<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>世界遺産クエスト BETA</title>
<style>
:root{--ink:#1d2940;--navy:#172238;--gold:#e3b53c;--bg:#e8eef4;--line:#c3ceda}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:var(--ink)}button{font:inherit;touch-action:manipulation}.app{position:relative;width:100%;height:100%}.gameFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}.gameFrame.show{display:block}#centerFrame{z-index:20;background:#e9edf2}.title{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#dcecf5 0 56%,#87b56d 56%);padding:24px;z-index:40}.title.hide{display:none}.panel{width:min(620px,92vw);background:rgba(255,255,255,.96);border:2px solid var(--line);border-radius:24px;padding:32px;text-align:center;box-shadow:0 18px 46px rgba(26,43,66,.22)}.mark{width:70px;height:58px;margin:0 auto 12px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--gold);filter:drop-shadow(0 6px 0 rgba(0,0,0,.10))}.eyebrow{font-size:11px;font-weight:1000;letter-spacing:.12em;color:#7a611c}.panel h1{font-size:clamp(30px,5vw,54px);line-height:1.08;margin:7px 0 6px}.beta{display:inline-block;background:var(--navy);color:#fff;border:2px solid var(--gold);border-radius:999px;padding:5px 10px;font-size:10px;font-weight:1000}.lead{font-size:13px;line-height:1.6;font-weight:800;color:#607086;margin:15px auto;max-width:430px}.start{min-width:220px;min-height:58px;border:2px solid var(--gold);border-radius:14px;background:var(--navy);color:#fff;font-size:17px;font-weight:1000;box-shadow:0 5px 0 #0d1727}.start:active{transform:translateY(1px)}.saved{margin-top:12px;font-size:10px;color:#718095;font-weight:850}.fatal{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:#f6f8fa;padding:20px}.fatal.show{display:grid}.fatal div{max-width:560px;background:#fff;border:1px solid #d3dae3;border-radius:16px;padding:22px}.fatal b{display:block;margin-bottom:7px}.fatal p{font-size:12px;line-height:1.6;margin:0;color:#647186}.revision{position:fixed;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:9999;padding:5px 8px;border-radius:999px;background:rgba(23,34,56,.88);border:1px solid rgba(227,181,60,.9);color:#fff;font-size:10px;font-weight:900;letter-spacing:.02em;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div class="app"><iframe id="gameFrame" class="gameFrame" title="世界遺産クエスト"></iframe><iframe id="centerFrame" class="gameFrame" title="世界遺産研究センター"></iframe><section id="titleScreen" class="title"><div class="panel"><div class="mark"></div><div class="eyebrow">WORLD HERITAGE QUEST</div><h1>世界遺産クエスト</h1><span class="beta">BETA</span><p id="lead" class="lead">日本の世界遺産を、自分の足で見つけにいこう。</p><button id="startBtn" class="start" type="button">はじめる</button><div id="savedInfo" class="saved"></div></div></section></div>
<div id="revisionBadge" class="revision">BETA r7 / PATCH loading…</div>
<div id="fatal" class="fatal"><div><b>ゲームを開けませんでした</b><p>ページを再読み込みしてください。ベータ版のセーブデータはブラウザに保存されています。</p></div></div>
<script src="beta-save.js?v=20260822-7"></script>
<script>
(()=>{'use strict';
const frame=document.getElementById('gameFrame'),centerFrame=document.getElementById('centerFrame'),title=document.getElementById('titleScreen'),startBtn=document.getElementById('startBtn'),lead=document.getElementById('lead'),savedInfo=document.getElementById('savedInfo');let stage='title',tutorialPoll=null,mapLoaded=false;
function state(){return window.WHQBetaSave.load()}
function titleMode(){const s=state();if(s.tutorialComplete){startBtn.textContent='つづきから';lead.textContent='前回の場所から、世界遺産を探す旅を続けよう。';savedInfo.textContent=s.playerName?`${s.playerName}　／　発見 ${s.discovered.length} / 27`: `発見 ${s.discovered.length} / 27`}else{startBtn.textContent='はじめる';lead.textContent='日本の世界遺産を、自分の足で見つけにいこう。';savedInfo.textContent=s.playerName?'チュートリアルから再開します':''}}
function hideFrames(){frame.classList.remove('show');centerFrame.classList.remove('show')}
function showTitle(){stage='title';clearInterval(tutorialPoll);tutorialPoll=null;hideFrames();frame.removeAttribute('src');centerFrame.removeAttribute('src');mapLoaded=false;title.classList.remove('hide');titleMode()}
function showTutorial(){stage='tutorial';clearInterval(tutorialPoll);tutorialPoll=null;title.classList.add('hide');centerFrame.classList.remove('show');frame.classList.add('show');frame.src='tutorial-lab-final.html?beta=1';mapLoaded=false}
function showMap(){stage='map';clearInterval(tutorialPoll);tutorialPoll=null;title.classList.add('hide');centerFrame.classList.remove('show');centerFrame.removeAttribute('src');frame.classList.add('show');if(!mapLoaded){frame.src='area-map-beta-loader.html?beta=1&rev=r7&nocache='+Date.now();mapLoaded=true}else setTimeout(()=>frame.contentWindow?.postMessage({type:'whqRefreshMap'},'*'),30)}
function showCenter(){stage='center';title.classList.add('hide');frame.classList.remove('show');centerFrame.classList.add('show');centerFrame.src='research-center-game.html?beta=1'}
function tutorialDoc(){try{return frame.contentDocument?.getElementById('tutorialFrame')?.contentDocument||null}catch(_){return null}}
function patchTutorial(){if(stage!=='tutorial')return;const d=tutorialDoc();if(!d)return;const input=d.getElementById('name'),ok=d.getElementById('nameOk');if(input&&!input.dataset.betaPrefill){input.dataset.betaPrefill='1';const s=state();if(s.playerName)input.value=s.playerName}if(ok&&!ok.dataset.betaSave){ok.dataset.betaSave='1';ok.addEventListener('click',()=>{const name=input?.value.trim()||'主人公';window.WHQBetaSave.update(s=>{s.playerName=name;return s})},{capture:true})}
 d.querySelectorAll('.skipNote').forEach(n=>{if(n.textContent.includes('Labでは'))n.textContent='「北海道へ出発！」で全国マップへ進みます。'});const finish=[...d.querySelectorAll('button.btn.primary')].find(b=>['北海道へ出発！','全国マップへ出発！'].includes(b.textContent.trim()));if(finish&&!finish.dataset.betaBridge){finish.dataset.betaBridge='1';finish.removeAttribute('onclick');finish.addEventListener('click',e=>{e.preventDefault();window.WHQBetaSave.update(s=>{s.tutorialComplete=true;return s});showMap()})}}
startBtn.addEventListener('click',()=>{state().tutorialComplete?showMap():showTutorial()});
frame.addEventListener('load',()=>{if(stage==='tutorial'){patchTutorial();tutorialPoll=setInterval(patchTutorial,180)}});
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='whqOpenCenter')showCenter();else if(d.type==='whqExitCenter')showMap();else if(d.type==='whqResetBeta'){window.WHQBetaSave.reset();showTitle()}});
window.addEventListener('error',()=>document.getElementById('fatal').classList.add('show'));
titleMode();
})();
</script>
</body>
</html>
