<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>世界遺産クエスト｜日本全国</title>
<style>
:root{--ink:#1c2a40;--muted:#63748a;--panel:rgba(255,255,255,.95);--line:#bfcddd;--navy:#172238;--gold:#e5b83f;--green:#1f6d51;--shadow:0 5px 18px rgba(18,37,62,.23)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#5f9fc6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;user-select:none}button{font:inherit;touch-action:manipulation}a{color:inherit}
.stage{position:relative;width:100%;height:100%;overflow:hidden}#mapFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#5f9fc6}.ui{position:absolute;inset:0;z-index:30;pointer-events:none}
.context{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));width:200px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px;box-shadow:var(--shadow)}.contextHead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}.contextHead b{font-size:15px}.contextHead small{font-size:9px;color:var(--muted);font-weight:800}.mini{height:132px;border:1px solid #aebfcd;border-radius:9px;overflow:hidden;background:#dceef6}.mini canvas{width:100%;height:100%;display:block}.miniHint{font-size:8px;color:var(--muted);font-weight:800;text-align:center;margin-top:4px}
.topActions{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}.topActions button{min-height:48px;border:1px solid #acbbcb;border-radius:12px;background:var(--panel);color:#273a54;padding:0 14px;font-size:12px;font-weight:900;box-shadow:var(--shadow)}.topActions .menu{min-width:52px;padding:0 10px;font-size:21px}.topActions .book{min-width:96px}
.controlRail{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(17px,env(safe-area-inset-bottom));width:158px;display:grid;gap:8px;justify-items:center;pointer-events:auto}.actionBtn{width:116px;min-height:58px;border:2px solid var(--gold);border-radius:14px;background:var(--navy);color:#fff;font-size:15px;font-weight:1000;box-shadow:var(--shadow)}.actionBtn:disabled{opacity:.42;border-color:#aab4c0;background:#556276}.actionSub{margin-top:-4px;min-height:15px;font-size:8px;font-weight:900;color:#263950;background:rgba(255,255,255,.88);border-radius:999px;padding:2px 7px;text-align:center}.joy{position:relative;width:154px;height:154px;border-radius:50%;background:radial-gradient(circle,#e3ebf4 0 30%,#263a59 31% 34%,#18263e 35% 100%);border:2px solid #879bb8;box-shadow:var(--shadow);touch-action:none}.knob{position:absolute;left:50%;top:50%;width:62px;height:62px;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(#edf3fa,#bac9dc);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3)}.mark{position:absolute;color:#dce6f4;font-weight:1000}.u{top:7px;left:50%;transform:translateX(-50%)}.d{bottom:7px;left:50%;transform:translateX(-50%)}.l{left:8px;top:50%;transform:translateY(-50%)}.r{right:8px;top:50%;transform:translateY(-50%)}
.message{position:absolute;left:max(14px,env(safe-area-inset-left));right:202px;bottom:max(14px,env(safe-area-inset-bottom));min-height:76px;max-width:700px;background:rgba(255,250,232,.97);border:1px solid #d9c98e;border-left:5px solid var(--gold);border-radius:0 13px 13px 0;padding:10px 13px;display:grid;align-content:center;box-shadow:var(--shadow)}.message b{font-size:10px;color:#59697b}.message p{font-size:13px;line-height:1.45;font-weight:850;margin:3px 0 0}.centerMarker{position:absolute;z-index:12;width:38px;height:34px;transform:translate(-50%,-70%);pointer-events:none;filter:drop-shadow(0 2px 1px #0004)}.centerMarker .roof{position:absolute;left:4px;top:0;width:30px;height:10px;background:#46536a;clip-path:polygon(10% 100%,28% 0,72% 0,90% 100%)}.centerMarker .body{position:absolute;left:7px;top:9px;width:24px;height:20px;background:#e5efe1;border:2px solid #3f4a5d}.centerMarker .door{position:absolute;left:8px;bottom:0;width:7px;height:10px;background:#8ea8b8;border:1px solid #38465b}.centerMarker .win{position:absolute;right:3px;top:5px;width:6px;height:6px;background:#b9dce8;border:1px solid #40516b}
.sheet{position:absolute;right:max(16px,env(safe-area-inset-right));top:72px;width:300px;max-height:65%;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 10px 30px rgba(18,37,62,.31);display:none;pointer-events:auto}.sheet.show{display:block}.sheet h2{font-size:17px;margin:0 0 6px}.sheet p{font-size:11px;line-height:1.6;color:#55677e;margin:4px 0}.sheet button{width:100%;min-height:42px;margin-top:9px;border:0;border-radius:9px;background:#263d60;color:#fff;font-weight:900}
.discovery{position:fixed;inset:0;z-index:1000;background:#05070a;display:none;color:#fff;pointer-events:auto}.discovery.show{display:block}.discovery img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#05070a}.discoveryShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),transparent 28%,transparent 58%,rgba(0,0,0,.78))}.discoveryTitle{position:absolute;left:max(24px,env(safe-area-inset-left));right:180px;bottom:max(28px,env(safe-area-inset-bottom));text-shadow:0 2px 8px #000}.discoveryTitle small{display:block;font-size:12px;font-weight:900;letter-spacing:.08em;color:#f0ce68}.discoveryTitle h1{font-size:clamp(25px,4vw,48px);line-height:1.15;margin:5px 0 8px}.credit{font-size:10px;line-height:1.4;color:#e6e9ed}.enterBtn{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));min-width:150px;min-height:58px;border:2px solid var(--gold);border-radius:14px;background:#fff;color:#172238;font-size:14px;font-weight:1000;box-shadow:0 5px 20px #0008}
@media(max-width:900px) and (orientation:landscape){.context{width:178px}.mini{height:112px}.controlRail{width:142px;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom))}.joy{width:138px;height:138px}.knob{width:56px;height:56px}.actionBtn{width:106px;min-height:53px}.message{right:174px;min-height:68px;max-width:590px}.discoveryTitle{right:165px}.enterBtn{min-width:135px}}
</style>
</head>
<body>
<div class="stage">
  <iframe id="mapFrame" src="japan-6x-map-lab.html?game=1" title="日本全国マップ"></iframe>
  <div class="ui">
    <section class="context"><div class="contextHead"><div><b>全国マップ</b><small id="areaName">現在地：北海道</small></div></div><div class="mini"><canvas id="miniMirror" width="180" height="132"></canvas></div><div class="miniHint">北固定｜緑＝世界遺産｜数字＝密集地</div></section>
    <nav class="topActions"><button id="bookBtn" class="book" type="button">遺産の書</button><button id="menuBtn" class="menu" type="button" aria-label="メニュー">☰</button></nav>
    <div id="centerLayer"></div>
    <div class="controlRail"><button id="actionBtn" class="actionBtn" type="button" disabled>しらべる</button><div id="actionSub" class="actionSub">遺産に近づこう</div><div id="joy" class="joy"><span class="mark u">▲</span><span class="mark d">▼</span><span class="mark l">◀</span><span class="mark r">▶</span><div id="knob" class="knob"></div></div></div>
    <section class="message"><b id="messageTitle">全国マップ</b><p id="messageText">日本を旅して、まだ見つけていない世界遺産を探そう。</p></section>
    <aside id="bookSheet" class="sheet"><h2>遺産の書</h2><p>見つけた世界遺産を記録する場所です。本格実装は後続フェーズで行います。</p><button type="button" data-close>閉じる</button></aside>
    <aside id="menuSheet" class="sheet"><h2>メニュー</h2><p id="progressText">発見 0 / 27</p><button type="button" data-close>閉じる</button></aside>
  </div>
</div>
<div id="discovery" class="discovery" role="dialog" aria-modal="true"><img id="discoveryImg" alt=""><div class="discoveryShade"></div><div class="discoveryTitle"><small>WORLD HERITAGE DISCOVERED</small><h1 id="discoveryName"></h1><div id="discoveryCredit" class="credit"></div></div><button id="enterCenter" class="enterBtn" type="button">研究センターへ</button></div>
<script>
(()=>{'use strict';
const SCALE=6,TILE=28,DISCOVERED_KEY='whqDiscoveredHeritage';
const HERITAGE=[
{id:1,name:'法隆寺地域の仏教建造物',x:44,y:49,type:'文化'},{id:2,name:'姫路城',x:40,y:48,type:'文化'},{id:3,name:'屋久島',x:25,y:59,type:'自然'},{id:4,name:'白神山地',x:57,y:29,type:'自然'},{id:5,name:'古都京都の文化財',x:46,y:47,type:'文化'},{id:6,name:'白川郷・五箇山の合掌造り集落',x:50,y:42,type:'文化'},{id:7,name:'原爆ドーム',x:36,y:48,type:'文化'},{id:8,name:'厳島神社',x:35,y:49,type:'文化'},{id:9,name:'古都奈良の文化財',x:45,y:48,type:'文化'},{id:10,name:'日光の社寺',x:54,y:44,type:'文化'},{id:11,name:'琉球王国のグスク及び関連遺産群',x:20,y:65,type:'文化'},{id:12,name:'紀伊山地の霊場と参詣道',x:47,y:50,type:'文化'},{id:13,name:'知床',x:77,y:9,type:'自然'},{id:14,name:'石見銀山遺跡とその文化的景観',x:36,y:47,type:'文化'},{id:15,name:'小笠原諸島',x:61,y:49,type:'自然'},{id:16,name:'平泉',x:57,y:34,type:'文化'},{id:17,name:'富士山―信仰の対象と芸術の源泉',x:51,y:44,type:'文化'},{id:18,name:'富岡製糸場と絹産業遺産群',x:53,y:43,type:'文化'},{id:19,name:'明治日本の産業革命遺産',x:24,y:53,type:'文化'},{id:20,name:'ル・コルビュジエの建築作品（国立西洋美術館）',x:56,y:46,type:'文化'},{id:21,name:'「神宿る島」宗像・沖ノ島と関連遺産群',x:26,y:50,type:'文化'},{id:22,name:'長崎と天草地方の潜伏キリシタン関連遺産',x:23,y:54,type:'文化'},{id:23,name:'百舌鳥・古市古墳群',x:43,y:50,type:'文化'},{id:24,name:'奄美大島、徳之島、沖縄島北部及び西表島',x:23,y:62,type:'自然'},{id:25,name:'北海道・北東北の縄文遺跡群',x:56,y:27,type:'文化'},{id:26,name:'佐渡島の金山',x:50,y:37,type:'文化'},{id:27,name:'飛鳥・藤原の宮都',x:45,y:49,type:'文化'}];
const frame=document.getElementById('mapFrame'),mini=document.getElementById('miniMirror'),mctx=mini.getContext('2d'),actionBtn=document.getElementById('actionBtn'),actionSub=document.getElementById('actionSub'),joy=document.getElementById('joy'),knob=document.getElementById('knob'),centerLayer=document.getElementById('centerLayer');
let manifest=new Map(),nearSite=null,pendingSite=null,poll=null,pid=null,repeat=null,dir=null;
function doc(){try{return frame.contentDocument}catch(_){return null}}
function discovered(){try{return new Set(JSON.parse(sessionStorage.getItem(DISCOVERED_KEY)||'[]').map(Number))}catch(_){return new Set()}}
function saveDiscovered(set){sessionStorage.setItem(DISCOVERED_KEY,JSON.stringify([...set]))}
function siteFine(s){return{x:(s.x+.5)*SCALE,y:(s.y+.5)*SCALE}}
function playerPos(){const t=doc()?.getElementById('posChip')?.textContent||'';const m=t.match(/(-?\d+)\s*,\s*(-?\d+)/);return m?{x:+m[1],y:+m[2]}:null}
function patchMap(){const d=doc();if(!d?.head)return;if(!d.getElementById('gameFullScreen')){const s=d.createElement('style');s.id='gameFullScreen';s.textContent=`html,body{width:100%!important;height:100%!important;overflow:hidden!important;background:#5f9fc6!important}.wrap{width:100%!important;height:100%!important;max-width:none!important;margin:0!important;padding:0!important}.head,.controls,.hud,.minimapBox,.dpad,.selected{display:none!important}.layout{display:block!important;width:100%!important;height:100%!important}.panel,.mapPanel{width:100%!important;height:100%!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important}.camera{width:100%!important;height:100%!important;min-height:0!important;border-radius:0!important}`;d.head.appendChild(s)}if(!d.documentElement.dataset.gameStart){d.documentElement.dataset.gameStart='1';setTimeout(()=>d.querySelector('[data-jump="hokkaido"]')?.click(),60)}}
function drawMini(){const d=doc(),src=d?.getElementById('mini');if(!src)return;try{mctx.clearRect(0,0,mini.width,mini.height);mctx.drawImage(src,0,0,mini.width,mini.height);const im=mctx.getImageData(0,0,mini.width,mini.height),p=im.data;for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2];if(r>82&&r<135&&g>42&&g<102&&b>32&&b<92){p[i]=31;p[i+1]=109;p[i+2]=81}}mctx.putImageData(im,0,0)}catch(_){}}
function centerHtml(){return '<div class="centerMarker"><i class="roof"></i><i class="body"><i class="door"></i><i class="win"></i></i></div>'}
function sync(){patchMap();drawMini();const d=doc(),p=playerPos();if(!d||!p)return;document.getElementById('areaName').textContent='現在地：'+(d.getElementById('areaChip')?.textContent||'日本');const found=discovered();document.getElementById('progressText').textContent=`発見 ${found.size} / 27`;centerLayer.innerHTML='';nearSite=null;let best=Infinity;for(const s of HERITAGE){const q=siteFine(s),dist=Math.hypot(q.x-p.x,q.y-p.y);if(found.has(s.id)){const x=innerWidth/2+(q.x-p.x)*TILE,y=innerHeight/2+(q.y-p.y)*TILE;if(x>-50&&y>-50&&x<innerWidth+50&&y<innerHeight+50){const w=document.createElement('div');w.innerHTML=centerHtml();const el=w.firstElementChild;el.style.left=x+'px';el.style.top=y+'px';centerLayer.appendChild(el)}}if(dist<best){best=dist;nearSite=s}}if(best<=4.2){actionBtn.disabled=false;actionBtn.textContent=found.has(nearSite.id)?'入る':'しらべる';actionSub.textContent=nearSite.name}else{nearSite=null;actionBtn.disabled=true;actionBtn.textContent='しらべる';actionSub.textContent='遺産に近づこう'}}
function setMessage(title,text){document.getElementById('messageTitle').textContent=title;document.getElementById('messageText').textContent=text}
async function loadManifest(){try{const r=await fetch('data/heritage-images.json',{cache:'no-store'}),j=await r.json();for(const s of j.sites||[])manifest.set(s.nameJa,s)}catch(e){console.warn('heritage image manifest unavailable',e)}}
function activate(s){const m=manifest.get(s.name);const slug=m?.id||('heritage-'+s.id);sessionStorage.setItem('whqActiveHeritageId',slug);sessionStorage.setItem('whqActiveHeritageNo',String(s.id));sessionStorage.setItem('whqActiveHeritageName',s.name);sessionStorage.setItem('whqActiveHeritageType',s.type);const lk='whqCenterLevel:'+slug;if(!sessionStorage.getItem(lk))sessionStorage.setItem(lk,'2');return{slug,meta:m}}
function openCenter(s){const a=activate(s),lv=Number(sessionStorage.getItem('whqCenterLevel:'+a.slug))||2;if(window.parent!==window)window.parent.postMessage({type:'whqOpenCenter',site:a.slug,heritageId:s.id,name:s.name,level:lv},'*');else location.href='research-center-game.html'}
function showDiscovery(s){pendingSite=s;const a=activate(s),m=a.meta,img=m?.images?.find(x=>x.role==='representative')||m?.images?.[0];const box=document.getElementById('discovery'),pic=document.getElementById('discoveryImg');document.getElementById('discoveryName').textContent=s.name;pic.alt=s.name;if(img){pic.src=`docs/assets/heritage/${a.slug}/${img.file}`;document.getElementById('discoveryCredit').textContent=`Photo: ${img.author||'Wikimedia Commons'} / ${img.license||''}`.trim()}else{pic.removeAttribute('src');document.getElementById('discoveryCredit').textContent='画像情報を読み込めませんでした'}box.classList.add('show');setMessage('世界遺産を発見！',`${s.name}を発見した！`) }
actionBtn.addEventListener('click',()=>{if(!nearSite)return;const set=discovered();if(set.has(nearSite.id))openCenter(nearSite);else showDiscovery(nearSite)});
document.getElementById('enterCenter').addEventListener('click',()=>{if(!pendingSite)return;const set=discovered();set.add(pendingSite.id);saveDiscovered(set);document.getElementById('discovery').classList.remove('show');const s=pendingSite;pendingSite=null;openCenter(s)});
function sendKey(key){const c=doc()?.getElementById('camera');if(!c)return;c.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}))}
function direction(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;if(Math.hypot(dx,dy)<13)return null;return Math.abs(dx)>Math.abs(dy)?(dx>0?'ArrowRight':'ArrowLeft'):(dy>0?'ArrowDown':'ArrowUp')}
function place(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=42,dist=Math.hypot(dx,dy)||1,q=Math.min(1,m/dist);knob.style.transform=`translate(calc(-50% + ${dx*q}px),calc(-50% + ${dy*q}px))`}
function stop(){pid=null;dir=null;clearInterval(repeat);repeat=null;knob.style.transform='translate(-50%,-50%)'}
joy.addEventListener('pointerdown',e=>{pid=e.pointerId;joy.setPointerCapture(pid);place(e);dir=direction(e);if(dir)sendKey(dir);repeat=setInterval(()=>{if(dir)sendKey(dir)},90)});joy.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;place(e);dir=direction(e)});joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();sendKey(e.key)}});
function closeSheets(){document.getElementById('bookSheet').classList.remove('show');document.getElementById('menuSheet').classList.remove('show')}
document.getElementById('bookBtn').addEventListener('click',()=>{document.getElementById('menuSheet').classList.remove('show');document.getElementById('bookSheet').classList.toggle('show')});document.getElementById('menuBtn').addEventListener('click',()=>{document.getElementById('bookSheet').classList.remove('show');document.getElementById('menuSheet').classList.toggle('show')});document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeSheets));
frame.addEventListener('load',()=>{patchMap();clearInterval(poll);poll=setInterval(sync,120)});window.addEventListener('message',e=>{if(e.data?.type==='whqRefreshMap')sync()});loadManifest();
})();
</script>
</body>
</html>
