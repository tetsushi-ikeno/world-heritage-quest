<!doctype html>
<html lang="ja">
<head>

<title>世界遺産クエスト｜日本全国</title>
<style>
:root{--ink:#1c2a40;--muted:#63748a;--panel:rgba(255,255,255,.95);--line:#bfcddd;--navy:#172238;--gold:#e5b83f;--green:#1f6d51;--plain:#82b85d;--shadow:0 5px 18px rgba(18,37,62,.23)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#5f9fc6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;user-select:none}button{font:inherit;touch-action:manipulation}.stage{position:relative;width:100%;height:100%;overflow:hidden}#mapFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#5f9fc6}.ui{position:absolute;inset:0;z-index:30;pointer-events:none}
.context{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));width:200px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px;box-shadow:var(--shadow)}.contextHead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}.contextHead b{font-size:15px}.contextHead small{font-size:9px;color:var(--muted);font-weight:800}.mini{height:132px;border:1px solid #aebfcd;border-radius:9px;overflow:hidden;background:#dceef6}.mini canvas{width:100%;height:100%;display:block}.miniHint{font-size:8px;color:var(--muted);font-weight:800;text-align:center;margin-top:4px}
.topActions{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}.topActions button{min-height:48px;border:1px solid #acbbcb;border-radius:12px;background:var(--panel);color:#273a54;padding:0 14px;font-size:12px;font-weight:900;box-shadow:var(--shadow)}.topActions .menu{min-width:52px;padding:0 10px;font-size:21px}.topActions .book{min-width:96px}
.controlRail{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(17px,env(safe-area-inset-bottom));width:158px;display:grid;gap:8px;justify-items:center;pointer-events:auto}.actionBtn{width:116px;min-height:58px;border:2px solid var(--gold);border-radius:14px;background:var(--navy);color:#fff;font-size:14px;font-weight:1000;box-shadow:var(--shadow)}.actionBtn:disabled{opacity:.42;border-color:#aab4c0;background:#556276}.actionSub{margin-top:-4px;min-height:15px;font-size:8px;font-weight:900;color:#263950;background:rgba(255,255,255,.88);border-radius:999px;padding:2px 7px;text-align:center;max-width:152px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.joy{position:relative;width:154px;height:154px;border-radius:50%;background:radial-gradient(circle,#e3ebf4 0 30%,#263a59 31% 34%,#18263e 35% 100%);border:2px solid #879bb8;box-shadow:var(--shadow);touch-action:none}.knob{position:absolute;left:50%;top:50%;width:62px;height:62px;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(#edf3fa,#bac9dc);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3)}.mark{position:absolute;color:#dce6f4;font-weight:1000}.u{top:7px;left:50%;transform:translateX(-50%)}.d{bottom:7px;left:50%;transform:translateX(-50%)}.l{left:8px;top:50%;transform:translateY(-50%)}.r{right:8px;top:50%;transform:translateY(-50%)}
.message{position:absolute;left:max(14px,env(safe-area-inset-left));right:202px;bottom:max(14px,env(safe-area-inset-bottom));min-height:76px;max-width:700px;background:rgba(255,250,232,.97);border:1px solid #d9c98e;border-left:5px solid var(--gold);border-radius:0 13px 13px 0;padding:10px 13px;display:grid;align-content:center;box-shadow:var(--shadow)}.message b{font-size:10px;color:#59697b}.message p{font-size:13px;line-height:1.45;font-weight:850;margin:3px 0 0}
.centerMarker{position:absolute;z-index:12;width:46px;height:42px;transform:translate(-50%,-70%);pointer-events:none;filter:drop-shadow(0 2px 1px #0004)}.centerMarker .cover{position:absolute;left:5px;top:5px;width:36px;height:32px;background:var(--plain);border-radius:4px}.centerMarker .roof{position:absolute;left:4px;top:0;width:38px;height:12px;background:#46536a;clip-path:polygon(8% 100%,25% 0,75% 0,92% 100%)}.centerMarker .body{position:absolute;left:7px;top:10px;width:32px;height:27px;background:#e5efe1;border:2px solid #3f4a5d}.centerMarker .door{position:absolute;left:6px;bottom:0;width:9px;height:13px;background:#8ea8b8;border:1px solid #38465b}.centerMarker .win{position:absolute;right:4px;top:6px;width:8px;height:8px;background:#b9dce8;border:1px solid #40516b}.centerLabel{position:absolute;left:50%;top:43px;transform:translateX(-50%);max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.96);border:1px solid #b8c5d3;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:1000;color:#243952;box-shadow:0 2px 7px #0002}
.sheet{position:absolute;right:max(16px,env(safe-area-inset-right));top:72px;width:310px;max-height:70%;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 10px 30px rgba(18,37,62,.31);display:none;pointer-events:auto}.sheet.show{display:block}.sheet h2{font-size:17px;margin:0 0 6px}.sheet p{font-size:11px;line-height:1.6;color:#55677e;margin:4px 0}.sheet button{width:100%;min-height:42px;margin-top:9px;border:0;border-radius:9px;background:#263d60;color:#fff;font-weight:900}.sheet .danger{background:#7d3540}.confirmBox{margin-top:10px;padding:10px;border:1px solid #dfc4c8;border-radius:10px;background:#fff7f7;display:none}.confirmBox.show{display:block}.confirmBox b{font-size:12px}.confirmActions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.confirmActions button{margin-top:7px}.confirmActions .cancel{background:#e7ebef;color:#314056}
.discovery{position:fixed;inset:0;z-index:1000;background:#05070a;display:none;color:#fff;pointer-events:auto}.discovery.show{display:block}.discovery img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#05070a}.discoveryShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),transparent 28%,transparent 55%,rgba(0,0,0,.82))}.discoveryTitle{position:absolute;left:max(24px,env(safe-area-inset-left));right:330px;bottom:max(28px,env(safe-area-inset-bottom));text-shadow:0 2px 8px #000}.discoveryTitle small{display:block;font-size:12px;font-weight:900;letter-spacing:.08em;color:#f0ce68}.discoveryTitle h1{font-size:clamp(25px,4vw,48px);line-height:1.15;margin:5px 0 8px}.credit{font-size:10px;line-height:1.4;color:#e6e9ed}.discoveryActions{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:270px;display:grid;gap:9px}.discoveryActions button{min-height:56px;border-radius:14px;font-size:14px;font-weight:1000;box-shadow:0 5px 20px #0008}.enterBtn{border:2px solid var(--gold);background:#fff;color:#172238}.laterBtn{border:1px solid #c7ced7;background:rgba(28,38,54,.93);color:#fff}
.command{position:fixed;inset:0;z-index:900;background:rgba(12,20,32,.50);display:none;place-items:center;pointer-events:auto}.command.show{display:grid}.commandBox{width:min(430px,88vw);background:#fff;border:3px solid var(--gold);border-radius:18px;padding:20px;box-shadow:0 15px 45px #0006;text-align:center}.commandBox small{font-size:10px;color:#6a7688;font-weight:900}.commandBox h2{font-size:21px;margin:5px 0 14px}.commandActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.commandActions button{min-height:52px;border-radius:11px;font-weight:1000}.commandActions .primary{border:0;background:var(--navy);color:#fff}.commandActions .secondary{border:1px solid #bdc7d2;background:#fff;color:#30405a}
.loading{position:fixed;inset:0;z-index:1100;display:grid;place-items:center;background:#5f9fc6;color:#fff;font-size:13px;font-weight:1000;transition:.2s}.loading.hide{opacity:0;pointer-events:none}
@media(max-width:900px) and (orientation:landscape){.context{width:178px}.mini{height:112px}.controlRail{width:142px;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom))}.joy{width:138px;height:138px}.knob{width:56px;height:56px}.actionBtn{width:106px;min-height:53px}.message{right:174px;min-height:68px;max-width:590px}.discoveryTitle{right:285px}.discoveryActions{width:230px}.centerLabel{max-width:140px}}
</style>
</head>
<body>
<div class="stage">
  <iframe id="mapFrame" src="japan-6x-map-lab.html?game=1" title="日本全国マップ"></iframe>
  <div class="ui">
    <section class="context"><div class="contextHead"><div><b>全国マップ</b><small id="areaName">現在地：北海道</small></div></div><div class="mini"><canvas id="miniMirror" width="180" height="132"></canvas></div><div class="miniHint">北固定｜現在地を表示</div></section>
    <nav class="topActions"><button id="bookBtn" class="book" type="button">遺産の書</button><button id="menuBtn" class="menu" type="button" aria-label="メニュー">☰</button></nav>
    <div id="centerLayer"></div>
    <div class="controlRail"><button id="actionBtn" class="actionBtn" type="button" disabled>しらべる</button><div id="actionSub" class="actionSub">遺産を探そう</div><div id="joy" class="joy"><span class="mark u">▲</span><span class="mark d">▼</span><span class="mark l">◀</span><span class="mark r">▶</span><div id="knob" class="knob"></div></div></div>
    <section class="message"><b id="messageTitle">全国マップ</b><p id="messageText">日本を旅して、まだ見つけていない世界遺産を探そう。</p></section>
    <aside id="bookSheet" class="sheet"><h2>遺産の書</h2><p>ベータ版では、まず「見つける→センターで調べる」体験を完成させます。遺産の書の本格機能は次のフェーズで追加します。</p><button type="button" data-close>閉じる</button></aside>
    <aside id="menuSheet" class="sheet"><h2>メニュー</h2><p id="playerText"></p><p id="progressText">発見 0 / 27</p><button type="button" data-close>閉じる</button><button id="resetAsk" class="danger" type="button">データをリセット</button><div id="resetConfirm" class="confirmBox"><b>名前・現在地・発見・センターの体験状況をすべて消します。</b><div class="confirmActions"><button id="resetCancel" class="cancel" type="button">やめる</button><button id="resetDo" class="danger" type="button">リセットする</button></div></div></aside>
  </div>
</div>
<div id="discovery" class="discovery" role="dialog" aria-modal="true"><img id="discoveryImg" alt=""><div class="discoveryShade"></div><div class="discoveryTitle"><small>世界遺産を発見！</small><h1 id="discoveryName"></h1><div id="discoveryCredit" class="credit"></div></div><div class="discoveryActions"><button id="enterCenter" class="enterBtn" type="button">センターへ入る</button><button id="laterBtn" class="laterBtn" type="button">あとで</button></div></div>
<div id="visitCommand" class="command" role="dialog" aria-modal="true"><div class="commandBox"><small>発見済みの世界遺産</small><h2 id="visitName"></h2><div class="commandActions"><button id="visitBack" class="secondary" type="button">戻る</button><button id="visitEnter" class="primary" type="button">センターに入る</button></div></div></div>
<div id="loading" class="loading">全国マップを準備しています…</div>
<script src="beta-save.js"></script>
<script>
(()=>{'use strict';
const SCALE=6,TILE=28,CONTACT=2.7,LEAVE=4.2;
const HERITAGE=[
{id:1,slug:'horyuji',name:'法隆寺地域の仏教建造物',x:44,y:49,type:'文化'},{id:2,slug:'himeji',name:'姫路城',x:40,y:48,type:'文化'},{id:3,slug:'yakushima',name:'屋久島',x:25,y:59,type:'自然'},{id:4,slug:'shirakami',name:'白神山地',x:57,y:29,type:'自然'},{id:5,slug:'kyoto',name:'古都京都の文化財',x:46,y:47,type:'文化'},{id:6,slug:'shirakawago',name:'白川郷・五箇山の合掌造り集落',x:50,y:42,type:'文化'},{id:7,slug:'hiroshima',name:'原爆ドーム',x:36,y:48,type:'文化'},{id:8,slug:'itsukushima',name:'厳島神社',x:35,y:49,type:'文化'},{id:9,slug:'nara',name:'古都奈良の文化財',x:45,y:48,type:'文化'},{id:10,slug:'nikko',name:'日光の社寺',x:54,y:44,type:'文化'},{id:11,slug:'ryukyu',name:'琉球王国のグスク及び関連遺産群',x:20,y:65,type:'文化'},{id:12,slug:'kii',name:'紀伊山地の霊場と参詣道',x:47,y:50,type:'文化'},{id:13,slug:'shiretoko',name:'知床',x:77,y:9,type:'自然'},{id:14,slug:'iwami',name:'石見銀山遺跡とその文化的景観',x:36,y:47,type:'文化'},{id:15,slug:'ogasawara',name:'小笠原諸島',x:61,y:49,type:'自然'},{id:16,slug:'hiraizumi',name:'平泉',x:57,y:34,type:'文化'},{id:17,slug:'fujisan',name:'富士山―信仰の対象と芸術の源泉',x:51,y:44,type:'文化'},{id:18,slug:'tomioka',name:'富岡製糸場と絹産業遺産群',x:53,y:43,type:'文化'},{id:19,slug:'meiji-industrial',name:'明治日本の産業革命遺産',x:24,y:53,type:'文化'},{id:20,slug:'le-corbusier',name:'ル・コルビュジエの建築作品（国立西洋美術館）',x:56,y:46,type:'文化'},{id:21,slug:'okinoshima',name:'「神宿る島」宗像・沖ノ島と関連遺産群',x:26,y:50,type:'文化'},{id:22,slug:'hidden-christian',name:'長崎と天草地方の潜伏キリシタン関連遺産',x:23,y:54,type:'文化'},{id:23,slug:'mozu-furuichi',name:'百舌鳥・古市古墳群',x:43,y:50,type:'文化'},{id:24,slug:'amami-okinawa',name:'奄美大島、徳之島、沖縄島北部及び西表島',x:23,y:62,type:'自然'},{id:25,slug:'jomon',name:'北海道・北東北の縄文遺跡群',x:56,y:27,type:'文化'},{id:26,slug:'sado',name:'佐渡島の金山',x:50,y:37,type:'文化'},{id:27,slug:'asuka-fujiwara',name:'飛鳥・藤原の宮都',x:45,y:49,type:'文化'}];
const frame=document.getElementById('mapFrame'),mini=document.getElementById('miniMirror'),mctx=mini.getContext('2d'),actionBtn=document.getElementById('actionBtn'),actionSub=document.getElementById('actionSub'),joy=document.getElementById('joy'),knob=document.getElementById('knob'),centerLayer=document.getElementById('centerLayer');
let manifest=new Map(),nearSite=null,pendingSite=null,visitSite=null,poll=null,pid=null,repeat=null,dir=null,ready=false,restoring=false,contactLatched=null;
function doc(){try{return frame.contentDocument}catch(_){return null}}
function saveState(){return window.WHQBetaSave.load()}
function discoveredSet(){return new Set(saveState().discovered.map(Number))}
function siteFine(s){return{x:(s.x+.5)*SCALE,y:(s.y+.5)*SCALE}}
function playerPos(){const t=doc()?.getElementById('posChip')?.textContent||'';const m=t.match(/(-?\d+)\s*,\s*(-?\d+)/);return m?{x:+m[1],y:+m[2]}:null}
function setSpeed(n){const d=doc();if(!d)return;d.querySelector(`#speedButtons [data-speed="${n}"]`)?.click()}
function rawKey(key){const c=doc()?.getElementById('camera');if(!c)return;c.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}))}
function dirChar(dx,dy){return dx>0?'R':dx<0?'L':dy>0?'D':'U'}
function keyFor(ch){return{U:'ArrowUp',D:'ArrowDown',L:'ArrowLeft',R:'ArrowRight'}[ch]}
function appendDelta(dx,dy){const n=Math.abs(dx)+Math.abs(dy);if(!n)return;const ch=dirChar(dx,dy);window.WHQBetaSave.update(s=>{const path=s.map.path;const last=path[path.length-1];if(last&&last[0]===ch)last[1]+=n;else path.push([ch,n]);s.map.position=playerPos();return s})}
function sendKey(key,record=true){const before=playerPos();rawKey(key);const after=playerPos();if(record&&before&&after)appendDelta(after.x-before.x,after.y-before.y);return after}
function patchMap(){const d=doc();if(!d?.head)return;if(!d.getElementById('gameFullScreen')){const s=d.createElement('style');s.id='gameFullScreen';s.textContent=`html,body{width:100%!important;height:100%!important;overflow:hidden!important;background:#5f9fc6!important}.wrap{width:100%!important;height:100%!important;max-width:none!important;margin:0!important;padding:0!important}.head,.controls,.hud,.minimapBox,.dpad,.selected{display:none!important}.layout{display:block!important;width:100%!important;height:100%!important}.panel,.mapPanel{width:100%!important;height:100%!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important}.camera{width:100%!important;height:100%!important;min-height:0!important;border-radius:0!important}`;d.head.appendChild(s)}}
function goBetaStart(){const d=doc();if(!d)return;d.querySelector('[data-jump="hokkaido"]')?.click();setSpeed(1);let same=0;for(let i=0;i<220;i++){const a=playerPos();rawKey('ArrowUp');const b=playerPos();if(!a||!b||a.x===b.x&&a.y===b.y){same++;if(same>2)break}else same=0}setSpeed(2)}
function replaySavedPath(){const state=saveState(),runs=state.map.path||[];restoring=true;goBetaStart();setSpeed(1);for(const [ch,count] of runs){const key=keyFor(ch);for(let i=0;i<count;i++)rawKey(key)}setSpeed(2);restoring=false;window.WHQBetaSave.update(s=>{s.map.position=playerPos();return s})}
function prepare(){patchMap();setTimeout(()=>{replaySavedPath();ready=true;document.getElementById('loading').classList.add('hide');sync()},90)}
function drawMini(){const d=doc(),src=d?.getElementById('mini');if(!src)return;try{mctx.clearRect(0,0,mini.width,mini.height);mctx.drawImage(src,0,0,mini.width,mini.height)}catch(_){}}
function centerHtml(name){return `<div class="centerMarker"><i class="cover"></i><i class="roof"></i><i class="body"><i class="door"></i><i class="win"></i></i><span class="centerLabel">${escapeHtml(name)}</span></div>`}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setMessage(title,text){document.getElementById('messageTitle').textContent=title;document.getElementById('messageText').textContent=text}
function markDiscovered(s){window.WHQBetaSave.update(st=>{if(!st.discovered.includes(s.id))st.discovered.push(s.id);return st})}
function lockSite(id){window.WHQBetaSave.update(st=>{st.map.returnLockSiteId=id;return st});contactLatched=id}
function clearLock(){window.WHQBetaSave.update(st=>{st.map.returnLockSiteId=null;return st})}
function handleContact(p,found){if(!ready||restoring||document.getElementById('discovery').classList.contains('show')||document.getElementById('visitCommand').classList.contains('show'))return;let closest=null,best=Infinity;for(const s of HERITAGE){const q=siteFine(s),dist=Math.hypot(q.x-p.x,q.y-p.y);if(dist<best){best=dist;closest=s}}
 const lock=saveState().map.returnLockSiteId;if(lock){const ls=HERITAGE.find(s=>s.id===Number(lock));if(ls){const q=siteFine(ls);if(Math.hypot(q.x-p.x,q.y-p.y)>LEAVE){clearLock();contactLatched=null}}}
 if(best>LEAVE){contactLatched=null;return}if(best>CONTACT||!closest)return;if(Number(saveState().map.returnLockSiteId)===closest.id)return;if(contactLatched===closest.id)return;contactLatched=closest.id;if(found.has(closest.id))showVisit(closest);else showDiscovery(closest)}
function sync(){patchMap();drawMini();const d=doc(),p=playerPos();if(!d||!p)return;document.getElementById('areaName').textContent='現在地：'+(d.getElementById('areaChip')?.textContent||'日本');const state=saveState(),found=new Set(state.discovered.map(Number));document.getElementById('progressText').textContent=`発見 ${found.size} / 27`;document.getElementById('playerText').textContent=state.playerName?`調査員：${state.playerName}`:'';centerLayer.innerHTML='';nearSite=null;let best=Infinity;for(const s of HERITAGE){const q=siteFine(s),dist=Math.hypot(q.x-p.x,q.y-p.y);if(found.has(s.id)){const x=innerWidth/2+(q.x-p.x)*TILE,y=innerHeight/2+(q.y-p.y)*TILE;if(x>-120&&y>-80&&x<innerWidth+120&&y<innerHeight+100){const w=document.createElement('div');w.innerHTML=centerHtml(s.name);const el=w.firstElementChild;el.style.left=x+'px';el.style.top=y+'px';centerLayer.appendChild(el)}}if(dist<best){best=dist;nearSite=s}}
 if(best<=CONTACT){actionBtn.disabled=false;actionBtn.textContent=found.has(nearSite.id)?'入る':'しらべる';actionSub.textContent=nearSite.name}else{nearSite=null;actionBtn.disabled=true;actionBtn.textContent='しらべる';actionSub.textContent='遺産を探そう'}if(ready&&!restoring)window.WHQBetaSave.update(s=>{s.map.position=p;return s});handleContact(p,found)}
async function loadManifest(){try{const r=await fetch('data/heritage-images.json',{cache:'no-store'}),j=await r.json();for(const s of j.sites||[])manifest.set(s.nameJa,s)}catch(e){console.warn('heritage image manifest unavailable',e)}}
function activate(s){sessionStorage.setItem('whqActiveHeritageId',s.slug);sessionStorage.setItem('whqActiveHeritageNo',String(s.id));sessionStorage.setItem('whqActiveHeritageName',s.name);sessionStorage.setItem('whqActiveHeritageType',s.type)}
function centerOnSite(s){const q=siteFine(s);setSpeed(1);let guard=0;while(guard++<30){const p=playerPos();if(!p)break;if(p.x===q.x&&p.y===q.y)break;let key=null;if(p.x<q.x)key='ArrowRight';else if(p.x>q.x)key='ArrowLeft';else if(p.y<q.y)key='ArrowDown';else if(p.y>q.y)key='ArrowUp';const before=p,after=sendKey(key,true);if(!after||after.x===before.x&&after.y===before.y){if(p.y<q.y)key='ArrowDown';else if(p.y>q.y)key='ArrowUp';else break;const a2=sendKey(key,true);if(!a2||a2.x===before.x&&a2.y===before.y)break}}setSpeed(2);window.WHQBetaSave.update(st=>{st.map.position=playerPos();st.map.returnLockSiteId=s.id;return st})}
function openCenter(s){centerOnSite(s);activate(s);if(window.parent!==window)window.parent.postMessage({type:'whqOpenCenter',site:s.slug,heritageId:s.id,name:s.name},'*');else location.href='research-center-game.html'}
function showDiscovery(s){pendingSite=s;markDiscovered(s);const m=manifest.get(s.name),img=m?.images?.find(x=>x.role==='representative')||m?.images?.[0];const box=document.getElementById('discovery'),pic=document.getElementById('discoveryImg');document.getElementById('discoveryName').textContent=s.name;pic.alt=s.name;if(img){pic.src=`docs/assets/heritage/${s.slug}/${img.file}`;document.getElementById('discoveryCredit').textContent=`Photo: ${img.author||'Wikimedia Commons'} / ${img.license||''}`.trim()}else{pic.removeAttribute('src');document.getElementById('discoveryCredit').textContent='画像情報を読み込めませんでした'}box.classList.add('show');setMessage('世界遺産を発見！',`${s.name}を発見した！`);sync()}
function closeDiscoveryLater(){if(!pendingSite)return;lockSite(pendingSite.id);document.getElementById('discovery').classList.remove('show');setMessage('発見済み',`${pendingSite.name}は地図に記録された。いつでも研究センターへ戻れるよ。`);pendingSite=null;sync()}
function showVisit(s){visitSite=s;document.getElementById('visitName').textContent=s.name;document.getElementById('visitCommand').classList.add('show')}
function closeVisit(){if(visitSite)lockSite(visitSite.id);visitSite=null;document.getElementById('visitCommand').classList.remove('show')}
actionBtn.addEventListener('click',()=>{if(!nearSite)return;const found=discoveredSet();if(found.has(nearSite.id))showVisit(nearSite);else showDiscovery(nearSite)});
document.getElementById('enterCenter').addEventListener('click',()=>{if(!pendingSite)return;const s=pendingSite;pendingSite=null;document.getElementById('discovery').classList.remove('show');openCenter(s)});
document.getElementById('laterBtn').addEventListener('click',closeDiscoveryLater);
document.getElementById('visitEnter').addEventListener('click',()=>{if(!visitSite)return;const s=visitSite;visitSite=null;document.getElementById('visitCommand').classList.remove('show');openCenter(s)});
document.getElementById('visitBack').addEventListener('click',closeVisit);
function direction(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;if(Math.hypot(dx,dy)<13)return null;return Math.abs(dx)>Math.abs(dy)?(dx>0?'ArrowRight':'ArrowLeft'):(dy>0?'ArrowDown':'ArrowUp')}
function place(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=42,dist=Math.hypot(dx,dy)||1,q=Math.min(1,m/dist);knob.style.transform=`translate(calc(-50% + ${dx*q}px),calc(-50% + ${dy*q}px))`}
function stop(){pid=null;dir=null;clearInterval(repeat);repeat=null;knob.style.transform='translate(-50%,-50%)'}
joy.addEventListener('pointerdown',e=>{if(!ready)return;pid=e.pointerId;joy.setPointerCapture(pid);place(e);dir=direction(e);if(dir)sendKey(dir,true);repeat=setInterval(()=>{if(dir)sendKey(dir,true)},90)});joy.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;place(e);dir=direction(e)});joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&ready){e.preventDefault();sendKey(e.key,true)}});
function closeSheets(){document.getElementById('bookSheet').classList.remove('show');document.getElementById('menuSheet').classList.remove('show');document.getElementById('resetConfirm').classList.remove('show')}
document.getElementById('bookBtn').addEventListener('click',()=>{document.getElementById('menuSheet').classList.remove('show');document.getElementById('bookSheet').classList.toggle('show')});document.getElementById('menuBtn').addEventListener('click',()=>{document.getElementById('bookSheet').classList.remove('show');document.getElementById('menuSheet').classList.toggle('show')});document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeSheets));
document.getElementById('resetAsk').addEventListener('click',()=>document.getElementById('resetConfirm').classList.add('show'));document.getElementById('resetCancel').addEventListener('click',()=>document.getElementById('resetConfirm').classList.remove('show'));document.getElementById('resetDo').addEventListener('click',()=>{window.WHQBetaSave.reset();if(window.parent!==window)window.parent.postMessage({type:'whqResetBeta'},'*');else location.href='beta.html'});
frame.addEventListener('load',()=>{clearInterval(poll);prepare();poll=setInterval(sync,120)});window.addEventListener('message',e=>{if(e.data?.type==='whqRefreshMap')sync()});loadManifest();
})();
</script>
</body>
