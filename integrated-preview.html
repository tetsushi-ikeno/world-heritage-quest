<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>世界遺産クエスト 統合プレビュー</title>
<style>
:root{--ink:#1d2940;--muted:#68768b;--navy:#253149;--gold:#e3b53c;--bg:#eef2f6;--line:#c6cfdb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}button{font:inherit;touch-action:manipulation}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.top{background:#fff;border-bottom:1px solid var(--line);padding:7px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:10}.brand{font-size:12px;font-weight:1000;white-space:nowrap}.steps{display:flex;gap:5px;min-width:0}.step{border:1px solid #bcc6d2;background:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:1000;color:#58687d;cursor:pointer;white-space:nowrap}.step.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:inset 0 0 0 2px var(--gold)}.frameWrap{position:relative;min-height:0;background:#e7edf4}#previewFrame{width:100%;height:100%;border:0;display:block;background:#eef2f6}.overlay{position:absolute;left:12px;bottom:12px;z-index:30;background:rgba(23,34,56,.95);color:#fff;border:2px solid var(--gold);border-radius:13px;padding:9px 12px;max-width:360px;box-shadow:0 7px 22px rgba(0,0,0,.18);font-size:11px;line-height:1.5;pointer-events:none;opacity:0;transform:translateY(8px);transition:.2s}.overlay.show{opacity:1;transform:none}.overlay b{display:block;font-size:12px;margin-bottom:2px}@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.steps{width:100%;overflow:auto}.brand{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">世界遺産クエスト｜ゲーム全体像プレビュー</div><nav class="steps" aria-label="プレビュー画面"><button class="step" data-stage="tutorial">1 チュートリアル</button><button class="step" data-stage="map">2 日本全国</button><button class="step" data-stage="center">3 研究センター</button></nav></header>
<main class="frameWrap"><iframe id="previewFrame" title="世界遺産クエスト統合プレビュー"></iframe><div id="overlay" class="overlay"></div></main>
</div>
<script>
(()=>{'use strict';
const frame=document.getElementById('previewFrame'),overlay=document.getElementById('overlay'),steps=[...document.querySelectorAll('.step')],params=new URLSearchParams(location.search);
const LEVEL_KEY='whqGameCenterLevel',DONE_KEY='whqShiretokoInvestigated';
if(params.get('reset')==='1'){sessionStorage.removeItem(LEVEL_KEY);sessionStorage.removeItem(DONE_KEY)}
let stage=['tutorial','map','center'].includes(params.get('start'))?params.get('start'):'tutorial',poll=null;
const src={tutorial:'tutorial-design-baseline.html?gamePreview=1',map:'area-map-game.html?gamePreview=1',center:'research-center-game.html?gamePreview=1'};
function notice(title,text,ms=3000){overlay.innerHTML=`<b>${title}</b>${text}`;overlay.classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>overlay.classList.remove('show'),ms)}
function chrome(){steps.forEach(b=>b.classList.toggle('active',b.dataset.stage===stage))}
function showStage(next){if(poll){clearInterval(poll);poll=null}stage=next;chrome();frame.src=src[next]}
steps.forEach(b=>b.addEventListener('click',()=>{if(b.dataset.stage==='center'&&(Number(sessionStorage.getItem(LEVEL_KEY))||1)<2)sessionStorage.setItem(LEVEL_KEY,'2');showStage(b.dataset.stage)}));
function tutorialDoc(){try{return frame.contentDocument?.getElementById('tutorialFrame')?.contentDocument||null}catch(e){return null}}
function patchTutorial(){if(stage!=='tutorial')return;const doc=tutorialDoc();if(!doc)return;const story=[...doc.querySelectorAll('.storyCopy .copy')].find(el=>el.textContent.includes('アブ・シンベル神殿'));if(story&&!story.dataset.gameTimeAxis){story.innerHTML='<strong>約3300年前</strong>に建てられた、エジプトの巨大な<strong>アブ・シンベル神殿</strong>。<br><br><strong>今から約60年前（1960年代）</strong>、ダムをつくることになって、この神殿が<strong>水の中にしずみそうになった！</strong>';story.dataset.gameTimeAxis='1'}doc.querySelectorAll('.skipNote').forEach(n=>{if(n.textContent.includes('Labでは'))n.textContent='日本全国を自由に移動できるよ。まずは北海道の知床を目指してみよう！'});const finalLead=[...doc.querySelectorAll('.final div')].find(el=>el.textContent.trim()==='最初のエリアは……北海道！');if(finalLead)finalLead.textContent='まずは……北海道から調べてみよう！';const finish=[...doc.querySelectorAll('button.btn.primary')].find(b=>['北海道へ出発！','全国マップへ出発！'].includes(b.textContent.trim()));if(finish&&!finish.dataset.gameBridge){finish.dataset.gameBridge='1';finish.textContent='全国マップへ出発！';finish.removeAttribute('onclick');finish.addEventListener('click',e=>{e.preventDefault();showStage('map')})}}
frame.addEventListener('load',()=>{if(stage==='tutorial'){patchTutorial();poll=setInterval(patchTutorial,250)}});
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='whqOpenCenter'){if(d.level)sessionStorage.setItem(LEVEL_KEY,String(d.level));showStage('center')}else if(d.type==='whqCenterLevel'){if(d.level)sessionStorage.setItem(LEVEL_KEY,String(d.level));if(d.level===3)notice('研究センター成長','知床研究センターがLV3になりました。外へ出ると全国マップにも反映されます。',3800)}else if(d.type==='whqExitCenter'){if(d.level)sessionStorage.setItem(LEVEL_KEY,String(d.level));showStage('map')}});
chrome();showStage(stage);
})();
</script>
</body>
</html>
