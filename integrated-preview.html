<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>世界遺産クエスト 統合プレビュー</title>
<style>
:root{--ink:#1d2940;--muted:#68768b;--navy:#253149;--gold:#e3b53c;--bg:#eef2f6;--line:#c6cfdb;--panel:#fff;--nature:#5f9270}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}
button{font:inherit;touch-action:manipulation}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
.top{background:#fff;border-bottom:1px solid var(--line);padding:8px 10px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;z-index:10}
.brand{font-weight:1000;white-space:nowrap}.brand small{display:block;font-size:9px;color:var(--muted);font-weight:900;margin-top:2px}
.steps{display:flex;justify-content:center;gap:6px;min-width:0}
.step{border:1px solid #bcc6d2;background:#fff;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:1000;color:#58687d;cursor:pointer;white-space:nowrap}
.step.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:inset 0 0 0 2px var(--gold)}
.tools{display:flex;align-items:center;justify-content:flex-end;gap:5px;min-width:245px}
.badge{background:var(--navy);color:#fff;border:2px solid var(--gold);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:1000;white-space:nowrap}
.growth{display:none;gap:4px}.growth.show{display:flex}
.growth button,.backMap{border:1px solid #b9c4d2;background:#fff;border-radius:8px;padding:6px 7px;font-size:9px;font-weight:1000;color:#46566d;cursor:pointer}
.growth button.active{background:#fff7d5;border:2px solid var(--gold);padding:5px 6px}
.frameWrap{position:relative;min-height:0;background:#e7edf4}
#previewFrame{width:100%;height:100%;border:0;display:block;background:#eef2f6}
.overlay{position:absolute;left:12px;bottom:12px;z-index:20;background:rgba(23,34,56,.94);color:#fff;border:2px solid var(--gold);border-radius:13px;padding:9px 12px;max-width:360px;box-shadow:0 7px 22px rgba(0,0,0,.18);font-size:11px;line-height:1.5;pointer-events:none;opacity:0;transform:translateY(8px);transition:.2s}
.overlay.show{opacity:1;transform:none}
.overlay b{display:block;font-size:12px;margin-bottom:2px}
@media(max-width:900px){.top{grid-template-columns:1fr auto}.brand{grid-column:1}.steps{grid-column:1/3;grid-row:2;overflow:auto;justify-content:flex-start}.tools{grid-column:2;min-width:0}.badge{display:none}.frameWrap{min-height:0}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">世界遺産クエスト｜統合プレビュー<small>確定Labをつないだ体験確認版</small></div>
    <nav class="steps" aria-label="プレビュー画面">
      <button class="step active" data-stage="tutorial">1 チュートリアル</button>
      <button class="step" data-stage="map">2 日本全国マップ</button>
      <button class="step" data-stage="center">3 研究センター成長</button>
    </nav>
    <div class="tools">
      <div id="growth" class="growth" aria-label="研究センターレベル">
        <button data-level="1">?</button>
        <button data-level="2">LV2</button>
        <button data-level="3">LV3</button>
        <button data-level="4">LV4</button>
        <button id="backMap" class="backMap">全国へ戻る</button>
      </div>
      <div class="badge">INTEGRATED PREVIEW 1</div>
    </div>
  </header>
  <main class="frameWrap">
    <iframe id="previewFrame" title="世界遺産クエスト統合プレビュー"></iframe>
    <div id="overlay" class="overlay"></div>
  </main>
</div>
<script>
(function(){
'use strict';

const frame=document.getElementById('previewFrame');
const overlay=document.getElementById('overlay');
const growth=document.getElementById('growth');
const stepButtons=[...document.querySelectorAll('.step')];
const growthButtons=[...document.querySelectorAll('.growth [data-level]')];
const params=new URLSearchParams(location.search);

let stage=['tutorial','map','center'].includes(params.get('start'))?params.get('start'):'tutorial';
let centerLevel=Math.min(4,Math.max(1,Number(params.get('level'))||Number(sessionStorage.getItem('whqPreviewCenterLevel'))||1));
let playerName=sessionStorage.getItem('whqPreviewPlayerName')||'主人公';
let poll=null;

const src={
  tutorial:'tutorial-design-baseline.html?integratedPreview=1',
  map:'japan-follow-camera-lab.html?integratedPreview=1',
  center:'research-center-style-lab.html?integratedPreview=1'
};

function setOverlay(title,text,ms=3200){
  overlay.innerHTML=`<b>${title}</b>${text}`;
  overlay.classList.add('show');
  clearTimeout(setOverlay.t);
  setOverlay.t=setTimeout(()=>overlay.classList.remove('show'),ms);
}

function updateChrome(){
  stepButtons.forEach(b=>b.classList.toggle('active',b.dataset.stage===stage));
  growth.classList.toggle('show',stage==='center');
  growthButtons.forEach(b=>b.classList.toggle('active',Number(b.dataset.level)===centerLevel));
}

function stopPoll(){ if(poll){clearInterval(poll);poll=null;} }

function showStage(next){
  stopPoll();
  stage=next;
  updateChrome();
  frame.src=src[stage];
}

stepButtons.forEach(b=>b.onclick=()=>showStage(b.dataset.stage));
document.getElementById('backMap').onclick=()=>showStage('map');

growthButtons.forEach(b=>b.onclick=()=>{
  centerLevel=Number(b.dataset.level);
  sessionStorage.setItem('whqPreviewCenterLevel',String(centerLevel));
  updateChrome();
  patchCenter();
});

function tutorialDoc(){
  try{
    const outer=frame.contentDocument;
    const inner=outer?.getElementById('tutorialFrame');
    return inner?.contentDocument||null;
  }catch(e){return null}
}

function patchTutorial(){
  if(stage!=='tutorial')return;
  const doc=tutorialDoc();
  if(!doc)return;

  const story=[...doc.querySelectorAll('.storyCopy .copy')].find(el=>el.textContent.includes('アブ・シンベル神殿'));
  if(story&&!story.dataset.integratedTimeAxis){
    story.innerHTML='<strong>約3300年前</strong>に建てられた、エジプトの巨大な<strong>アブ・シンベル神殿</strong>。<br><br><strong>今から約60年前（1960年代）</strong>、ダムをつくることになって、この神殿が<strong>水の中にしずみそうになった！</strong>';
    story.dataset.integratedTimeAxis='1';
  }

  const input=doc.getElementById('name');
  if(input&&!input.dataset.integratedBridge){
    input.dataset.integratedBridge='1';
    input.addEventListener('input',()=>{
      playerName=input.value.trim()||'主人公';
      sessionStorage.setItem('whqPreviewPlayerName',playerName);
    });
  }

  doc.querySelectorAll('.skipNote').forEach(note=>{
    if(note.textContent.includes('Labでは')){
      note.textContent='日本全国を自由に移動できるよ。まずは北海道の知床を目指してみよう！';
    }
  });

  const finalLead=[...doc.querySelectorAll('.final div')].find(el=>el.textContent.trim()==='最初のエリアは……北海道！');
  if(finalLead)finalLead.textContent='まずは……北海道から調べてみよう！';

  const finish=[...doc.querySelectorAll('button.btn.primary')].find(btn=>btn.textContent.trim()==='北海道へ出発！'||btn.textContent.trim()==='全国マップへ出発！');
  if(finish&&!finish.dataset.integratedBridge){
    finish.dataset.integratedBridge='1';
    finish.textContent='全国マップへ出発！';
    finish.removeAttribute('onclick');
    finish.onclick=(e)=>{
      e.preventDefault();
      setOverlay('チュートリアル完了','4エリア切替ではなく、日本全国が1枚につながったマップへ移動します。');
      showStage('map');
    };
  }
}

function mapDoc(){try{return frame.contentDocument}catch(e){return null}}

function centerSprite(level){
  if(level===1)return '<span class="pcQ">?</span>';
  return `<span class="pcBuilding lv${level}"><i class="roof"></i><i class="body"><i class="door"></i><i class="win l"></i><i class="win r"></i></i>${level===4?'<i class="flag"></i>':''}</span>`;
}

function patchMap(){
  if(stage!=='map')return;
  const doc=mapDoc();
  if(!doc)return;
  if(!doc.getElementById('integratedPreviewMapStyle')){
    const s=doc.createElement('style');
    s.id='integratedPreviewMapStyle';
    s.textContent=`
      .marker.previewCenter{width:28px!important;height:28px!important;border:0!important;background:transparent!important;overflow:visible!important;cursor:pointer;display:grid;place-items:center}
      .pcQ{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #2f6c49;color:#2f6c49;display:grid;place-items:center;font:1000 11px/1 sans-serif;box-shadow:0 1px 2px #2346}
      .pcBuilding{position:relative;display:block;image-rendering:pixelated}
      .pcBuilding .body{position:absolute;left:50%;bottom:0;transform:translateX(-50%);background:#e5efe1;border:2px solid #3f4a5d}
      .pcBuilding .roof{position:absolute;left:50%;transform:translateX(-50%);background:#46536a;clip-path:polygon(12% 100%,27% 0,73% 0,88% 100%)}
      .pcBuilding .door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);background:#8ea8b8;border:1px solid #38465b}
      .pcBuilding .win{position:absolute;background:#b9dce8;border:1px solid #40516b}
      .pcBuilding.lv2{width:15px;height:14px}.pcBuilding.lv2 .body{width:12px;height:9px}.pcBuilding.lv2 .roof{width:15px;height:6px;bottom:9px}.pcBuilding.lv2 .door{width:4px;height:5px}.pcBuilding.lv2 .win{width:3px;height:3px;left:2px;bottom:3px}.pcBuilding.lv2 .win.r{left:auto;right:2px}
      .pcBuilding.lv3{width:21px;height:19px}.pcBuilding.lv3 .body{width:18px;height:12px}.pcBuilding.lv3 .roof{width:21px;height:7px;bottom:12px}.pcBuilding.lv3 .door{width:5px;height:7px}.pcBuilding.lv3 .win{width:4px;height:4px;left:2px;bottom:5px}.pcBuilding.lv3 .win.r{left:auto;right:2px}
      .pcBuilding.lv4{width:26px;height:24px}.pcBuilding.lv4 .body{width:23px;height:15px}.pcBuilding.lv4 .roof{width:26px;height:8px;bottom:15px}.pcBuilding.lv4 .door{width:6px;height:9px}.pcBuilding.lv4 .win{width:5px;height:5px;left:3px;bottom:6px}.pcBuilding.lv4 .win.r{left:auto;right:3px}
      .pcBuilding .flag{position:absolute;width:2px;height:14px;background:#46536a;right:0;top:-1px}.pcBuilding .flag:after{content:"";position:absolute;left:2px;top:0;width:8px;height:5px;background:#e3b53c;clip-path:polygon(0 0,100% 25%,0 100%)}
      .previewNear{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:60;background:#172238;color:#fff;border:2px solid #e3b53c;border-radius:12px;padding:8px 10px;font:900 11px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;box-shadow:0 5px 16px #0004;display:none;white-space:nowrap}
      .previewNear button{margin-left:8px;border:0;border-radius:8px;background:#fff;color:#26354b;padding:6px 9px;font-weight:1000}
    `;
    doc.head.appendChild(s);
  }

  let marker=doc.querySelector('[data-preview-shiretoko="1"]');
  if(!marker){
    marker=[...doc.querySelectorAll('.marker')].find(m=>m.textContent.trim()==='13');
    if(!marker)return;
    marker.dataset.previewShiretoko='1';
    marker.classList.add('previewCenter');
  }
  marker.innerHTML=centerSprite(centerLevel);
  marker.title=centerLevel===1?'知床｜未発見':`知床｜研究センター LV${centerLevel}`;
  marker.onclick=(e)=>{
    e.stopPropagation();
    if(centerLevel===1){
      centerLevel=2;
      sessionStorage.setItem('whqPreviewCenterLevel','2');
      setOverlay('知床を発見！','「？」が小さな研究拠点（LV2）に成長しました。');
    }
    showStage('center');
  };

  const view=doc.getElementById('view');
  const player=doc.getElementById('player');
  if(view&&player){
    let near=view.querySelector('.previewNear');
    if(!near){
      near=doc.createElement('div');
      near.className='previewNear';
      near.innerHTML='<span></span><button type="button">調べる</button>';
      view.appendChild(near);
      near.querySelector('button').onclick=()=>{
        if(centerLevel===1){
          centerLevel=2;
          sessionStorage.setItem('whqPreviewCenterLevel','2');
          setOverlay('知床を発見！','研究拠点LV2が開きました。');
        }
        showStage('center');
      };
    }
    const a=player.getBoundingClientRect(),b=marker.getBoundingClientRect();
    const dist=Math.hypot((a.left+a.width/2)-(b.left+b.width/2),(a.top+a.height/2)-(b.top+b.height/2));
    const vr=view.getBoundingClientRect();
    const visible=dist<58 && b.right>vr.left && b.left<vr.right && b.bottom>vr.top && b.top<vr.bottom;
    near.style.display=visible?'block':'none';
    near.querySelector('span').textContent=centerLevel===1?'「？」を発見！ 知床を調べる':`知床研究センター LV${centerLevel} に入る`;
  }
}

function patchCenter(){
  if(stage!=='center')return;
  let doc;
  try{doc=frame.contentDocument}catch(e){return}
  if(!doc)return;

  const select=doc.getElementById('siteSelect');
  if(select&&select.value!=='12'){
    select.value='12';
    select.dispatchEvent(new Event('change',{bubbles:true}));
  }

  const btn=doc.querySelector(`.levelBtn[data-level="${centerLevel}"]`);
  if(btn&&!btn.classList.contains('active'))btn.click();

  doc.querySelectorAll('.levelBtn').forEach(b=>{
    if(b.dataset.integratedSync)return;
    b.dataset.integratedSync='1';
    b.addEventListener('click',()=>{
      centerLevel=Number(b.dataset.level)||centerLevel;
      sessionStorage.setItem('whqPreviewCenterLevel',String(centerLevel));
      updateChrome();
    });
  });
}

frame.addEventListener('load',()=>{
  stopPoll();
  if(stage==='tutorial'){
    patchTutorial();
    poll=setInterval(patchTutorial,250);
  }else if(stage==='map'){
    setOverlay('日本全国マップ','主人公が中央付近の範囲を越えると地図が追従します。北海道〜沖縄まで1枚の地図で移動できます。',4200);
    patchMap();
    poll=setInterval(patchMap,180);
  }else{
    patchCenter();
    poll=setInterval(patchCenter,250);
  }
});

window.addEventListener('message',e=>{
  if(e.data?.type==='whqTutorialComplete'){
    if(e.data.playerName){
      playerName=e.data.playerName;
      sessionStorage.setItem('whqPreviewPlayerName',playerName);
    }
    showStage('map');
  }
});

updateChrome();
showStage(stage);
})();
</script>
</body>
</html>
