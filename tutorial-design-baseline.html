<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>世界遺産クエスト TUTORIAL DESIGN BASELINE 1</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#eef2f6;overflow:hidden}
#tutorialFrame{display:block;width:100%;height:100%;border:0;background:#eef2f6}
.baselineBadge{
  position:fixed;right:10px;top:10px;z-index:9999;
  background:#172238;color:#fff;border:2px solid #e3b53c;border-radius:999px;
  padding:7px 11px;font:900 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;
  box-shadow:0 4px 12px rgba(0,0,0,.18);pointer-events:none
}
</style>
<script src="piramiton-svg.js?v=baseline1"></script>
</head>
<body>
<div class="baselineBadge">TUTORIAL DESIGN BASELINE 1</div>
<iframe id="tutorialFrame" src="tutorial-lab.html?v=baseline1" title="世界遺産クエスト チュートリアル デザイン基準版"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('tutorialFrame');
let observer=null;

function installBaselineStyle(doc){
  if(doc.getElementById('tutorialBaselinePiramitonStyle'))return;
  const style=doc.createElement('style');
  style.id='tutorialBaselinePiramitonStyle';
  style.textContent=`
    .pyraminton{
      width:132px!important;
      height:120px!important;
      clip-path:none!important;
      background:none!important;
      background-image:none!important;
      display:grid!important;
      place-items:center!important;
      filter:drop-shadow(0 8px 0 rgba(0,0,0,.10))!important;
    }
    .pyraminton:after{content:none!important;display:none!important}
    .pyraminton svg{display:block;overflow:visible;max-width:100%;height:auto}
  `;
  doc.head.appendChild(style);
}

function makePiramiton(doc){
  if(typeof window.createPiramitonSVG!=='function')return null;
  const svg=window.createPiramitonSVG({
    size:120,
    expression:'normal',
    pose:'idle',
    animated:false
  });
  return doc.importNode(svg,true);
}

function patchPiramiton(){
  const doc=frame.contentDocument;
  if(!doc||typeof window.createPiramitonSVG!=='function')return;
  installBaselineStyle(doc);

  doc.querySelectorAll('.pyraminton').forEach(el=>{
    if(el.dataset.baselinePiramiton==='1')return;
    el.dataset.baselinePiramiton='1';
    el.innerHTML='';
    const svg=makePiramiton(doc);
    if(svg)el.appendChild(svg);
  });

  doc.querySelectorAll('.small').forEach(el=>{
    if(el.textContent.trim()==='ピラミトン（仮）')el.textContent='ピラミトン';
  });
}

frame.addEventListener('load',()=>{
  patchPiramiton();
  observer?.disconnect();
  const root=frame.contentDocument?.documentElement;
  if(root){
    observer=new MutationObserver(()=>patchPiramiton());
    observer.observe(root,{subtree:true,childList:true});
  }
});
})();
</script>
</body>
</html>
