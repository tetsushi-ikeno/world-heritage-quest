<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>世界遺産クエスト 登録基準支部 LAB 3</title>
<style>
:root{--ink:#1d2940;--muted:#68768b;--navy:#253149;--gold:#e3b53c;--bg:#eef2f6;--msg:#fff9e8;--culture:#c98a55;--nature:#5b956a;--shadow:0 12px 30px rgba(29,42,64,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button{font:inherit;touch-action:manipulation}.wrap{max-width:1120px;margin:auto;padding:12px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.brand{display:flex;align-items:center;gap:9px;font-weight:900}.mark{width:32px;height:28px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--gold)}.badge{font-size:11px;font-weight:900;color:#fff;background:var(--navy);border:2px solid var(--gold);border-radius:999px;padding:6px 10px}.game{min-height:700px;border:1px solid #bbc4d0;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:#fff}.scene{min-height:700px;padding:16px 20px 18px;display:flex;flex-direction:column;background:linear-gradient(#f1f3f5 0 76%,#d5d9de 76%)}.hud{display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:76px}.place{text-align:center;font-size:12px;font-weight:900;background:rgba(255,255,255,.86);border:1px solid rgba(188,198,210,.75);padding:7px 10px;border-radius:999px}.progress{display:grid;gap:6px;min-width:0}.progressTop{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:900;color:#667388}.track{height:7px;background:rgba(137,150,168,.23);border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#dba929,#efd06b);border-radius:999px;transition:width .25s}.parts{display:flex;align-items:center;justify-content:center;gap:5px;overflow:hidden}.part{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:900;color:#87909d;white-space:nowrap}.part .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#dce1e8;color:#687488}.part.active{color:#27364d}.part.active .n{background:var(--gold);color:#27364d}.part.done{color:#68778d}.part.done .n{background:#8296b0;color:#fff}.sep{width:12px;height:2px;background:#c9d0da}.restart{border:1px solid #bcc6d2;background:#fff;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:900;color:#3c4a60}.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:9px 0}.shell{width:min(970px,100%);height:540px;background:rgba(255,255,255,.97);border:1px solid #c6cfdb;border-radius:20px;box-shadow:var(--shadow);padding:20px;display:grid;grid-template-rows:minmax(0,1fr) 150px 58px;gap:12px;overflow:hidden}.visual{min-height:0;overflow:hidden;display:flex;align-items:stretch;justify-content:stretch}.message{height:150px;overflow:hidden;border-left:5px solid var(--gold);background:var(--msg);border-radius:0 13px 13px 0;padding:14px 16px;display:flex;flex-direction:column;justify-content:center}.speaker{font-weight:1000;color:#253754;margin-bottom:4px}.copy{font-size:18px;line-height:1.65;font-weight:700;margin:0}.copy strong{color:#233f70}.actions{height:58px;position:relative;border-top:1px solid #edf0f4;padding-top:9px}.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:1000;cursor:pointer;min-width:120px}.btn.primary{background:var(--navy);color:#fff;box-shadow:0 4px 0 #142036;position:absolute;right:0;top:9px}.btn.secondary{background:#fff;border:1px solid #bdc7d4;color:#344158;position:absolute;left:0;top:9px}.btn:active{transform:translateY(1px)}
.arrival{width:100%;height:100%;display:grid;grid-template-columns:1fr 220px;gap:24px;align-items:center}.facility{height:255px;border:2px solid #aeb9c7;border-radius:16px;background:linear-gradient(#eef1f3 0 72%,#d4d9df 72%);position:relative;overflow:hidden}.building{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:460px;max-width:84%;height:185px;background:#fafbfc;border:3px solid #98a5b5;box-shadow:0 14px 0 #b7bdc6;border-radius:9px 9px 2px 2px}.building:before{content:"世界遺産研究センター 北海道支部";position:absolute;left:50%;top:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:7px 14px;border-radius:5px;font-weight:1000;font-size:13px;white-space:nowrap}.door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:78px;height:100px;background:#b8c8d7;border:4px solid #8293a4}.win{position:absolute;top:68px;width:72px;height:50px;background:#cfe1eb;border:4px solid #8fa1b0}.w1{left:42px}.w2{right:42px}.pira{display:grid;place-items:center;min-height:180px}
.criteriaPage,.statsPage{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr;gap:10px;padding-top:4px}.pageTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px}.pageTitle h2{margin:0;font-size:23px;line-height:1.2}.typeChip{border-radius:999px;padding:6px 11px;font-size:12px;font-weight:1000;color:#fff;white-space:nowrap}.typeChip.culture{background:var(--culture)}.typeChip.nature{background:var(--nature)}.criteriaGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;align-content:center}.criterion{display:grid;grid-template-columns:43px 1fr;gap:9px;align-items:center;background:#f8fafc;border:1px solid #c9d2de;border-radius:13px;padding:8px 10px;min-height:72px}.criterion.culture{border-left:6px solid var(--culture)}.criterion.nature{border-left:6px solid var(--nature)}.criterionNum{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:#fff0bb;color:#44391c;font-size:18px;font-weight:1000}.criterionText b{display:block;font-size:14px;margin-bottom:2px}.criterionText small{display:block;font-size:11px;line-height:1.35;color:#647289}
.statsGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;align-content:center}.statRow{display:grid;grid-template-columns:minmax(145px,1.25fr) minmax(120px,1fr) 35px;gap:9px;align-items:center;background:#f8fafc;border:1px solid #d4dbe5;border-radius:11px;padding:11px 12px;min-height:66px}.statRow.culture{border-left:6px solid var(--culture)}.statRow.nature{border-left:6px solid var(--nature)}.statName{min-width:0}.statName b{display:block;font-size:14px;white-space:nowrap}.statName small{display:block;font-size:10.5px;color:#68768b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:12px;background:#e2e7ee;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#dba929,#efd06b);border-radius:999px}.statRow.nature .bar i{background:linear-gradient(90deg,#70a97a,#a9cf89)}.barCount{text-align:right;font-size:17px;font-weight:1000}.zero .bar i{width:0!important}
.quiz{width:min(780px,100%);margin:auto;display:grid;gap:14px;align-content:center}.qhead{display:flex;justify-content:space-between;align-items:center}.qhead h2{margin:0;font-size:25px}.qcount{font-size:12px;font-weight:1000;color:#6c788b}.question{font-size:21px;line-height:1.5;font-weight:1000;background:#f8fafc;border:1px solid #d1d9e4;border-radius:13px;padding:15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:1px solid #bcc8d7;background:#fff;border-radius:12px;min-height:54px;padding:11px 13px;text-align:left;font-size:16px;font-weight:900;color:#293a54}.choice.correct{background:#e2f1df;border-color:#83ac7b}.choice.wrong{background:#f4ddda;border-color:#c9948c}.choice:disabled{opacity:1}.feedback{font-weight:900;min-height:24px}.feedback.ok{color:#34703b}.feedback.ng{color:#9b463d}.clear{width:min(650px,100%);margin:auto;text-align:center;align-self:center}.clearMark{width:82px;height:82px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#5f9b5b;border:4px solid #dff0d8;color:#fff;font-size:43px;font-weight:1000}.clear h2{font-size:30px;margin:0 0 8px}.clear p{font-size:17px;line-height:1.6;font-weight:800;color:#4d5b6d}
@media(max-width:900px) and (orientation:landscape){.wrap{padding:7px}.game,.scene{min-height:650px}.scene{padding:10px 14px 12px}.hud{grid-template-columns:150px minmax(0,1fr) auto;min-height:62px}.shell{height:510px;padding:15px;grid-template-rows:minmax(0,1fr) 138px 54px}.message{height:138px;padding:10px 13px}.copy{font-size:16px}.criteriaGrid{gap:5px 7px}.criterion{min-height:65px;padding:6px 8px}.criterionText b{font-size:12px}.criterionText small{font-size:9.5px}.pageTitle h2{font-size:20px}.statRow{min-height:58px;padding:8px 9px;grid-template-columns:minmax(125px,1.2fr) minmax(95px,1fr) 30px}.statName b{font-size:12px}.statName small{font-size:9px}.actions{height:54px}.btn{padding:10px 17px}.arrival{grid-template-columns:1fr 170px}.pira svg{max-width:120px}}
</style>
<script src="piramiton-svg.js?v=criteria-lab3"></script>
</head>
<body>
<div class="wrap">
 <div class="topbar"><div class="brand"><span class="mark"></span><span>世界遺産クエスト</span></div><div class="badge">CRITERIA BRANCH LAB 3</div></div>
 <div class="game"><div class="scene">
  <div class="hud"><div class="place">北海道・登録基準支部</div><div class="progress"><div class="progressTop"><span>研究の進み具合</span><b id="progressText"></b></div><div class="track"><div id="fill" class="fill"></div></div><div id="parts" class="parts"></div></div><button id="restart" class="restart">最初から</button></div>
  <div class="stage"><div class="shell"><div id="visual" class="visual"></div><div id="message" class="message"></div><div id="actions" class="actions"></div></div></div>
 </div></div>
</div>
<script>
(function(){'use strict';
const criteria=[
 {n:1,icon:'🏛',title:'人類の創造力',note:'人が生み出した、特にすぐれた傑作',count:5,type:'culture'},
 {n:2,icon:'↔',title:'文化の交流',note:'建築や技術などを通じた文化や考え方の交流',count:13,type:'culture'},
 {n:3,icon:'🗿',title:'文化・文明の証言',note:'ある文化や文明を今に伝える大切な証拠',count:10,type:'culture'},
 {n:4,icon:'⚙',title:'歴史を伝える建築・技術',note:'歴史の大切な時代を伝える建物や技術',count:12,type:'culture'},
 {n:5,icon:'🏘',title:'伝統的な暮らし・土地利用',note:'人々の伝統的な暮らしや土地との関わり',count:3,type:'culture'},
 {n:6,icon:'🎨',title:'出来事・思想・信仰・芸術',note:'大切な出来事、考え方、信仰、芸術などとの結びつき',count:10,type:'culture'},
 {n:7,icon:'🏔',title:'すばらしい自然景観',note:'とても美しい自然や、すばらしい自然現象',count:1,type:'nature'},
 {n:8,icon:'🪨',title:'地球の歴史・地形',note:'地球の歴史や地形のでき方を伝えている',count:0,type:'nature'},
 {n:9,icon:'🌿',title:'生態系のしくみ',note:'生きものと環境が関わりながら変化・発展していくしくみ',count:4,type:'nature'},
 {n:10,icon:'🐾',title:'生物多様性・生息地',note:'さまざまな生きものを守るために大切な場所',count:2,type:'nature'}
];
const quiz=[
 {q:'文化遺産の価値を見る登録基準は、どのグループ？',choices:['基準1〜6','基準7〜10','基準1〜4','基準5〜10'],answer:0,explain:'基準1〜6は、建築・文化・暮らしなど、文化遺産の価値を見る基準だよ。'},
 {q:'自然遺産の価値を見る登録基準は、どのグループ？',choices:['基準1〜4','基準3〜6','基準7〜10','基準9〜10だけ'],answer:2,explain:'基準7〜10は、景観・地球の歴史・生態系・生きものなど、自然遺産の価値を見る基準だよ。'},
 {q:'基準9「生態系のしくみ」が見ているのは、どんなこと？',choices:['地球の歴史や地形のでき方','生きものと環境が関わりながら変化・発展していくこと','自然の景色がとても美しいこと','文化や技術が交流したこと'],answer:1,explain:'基準9は、生きものと環境が関わりながら変化・発展していく「生態系のしくみ」を見る基準だよ。'}
];
const steps=['到着','文化基準','自然基準','文化の例','自然の例','チェック','CLEAR'];
let step=0,qIndex=0,correct=0,answered=false,lastAnswer=-1;
const visual=document.getElementById('visual'),message=document.getElementById('message'),actions=document.getElementById('actions');
function pira(size=120,pose='idle'){return window.createPiramitonSVG?window.createPiramitonSVG({size,expression:'normal',pose,animated:false}):document.createTextNode('△')}
function setMessage(html){message.innerHTML='<div class="speaker">ピラミトン</div><p class="copy">'+html+'</p>'}
function button(label,kind,fn){const b=document.createElement('button');b.type='button';b.className='btn '+kind;b.textContent=label;b.addEventListener('click',fn);return b}
function nav(back,nextLabel,nextStep){actions.replaceChildren();if(back)actions.appendChild(button('もどる','secondary',()=>{step=Math.max(0,step-1);render()}));actions.appendChild(button(nextLabel,'primary',()=>{step=nextStep;render()}))}
function progress(){document.getElementById('progressText').textContent=`${step+1} / ${steps.length}`;document.getElementById('fill').style.width=`${step===0?0:(step/(steps.length-1))*100}%`;const box=document.getElementById('parts');box.replaceChildren();steps.forEach((s,i)=>{if(i){const sep=document.createElement('i');sep.className='sep';box.appendChild(sep)}const d=document.createElement('div');d.className='part '+(i<step?'done':i===step?'active':'');d.innerHTML=`<span class="n">${i+1}</span><span>${s}</span>`;box.appendChild(d)})}
function arrival(){const a=document.createElement('div');a.className='arrival';a.innerHTML='<div class="facility"><div class="building"><i class="door"></i><i class="win w1"></i><i class="win w2"></i></div></div><div class="pira"></div>';visual.appendChild(a);a.querySelector('.pira').appendChild(pira(130,'wave'));setMessage('ここは<strong>登録基準支部</strong>。世界遺産には、「なぜ世界的に大切なのか」を判断するための<strong>10個の登録基準</strong>があるよ。<br>10個は、<strong>文化遺産を見る1〜6</strong>と、<strong>自然遺産を見る7〜10</strong>に分かれているんだ。');nav(false,'文化遺産の基準を見る',1)}
function criteriaScreen(type){const list=criteria.filter(c=>c.type===type),culture=type==='culture';const wrap=document.createElement('div');wrap.className='criteriaPage';wrap.innerHTML=`<div class="pageTitle"><h2>${culture?'文化遺産':'自然遺産'}の登録基準</h2><span class="typeChip ${type}">${culture?'基準1〜6・6基準':'基準7〜10・4基準'}</span></div><div class="criteriaGrid"></div>`;const grid=wrap.querySelector('.criteriaGrid');list.forEach(c=>{const d=document.createElement('div');d.className='criterion '+type;d.innerHTML=`<div class="criterionNum">${c.n}</div><div class="criterionText"><b>${c.icon} ${c.title}</b><small>${c.note}</small></div>`;grid.appendChild(d)});visual.appendChild(wrap);if(culture){setMessage('基準<strong>1〜6</strong>は文化遺産の価値を見るものさし。建築、文化の交流、人々の暮らしや信仰など、<strong>人が生み出してきたもの</strong>に注目するよ。全部を今すぐ覚えなくても大丈夫！');nav(true,'自然遺産の基準を見る',2)}else{setMessage('基準<strong>7〜10</strong>は自然遺産の価値を見るものさし。美しい自然、地球の歴史、生態系、生きものの多様性に注目するよ。<strong>ここ北海道エリアの世界遺産について、どのような基準で選ばれたのかもチェックしてみてね。</strong>');nav(true,'文化遺産の日本の例を見る',3)}}
function statsScreen(type){const list=criteria.filter(c=>c.type===type),culture=type==='culture';const max=Math.max(...list.map(c=>c.count));const wrap=document.createElement('div');wrap.className='statsPage';wrap.innerHTML=`<div class="pageTitle"><h2>日本の世界遺産：${culture?'文化遺産':'自然遺産'}の基準</h2><span class="typeChip ${type}">${culture?'基準1〜6':'基準7〜10'}</span></div><div class="statsGrid"></div>`;const grid=wrap.querySelector('.statsGrid');list.forEach(c=>{const d=document.createElement('div');d.className=`statRow ${type}${c.count===0?' zero':''}`;d.innerHTML=`<div class="statName"><b>基準${c.n}　${c.title}</b><small>${c.note}</small></div><div class="bar"><i style="width:${c.count===0?0:c.count/max*100}%"></i></div><b class="barCount">${c.count}</b>`;grid.appendChild(d)});visual.appendChild(wrap);if(culture){setMessage('文化遺産の基準では、認められている件数にかなり違いがあるね。<strong>基準の名前と一緒に見ると、何を評価している基準なのか思い出しやすいよ。</strong>');nav(true,'自然遺産の日本の例を見る',4)}else{setMessage('自然遺産の基準も、認められている数はそれぞれ違うよ。<strong>件数そのものを覚えるより、「どんな価値を見る基準なのか」をつかんでおこう。</strong>');nav(true,'チェックに挑戦',5)}}
function quizScreen(){const q=quiz[qIndex];const wrap=document.createElement('div');wrap.className='quiz';wrap.innerHTML=`<div class="qhead"><h2>登録基準チェック</h2><span class="qcount">${qIndex+1} / ${quiz.length}</span></div><div class="question">${q.q}</div><div class="choices"></div><div class="feedback"></div>`;const choices=wrap.querySelector('.choices');q.choices.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=c;b.disabled=answered;if(answered&&i===q.answer)b.classList.add('correct');if(answered&&i===lastAnswer&&i!==q.answer)b.classList.add('wrong');b.addEventListener('click',()=>answer(i));choices.appendChild(b)});visual.appendChild(wrap);setMessage(answered?'<strong>'+q.explain+'</strong>':'3問のチェックに挑戦しよう。<strong>2問以上正解でCLEAR！</strong> ここまで見てきたことを思い出してね。');actions.replaceChildren();if(!answered&&qIndex===0)actions.appendChild(button('もどる','secondary',()=>{step=4;render()}));if(answered)actions.appendChild(button(qIndex<quiz.length-1?'つぎの問題':'結果を見る','primary',()=>{if(qIndex<quiz.length-1){qIndex++;answered=false;lastAnswer=-1;render()}else{step=6;render()}}));const fb=wrap.querySelector('.feedback');if(answered){fb.className='feedback '+(lastAnswer===q.answer?'ok':'ng');fb.textContent=lastAnswer===q.answer?'正解！':'おしい！'}}
function answer(i){if(answered)return;lastAnswer=i;answered=true;if(i===quiz[qIndex].answer)correct++;render()}
function clearScreen(){const passed=correct>=2;const div=document.createElement('div');div.className='clear';div.innerHTML=`<div class="clearMark">${passed?'✓':'!'}</div><h2>${passed?'登録基準支部 CLEAR！':'あと少し！'}</h2><p>3問中 ${correct}問正解。<br>${passed?'これで世界遺産を調べる準備ができた！':'研究資料をもう一度見れば、きっと大丈夫！'}</p>`;visual.appendChild(div);setMessage(passed?'準備OK！ 北海道エリアを旅しながら、<strong>見つけた世界遺産がどのような基準で選ばれたのか</strong>もチェックしてみてね。':'今回はあと少し。登録基準をもう一度見てから、また挑戦してみよう！');actions.replaceChildren();actions.appendChild(button(passed?'北海道へ出発（Labでは最初へ）':'もう一度見る','primary',reset))}
function render(){progress();visual.replaceChildren();actions.replaceChildren();if(step===0)arrival();else if(step===1)criteriaScreen('culture');else if(step===2)criteriaScreen('nature');else if(step===3)statsScreen('culture');else if(step===4)statsScreen('nature');else if(step===5)quizScreen();else clearScreen()}
function reset(){step=0;qIndex=0;correct=0;answered=false;lastAnswer=-1;render()}
document.getElementById('restart').addEventListener('click',reset);render();
})();
</script>
</body>
</html>
