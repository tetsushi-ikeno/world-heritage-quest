<body>
<div class="page">
 <div class="top"><div class="brand"><span class="mark"></span><span>世界遺産クエスト</span></div><div class="labBadge">RESEARCH CENTER STYLE LAB 1</div></div>
 <p class="lead">遺産ごとの建物は作り分けず、<b>自然遺産／文化遺産の2タイプ＋象徴アイコン</b>だけで個性を出す案を検証します。遺産と施設レベルを切り替えて、マップと研究センター内の成長を比較してください。</p>
 <div class="layout">
  <aside class="sidebar">
   <h2>日本の世界遺産 27件</h2>
   <div class="filters"><button class="filter active" data-filter="all">すべて</button><button class="filter" data-filter="cultural">文化</button><button class="filter" data-filter="natural">自然</button></div>
   <input id="search" class="search" type="search" placeholder="遺産名で検索">
   <div id="siteList" class="siteList"></div>
  </aside>
  <main id="main" class="main natural">
   <section>
    <div class="selectedHead"><div id="heroGlyph" class="heroGlyph"></div><div><h1 id="siteTitle"></h1><p id="siteSub"></p></div><div id="typePill" class="typePill"></div></div>
    <div id="candidateRow" class="candidateRow" style="margin-top:8px"></div>
   </section>
   <div id="stageBar" class="stageBar"></div>
   <div class="workspace">
    <section class="card">
     <div class="cardTitle"><h3>マップ上の研究センター</h3><small>4段階を比較・タップで選択</small></div>
     <div id="mapCompare" class="mapCompare"></div>
     <div class="footerNote">？を発見するとまず小屋が現れ、調査を深めるほど同じ場所の施設が発展する想定です。</div>
    </section>
    <section class="card roomWrap">
     <div class="cardTitle"><h3>施設内の見た目</h3><small id="roomStageText"></small></div>
     <div id="room" class="room level1">
      <div class="backLine"></div><div id="frame" class="frame"></div><div class="exhibit"><div class="exhibitVisual"></div><div class="exhibitBase"></div></div><div class="bookStand"></div>
      <div class="shelf s1"><div class="books"></div></div><div class="shelf s2"><div class="books"></div></div><div class="desk"></div>
      <div class="researcher r1"><i class="head"></i><i class="body"></i></div><div class="researcher r2"><i class="head"></i><i class="body"></i></div><div class="researcher r3"><i class="head"></i><i class="body"></i></div>
      <div class="board"></div><div class="plant">🌿</div><div class="artifact">🏺</div><div class="master">MASTER RESEARCH CENTER</div>
     </div>
     <div><div class="roomNote"><div id="growthTags" class="growthTags"></div><b id="levelLabel"></b></div><div id="miniRooms" class="miniRooms"></div></div>
    </section>
   </div>
  </main>
 </div>
</div>

 {name:'北海道・北東北の縄文遺跡群',short:'北海道・北東北の縄文遺跡群',type:'cultural',candidates:[['🗿','土偶'],['🏺','縄文土器']]},
 {name:'佐渡島の金山',short:'佐渡島の金山',type:'cultural',candidates:[['⛰️','道遊の割戸'],['⛏️','金山の坑道']]},
 {name:'飛鳥・藤原の宮都',short:'飛鳥・藤原の宮都',type:'cultural',candidates:[['🪨','石舞台古墳'],['宮','宮殿・都城跡']]}
];
const levels=[
 {name:'LEVEL 1',title:'仮設研究小屋',desc:'発見直後',tags:['中央展示','本1冊','最低限の設備']},
 {name:'LEVEL 2',title:'小さな研究所',desc:'基本調査CLEAR',tags:['本棚追加','調査員が来る','資料机追加']},
 {name:'LEVEL 3',title:'研究センター',desc:'追加調査CLEAR',tags:['本棚が充実','調査員2人','調査記録・追加展示']},
 {name:'LEVEL 4',title:'完成研究施設',desc:'MASTER',tags:['研究員3人','充実した資料','完成施設の演出']}
];
let selected=12,level=1,candidate=0,filter='all';
const $=s=>document.querySelector(s),main=$('#main');
function typeLabel(t){return t==='natural'?'自然遺産':'文化遺産'}
function renderList(){const q=$('#search').value.trim().toLowerCase();const list=$('#siteList');list.innerHTML='';sites.forEach((s,i)=>{if(filter!=='all'&&s.type!==filter)return;if(q&&!s.name.toLowerCase().includes(q)&&!s.short.toLowerCase().includes(q))return;const b=document.createElement('button');b.className='siteBtn'+(i===selected?' active':'');b.innerHTML=`<span class="siteGlyph">${s.candidates[0][0]}</span><span class="siteName">${s.short}</span><span class="siteType ${s.type}">${s.type==='natural'?'自然':'文化'}</span>`;b.onclick=()=>{selected=i;candidate=0;renderAll()};list.appendChild(b)})}
function renderHead(){const s=sites[selected],c=s.candidates[candidate];main.className='main '+s.type;$('#heroGlyph').textContent=c[0];$('#siteTitle').textContent=s.name;$('#siteSub').textContent=`${typeLabel(s.type)}｜象徴は建物本体ではなく、額・看板・展示のワンポイントとして使用`;$('#typePill').textContent=typeLabel(s.type);const row=$('#candidateRow');row.innerHTML='<span class="candidateLabel">象徴アイコン候補：</span>';s.candidates.forEach((x,i)=>{const b=document.createElement('button');b.className='candidate'+(i===candidate?' active':'');b.textContent=`${x[0]} ${x[1]}`;b.onclick=()=>{candidate=i;renderHead();renderMap();renderRoom()};row.appendChild(b)})}
function renderStageBar(){const box=$('#stageBar');box.innerHTML='';levels.forEach((l,i)=>{const n=i+1,b=document.createElement('button');b.className='stageBtn'+(n===level?' active':'');b.innerHTML=`<b>${l.name}｜${l.title}</b><span>${l.desc}</span>`;b.onclick=()=>{level=n;renderStageBar();renderMap();renderRoom()};box.appendChild(b)})}
function buildingHTML(n,glyph){return `<div class="building b${n}"><span class="roof"></span><span class="door"></span><span class="win l"></span><span class="win r"></span><span class="sign">研究</span><span class="emblem">${glyph}</span><span class="flag"></span></div>`}
function renderMap(){const s=sites[selected],glyph=s.candidates[candidate][0],box=$('#mapCompare');box.innerHTML='';levels.forEach((l,i)=>{const n=i+1,d=document.createElement('div');d.className='mapStage'+(n===level?' active':'');d.innerHTML=`<div class="mapLabel"><b>${n}. ${l.title}</b><span>${l.desc}</span></div><div class="mapTile"><span class="path"></span>${buildingHTML(n,glyph)}</div>`;d.onclick=()=>{level=n;renderStageBar();renderMap();renderRoom()};box.appendChild(d)})}
function renderRoom(){const s=sites[selected],glyph=s.candidates[candidate][0],l=levels[level-1],room=$('#room');room.className='room level'+level;$('#frame').textContent=glyph;$('#roomStageText').textContent=`${l.name}｜${l.desc}`;$('#levelLabel').textContent=l.title;const tags=$('#growthTags');tags.innerHTML='';l.tags.forEach(x=>{const t=document.createElement('span');t.className='growthTag';t.textContent=x;tags.appendChild(t)});const minis=$('#miniRooms');minis.innerHTML='';levels.forEach((x,i)=>{const n=i+1,d=document.createElement('button');d.className='mini'+(n===level?' active':'');d.innerHTML=`<div class="miniScene" style="--lv:${n}"></div>${n}. ${x.title}`;d.onclick=()=>{level=n;renderStageBar();renderMap();renderRoom()};minis.appendChild(d)})}
function renderAll(){renderList();renderHead();renderStageBar();renderMap();renderRoom()}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderList()});$('#search').addEventListener('input',renderList);renderAll();
})();
</script>
</body>
</html>
