<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>世界遺産クエスト チュートリアル</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#eef2f6;overflow-x:hidden}
#tutorialFrame{display:block;width:100%;height:780px;border:0;background:#eef2f6}
@media(max-width:760px){#tutorialFrame{height:820px}}
</style>
</head>
<body>
<iframe id="tutorialFrame" src="tutorial-lab.html" title="世界遺産クエスト チュートリアル"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('tutorialFrame');
const embedded=new URLSearchParams(location.search).get('embedded')==='1';
let playerName='';
let observer=null;

function patchApprovedTutorial(){
  const doc=frame.contentDocument;
  if(!doc) return;

  // Approved Lab baseline is left untouched. Only the requested time-axis copy is patched here.
  const story=[...doc.querySelectorAll('.storyCopy .copy')].find(el=>el.textContent.includes('アブ・シンベル神殿'));
  if(story && !story.dataset.timeAxisApproved){
    story.innerHTML='<strong>約3300年前</strong>に建てられた、エジプトの巨大な<strong>アブ・シンベル神殿</strong>。<br><br><strong>今から約60年前（1960年代）</strong>、ダムをつくることになって、この神殿が<strong>水の中にしずみそうになった！</strong>';
    story.dataset.timeAxisApproved='1';
  }

  const input=doc.getElementById('nameInput');
  if(input && !input.dataset.tutorialBridge){
    input.dataset.tutorialBridge='1';
    const remember=()=>{playerName=input.value.trim();};
    input.addEventListener('input',remember);
    input.addEventListener('change',remember);
  }

  if(!embedded) return;

  // The production tutorial must not show the Lab-only note.
  doc.querySelectorAll('.skipNote').forEach(note=>{
    if(note.textContent.includes('Labでは')) note.style.display='none';
  });

  const finish=[...doc.querySelectorAll('button.btn.primary')].find(btn=>btn.textContent.trim()==='北海道へ出発！');
  if(finish && !finish.dataset.tutorialBridge){
    finish.dataset.tutorialBridge='1';
    finish.removeAttribute('onclick');
    finish.onclick=function(event){
      event.preventDefault();
      window.parent.postMessage({type:'whqTutorialComplete',playerName},location.origin);
    };
  }
}

frame.addEventListener('load',()=>{
  patchApprovedTutorial();
  observer?.disconnect();
  const root=frame.contentDocument?.documentElement;
  if(root){
    observer=new MutationObserver(patchApprovedTutorial);
    observer.observe(root,{subtree:true,childList:true});
  }
});
})();
</script>
</body>
</html>
