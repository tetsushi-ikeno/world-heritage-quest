<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Phase 9 移動画面 UI LAB</title>
<style>
:root{--ink:#21324a;--panel:rgba(255,255,255,.94);--line:#bdcad8;--accent:#e5b83f;--dark:#172238}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#63a7cd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:var(--ink);user-select:none}
#mapFrame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#63a7cd}
.ui{position:absolute;inset:0;pointer-events:none;z-index:20}
.location{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));width:190px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px;box-shadow:0 5px 18px rgba(21,42,70,.20)}
.location .place{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.location b{font-size:15px}.location small{font-size:10px;color:#66778b;font-weight:800}
.mini{height:132px;border-radius:10px;background:#dcecf5;border:1px solid #aebfcd;overflow:hidden;position:relative}
.mini svg{width:100%;height:100%;display:block}.mini .you{fill:#cf493f;stroke:#fff;stroke-width:2}.mini .view{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:4 3}.miniLabel{font-size:10px;color:#607085;margin-top:5px;font-weight:800;text-align:center}
.topActions{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}.topActions button,.actionBtn{border:1px solid #aebdcc;background:var(--panel);color:#2a3a51;border-radius:12px;min-height:48px;padding:0 14px;font-weight:900;font-size:13px;box-shadow:0 4px 14px rgba(21,42,70,.18)}
.topActions button{min-width:98px}.topActions .menu{min-width:52px;font-size:22px;padding:0 10px}
.actionWrap{position:absolute;right:max(30px,env(safe-area-inset-right));bottom:190px;pointer-events:auto;text-align:center}.actionBtn{width:112px;height:60px;border:2px solid var(--accent);background:var(--dark);color:#fff;font-size:15px}.actionHint{display:block;font-size:10px;font-weight:800;margin-top:5px;color:#203048;background:rgba(255,255,255,.82);border-radius:999px;padding:3px 7px}
.toast{position:absolute;left:50%;bottom:22px;transform:translate(-50%,15px);min-width:320px;max-width:60%;background:rgba(23,34,56,.96);color:#fff;border:2px solid var(--accent);border-radius:14px;padding:11px 18px;text-align:center;font-size:13px;font-weight:800;opacity:0;transition:.18s;box-shadow:0 7px 22px rgba(0,0,0,.28)}.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet{position:absolute;right:16px;top:74px;width:300px;max-height:62vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 10px 28px rgba(20,40,66,.30);display:none;pointer-events:auto}.sheet.show{display:block}.sheet h2{font-size:17px;margin:0 0 8px}.sheet p{font-size:12px;line-height:1.7;margin:6px 0;color:#53657b}.sheet button{width:100%;margin-top:8px;border:0;border-radius:9px;background:#263950;color:#fff;padding:9px;font-weight:900}
.labNote{position:absolute;left:14px;bottom:14px;font-size:10px;background:rgba(255,255,255,.78);padding:5px 8px;border-radius:8px;color:#52657b}
@media(max-width:900px){.location{width:172px}.mini{height:118px}.topActions button{min-width:84px;padding:0 10px}.actionWrap{right:23px;bottom:174px}.actionBtn{width:104px;height:56px}.toast{max-width:70%;min-width:290px}}
</style>
</head>
<body>
<iframe id="mapFrame" src="area-map-lab.html" title="日本全国マップ"></iframe>
<div class="ui">
  <section class="location" aria-label="現在地とミニマップ">
    <div class="place"><b>近畿地方</b><small>現在地</small></div>
    <div class="mini">
      <svg viewBox="0 0 180 132" role="img" aria-label="日本全国ミニマップ">
        <rect width="180" height="132" fill="#8dc7e2"/>
        <g fill="#78ad5c" stroke="#5f9149" stroke-width="1.4">
          <path d="M139 14l14 4 9 11-5 14-13 8-14-5-6-11 5-14z"/>
          <path d="M130 48l-8 5-7 10-8 8-9 8-10 7-12 6-13 3-12 7-13 1-11 7 6 5 14-4 13-1 11-7 14-3 11-7 11-7 9-9 8-10 7-8 8-4z"/>
          <path d="M56 103l-13 6-12-1-4 6 9 5 13-3 10-8z"/>
          <path d="M70 102l-8 4 3 6 12 1 8-5-3-6z"/>
          <path d="M23 116l-7 5 5 4 9-4z"/>
        </g>
        <rect class="view" x="66" y="68" width="43" height="34" rx="4"/>
        <circle class="you" cx="88" cy="87" r="5"/>
      </svg>
    </div>
    <div class="miniLabel">赤い点＝じぶん　白枠＝今見えている範囲</div>
  </section>

  <nav class="topActions" aria-label="ゲームメニュー">
    <button id="bookBtn" type="button">遺産の書</button>
    <button id="menuBtn" class="menu" type="button" aria-label="メニュー">☰</button>
  </nav>

  <div class="actionWrap">
    <button id="actionBtn" class="actionBtn" type="button">しらべる</button>
    <span class="actionHint">近くに何かあると使える</span>
  </div>

  <div id="toast" class="toast">なにか気になるものがある！</div>
  <div class="labNote">PHASE 9 UI LAB｜右手操作・左上ミニマップ</div>

  <aside id="bookSheet" class="sheet">
    <h2>遺産の書</h2>
    <p>移動画面では入口だけを置く想定です。図鑑そのもののレイアウトは別Labで検討します。</p>
    <button type="button" data-close>閉じる</button>
  </aside>
  <aside id="menuSheet" class="sheet">
    <h2>メニュー</h2>
    <p>設定やゲーム全体の機能はここへまとめ、移動画面の常時表示を増やしすぎない想定です。</p>
    <button type="button" data-close>閉じる</button>
  </aside>
</div>
<script>
(()=>{'use strict';
const frame=document.getElementById('mapFrame');
const toast=document.getElementById('toast');
const book=document.getElementById('bookSheet');
const menu=document.getElementById('menuSheet');
let toastTimer=null;
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1900)}
function closeSheets(){book.classList.remove('show');menu.classList.remove('show')}
document.getElementById('bookBtn').addEventListener('click',()=>{menu.classList.remove('show');book.classList.toggle('show')});
document.getElementById('menuBtn').addEventListener('click',()=>{book.classList.remove('show');menu.classList.toggle('show')});
document.getElementById('actionBtn').addEventListener('click',()=>showToast('なにか気になるものがある！'));
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeSheets));
function patchMap(){
  let doc;try{doc=frame.contentDocument}catch(e){return}if(!doc?.head||!doc.body)return;
  if(doc.getElementById('phase9MoveStyle'))return;
  const style=doc.createElement('style');style.id='phase9MoveStyle';style.textContent=`
    html,body{height:100%!important;overflow:hidden!important;background:var(--sea)!important}
    .wrap{max-width:none!important;width:100%!important;height:100%!important;padding:0!important;margin:0!important}
    .head,.controls,.cameraMode,.status,.jumpTitle,.jumpGrid{display:none!important}
    .layout{display:block!important;height:100%!important}.panel{border:0!important;border-radius:0!important;box-shadow:none!important;padding:0!important}
    .mapPanel{position:relative!important;display:block!important;height:100%!important;background:transparent!important}
    .camera{height:100%!important;min-height:0!important;border:0!important;border-radius:0!important}
    .side{position:absolute!important;right:max(18px,env(safe-area-inset-right))!important;bottom:max(18px,env(safe-area-inset-bottom))!important;z-index:100!important;display:block!important;width:auto!important;background:transparent!important;border:0!important;padding:0!important;pointer-events:auto!important}
    .joy{width:154px!important;height:154px!important;margin:0!important;box-shadow:0 5px 18px rgba(13,30,53,.30)!important}.knob{width:62px!important;height:62px!important}
    @media(max-width:900px){.joy{width:140px!important;height:140px!important}.knob{width:58px!important;height:58px!important}}
  `;doc.head.appendChild(style);
}
frame.addEventListener('load',()=>{patchMap();setTimeout(patchMap,250)});
})();
</script>
</body>
</html>
