<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>世界遺産クエスト BETA 3</title><style>:root{--ink:#1d2940;--navy:#172238;--gold:#e3b53c;--bg:#e8eef4;--line:#c3ceda}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:var(--ink)}button{font:inherit;touch-action:manipulation}.app{position:relative;width:100%;height:100%}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}.frame.show{display:block}#centerFrame{z-index:20}.title{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#dcecf5 0 56%,#87b56d 56%);padding:24px;z-index:40}.title.hide{display:none}.panel{width:min(620px,92vw);background:#fffffff5;border:2px solid var(--line);border-radius:24px;padding:32px;text-align:center;box-shadow:0 18px 46px #1a2b4238}.mark{width:70px;height:58px;margin:0 auto 12px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--gold)}.eyebrow{font-size:11px;font-weight:1000;letter-spacing:.12em;color:#7a611c}.panel h1{font-size:clamp(30px,5vw,54px);margin:7px 0 6px}.beta{display:inline-block;background:var(--navy);color:#fff;border:2px solid var(--gold);border-radius:999px;padding:5px 10px;font-size:10px;font-weight:1000}.lead{font-size:13px;line-height:1.6;font-weight:800;color:#607086;margin:15px auto;max-width:430px}.start{min-width:220px;min-height:58px;border:2px solid var(--gold);border-radius:14px;background:var(--navy);color:#fff;font-size:17px;font-weight:1000;box-shadow:0 5px 0 #0d1727}.saved{margin-top:12px;font-size:10px;color:#718095;font-weight:850}.revision{position:fixed;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:9999;padding:5px 8px;border-radius:999px;background:#172238e8;border:1px solid #e3b53ce6;color:#fff;font-size:10px;font-weight:900;pointer-events:none}.transition{position:fixed;inset:0;z-index:5000;background:#5f9fc6;display:none;place-items:center;color:#fff;font-size:13px;font-weight:1000}.transition.show{display:grid}</style></head><body><div class="app"><iframe id="gameFrame" class="frame" title="世界遺産クエスト"></iframe><iframe id="centerFrame" class="frame" title="研究センター"></iframe><section id="titleScreen" class="title"><div class="panel"><div class="mark"></div><div class="eyebrow">WORLD HERITAGE QUEST</div><h1>世界遺産クエスト</h1><span class="beta">BETA 3</span><p id="lead" class="lead">センター探索と腕試しを磨いたテスト版です。</p><button id="startBtn" class="start">はじめる</button><div id="savedInfo" class="saved"></div></div></section></div><div class="revision">BETA 3 / Vertical Slice</div><div id="transition" class="transition">全国マップへ戻っています…</div><script src="beta-save.js?v=beta3"></script><script>(()=>{'use strict';const game=document.getElementById('gameFrame'),center=document.getElementById('centerFrame'),title=document.getElementById('titleScreen'),start=document.getElementById('startBtn'),lead=document.getElementById('lead'),saved=document.getElementById('savedInfo'),transition=document.getElementById('transition');let stage='title',tutorialPoll=null,mapLoaded=false,returning=false;function state(){return WHQBetaSave.load()}function titleMode(){const s=state();if(s.tutorialComplete){start.textContent='つづきから';lead.textContent='Beta3では姫路城・白川郷/五箇山・屋久島のセンターを重点的に作り込んでいます。';saved.textContent=s.playerName?`${s.playerName}　／　発見 ${s.discovered.length} / 27`:`発見 ${s.discovered.length} / 27`}else{start.textContent='はじめる';saved.textContent=s.playerName?'チュートリアルから再開します':''}}function showTutorial(){stage='tutorial';title.classList.add('hide');center.classList.remove('show');game.classList.add('show');game.src='tutorial-lab-final.html?beta=3';mapLoaded=false}function showMap(fromCenter=false){stage='map';clearInterval(tutorialPoll);title.classList.add('hide');if(fromCenter){returning=true;transition.classList.add('show')}center.classList.remove('show');game.classList.add('show');if(!mapLoaded){game.src='area-map-beta2-wrapper.html?beta3=1&nocache='+Date.now();mapLoaded=true}else setTimeout(()=>game.contentWindow?.postMessage({type:'whqRefreshMap'},'*'),20)}function showCenter(){stage='center';title.classList.add('hide');game.classList.remove('show');center.classList.add('show');center.src='research-center-beta3.html?nocache='+Date.now()}function tutorialDoc(){try{return game.contentDocument?.getElementById('tutorialFrame')?.contentDocument||null}catch(_){return null}}function patchTutorial(){if(stage!=='tutorial')return;const d=tutorialDoc();if(!d)return;const input=d.getElementById('name'),ok=d.getElementById('nameOk');if(input&&!input.dataset.b3){input.dataset.b3='1';const s=state();if(s.playerName)input.value=s.playerName}if(ok&&!ok.dataset.b3){ok.dataset.b3='1';ok.addEventListener('click',()=>{WHQBetaSave.update(s=>{s.playerName=input?.value.trim()||'主人公';return s})},{capture:true})}const finish=[...d.querySelectorAll('button.btn.primary')].find(b=>['北海道へ出発！','全国マップへ出発！'].includes(b.textContent.trim()));if(finish&&!finish.dataset.b3){finish.dataset.b3='1';finish.removeAttribute('onclick');finish.addEventListener('click',e=>{e.preventDefault();WHQBetaSave.update(s=>{s.tutorialComplete=true;return s});showMap()})}}start.onclick=()=>state().tutorialComplete?showMap():showTutorial();game.addEventListener('load',()=>{if(stage==='tutorial'){patchTutorial();tutorialPoll=setInterval(patchTutorial,180)}});window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='whqOpenCenter')showCenter();else if(d.type==='whqExitCenter')showMap(true);else if(d.type==='whqMapReady'&&returning){returning=false;setTimeout(()=>transition.classList.remove('show'),80)}else if(d.type==='whqResetBeta'){WHQBetaSave.reset();location.reload()}});titleMode();})();</script></body></html>
