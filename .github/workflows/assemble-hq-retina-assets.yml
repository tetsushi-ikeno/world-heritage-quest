name: Assemble HQ retina assets

on:
  push:
    branches: [main]
    paths:
      - 'docs/assets/heritage-graphics/staging/_ready'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reassemble high quality WebP assets
        run: |
          mkdir -p docs/assets/heritage-graphics/approved
          cat docs/assets/heritage-graphics/staging/shiretoko.part* | base64 -d > docs/assets/heritage-graphics/approved/shiretoko.webp
          cat docs/assets/heritage-graphics/staging/jomon.part* | base64 -d > docs/assets/heritage-graphics/approved/jomon.webp
          test "$(stat -c%s docs/assets/heritage-graphics/approved/shiretoko.webp)" -gt 60000
          test "$(stat -c%s docs/assets/heritage-graphics/approved/jomon.webp)" -gt 35000
          echo "1ef35b12e2a1fd2ff86decde0b0266a0fcaa34d830523f2217bf37964213561a  docs/assets/heritage-graphics/approved/shiretoko.webp" | sha256sum -c -
          echo "a9ba1dc4afa76fd713e093b088b6ec89d812ed3103f00a4cd818dc91631bafc2  docs/assets/heritage-graphics/approved/jomon.webp" | sha256sum -c -
          file docs/assets/heritage-graphics/approved/shiretoko.webp
          file docs/assets/heritage-graphics/approved/jomon.webp

      - name: Commit rebuilt assets
        run: |
          rm -rf docs/assets/heritage-graphics/staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/heritage-graphics/approved/shiretoko.webp docs/assets/heritage-graphics/approved/jomon.webp docs/assets/heritage-graphics/staging
          git commit -m "Replace Hokkaido graphics with retina assets"
          git pull --rebase origin main
          git push origin HEAD:main
