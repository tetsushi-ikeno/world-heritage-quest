name: Apply Beta2 feedback fixes branch

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-beta2-feedback-fixes-v2.mjs'
      - '.github/workflows/apply-beta2-feedback-fixes-branch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'beta2-feedback-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta2-feedback-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-beta2-feedback-fixes-v2.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-center-beta2.html area-map-beta-loader.html japan-map-beta-loader.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Beta2 navigation and discovery UI"
          git push origin HEAD:beta2-feedback-fix
