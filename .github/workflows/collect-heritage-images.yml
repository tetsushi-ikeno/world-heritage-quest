name: Collect heritage images

# Licensed-photo collection writes generated assets back to main.
# Run it only when intentionally refreshing the image set; do not run on ordinary PRs.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: batch1
            sites: horyuji,himeji,yakushima,shirakami,kyoto
          - id: batch2
            sites: shirakawago,hiroshima,itsukushima,nara,nikko
          - id: batch3
            sites: ryukyu,kii,iwami,ogasawara,hiraizumi
          - id: batch4
            sites: fujisan,tomioka,meiji-industrial,le-corbusier,okinoshima
          - id: batch5
            sites: hidden-christian,mozu-furuichi,amami-okinawa,jomon,sado
          - id: batch6
            sites: asuka-fujiwara,shiretoko
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect licensed photos for ${{ matrix.id }}
        env:
          HERITAGE_BATCH_ID: ${{ matrix.id }}
          HERITAGE_SITE_IDS: ${{ matrix.sites }}
        run: node scripts/collect-heritage-images-batch.mjs

      - name: Stage only this batch
        env:
          HERITAGE_BATCH_ID: ${{ matrix.id }}
          HERITAGE_SITE_IDS: ${{ matrix.sites }}
        run: |
          rm -rf heritage-output
          mkdir -p heritage-output/docs/assets/heritage heritage-output/data
          IFS=',' read -ra IDS <<< "$HERITAGE_SITE_IDS"
          for id in "${IDS[@]}"; do
            mkdir -p "heritage-output/docs/assets/heritage/$id"
            cp -R "docs/assets/heritage/$id/." "heritage-output/docs/assets/heritage/$id/"
          done
          cp "data/heritage-images-${HERITAGE_BATCH_ID}.json" heritage-output/data/

      - name: Upload batch
        uses: actions/upload-artifact@v4
        with:
          name: heritage-${{ matrix.id }}
          path: heritage-output
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download all batches
        uses: actions/download-artifact@v4
        with:
          pattern: heritage-batch*
          path: .
          merge-multiple: true

      - name: Merge metadata and credits
        run: node scripts/merge-heritage-image-metadata.mjs

      - name: Final quality curation
        run: node scripts/finalize-heritage-image-curation.mjs

      - name: Commit 81 photos and credits to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/heritage data/heritage-images.json docs/heritage-image-credits.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add 81 curated Wikimedia Commons heritage photos [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
