name: Collect heritage images

on:
  push:
    branches: [main]
    paths:
      - scripts/collect-heritage-images.mjs
      - .github/workflows/collect-heritage-images.yml
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect three photos for each Japanese World Heritage site
        run: node scripts/collect-heritage-images.mjs

      - name: Commit generated photos and credits to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/heritage data/heritage-images.json docs/heritage-image-credits.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add curated Wikimedia Commons heritage photos [skip ci]"
          git push origin HEAD:main
