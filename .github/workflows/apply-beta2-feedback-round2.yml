name: Apply Beta2 feedback round2
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-beta2-feedback-round2.mjs'
      - '.github/workflows/apply-beta2-feedback-round2.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'beta2-feedback-round2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta2-feedback-round2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-beta2-feedback-round2.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-center-beta2.html area-map-beta-loader.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Beta2 center controls and branch modal lock"
          git push origin HEAD:beta2-feedback-round2
