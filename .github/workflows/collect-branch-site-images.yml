name: Collect Beta2 branch site images

on:
  push:
    paths:
      - '.github/workflows/collect-branch-site-images.yml'
      - 'scripts/collect-branch-site-images.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect curated Wikimedia Commons photos
        run: node scripts/collect-branch-site-images.mjs

      - name: Commit photos and credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/branch-sites data/branch-site-images.json docs/branch-site-image-credits.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add 19 curated Beta2 branch site photos [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
