name: Apply Beta2 feedback fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-beta2-feedback-fixes.mjs'
      - '.github/workflows/apply-beta2-feedback-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply fixes
        run: node scripts/apply-beta2-feedback-fixes.mjs
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-center-beta2.html area-map-beta-loader.html japan-map-beta-loader.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix Beta2 navigation and discovery UI [skip ci]"
          git push origin HEAD:main
