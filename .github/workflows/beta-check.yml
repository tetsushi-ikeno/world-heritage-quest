name: Beta static check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'beta3.html'
      - 'beta-save.js'
      - 'tutorial.html'
      - 'tutorial-lab-final.html'
      - 'tutorial-lab.html'
      - 'piramiton-expr.js'
      - 'world-map.html'
      - 'world-map-runtime.js'
      - 'area-map-beta2-wrapper.html'
      - 'area-map-beta-loader.html'
      - 'area-map-game.html'
      - 'japan-map-runtime.html'
      - 'japan-map-beta-loader.html'
      - 'japan-map-r05-wrapper.html'
      - 'japan-6x-map-lab.html'
      - 'piramiton-svg.js'
      - 'beta2-r05-map-hotfix.js'
      - 'research-center-beta3.html'
      - 'research-center.css'
      - 'research-center-theme.css'
      - 'beta2-center-theme.css'
      - 'beta2-center-theme-r04.css'
      - 'beta2-center-theme-r05.css'
      - 'beta3-center-overrides.css'
      - 'beta3-center-overrides-base-r20260902-01.css'
      - 'beta3-center-approved-graphics.css'
      - 'heritage-image-credits.html'
      - 'data/beta-heritage-content.json'
      - 'data/beta3-vertical-slice.json'
      - 'data/branch-sites.json'
      - 'data/branch-quiz-data.json'
      - 'data/heritage-images.json'
      - 'docs/CURRENT.md'
      - 'docs/assets/heritage/**'
      - 'docs/assets/branch-sites/**'
      - 'docs/assets/heritage-graphics/approved/**'
      - 'scripts/validate-entry.mjs'
      - 'scripts/validate-canonical-runtime.mjs'
      - 'scripts/validate-center-css.mjs'
      - 'scripts/validate-beta.mjs'
      - '.github/workflows/beta-check.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Pages entry
        run: node scripts/validate-entry.mjs
      - name: Validate canonical Beta3 entries
        run: node scripts/validate-canonical-runtime.mjs
      - name: Validate research center CSS entry
        run: node scripts/validate-center-css.mjs
      - name: Validate Beta3 data and runtime syntax
        run: node scripts/validate-beta.mjs
