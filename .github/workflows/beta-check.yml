name: Beta static check

on:
  push:
    branches: [main]
    paths:
      - 'beta.html'
      - 'beta-save.js'
      - 'area-map-game.html'
      - 'research-center-game.html'
      - 'data/beta-heritage-content.json'
      - 'data/heritage-images.json'
      - 'docs/assets/heritage/**'
      - 'scripts/validate-beta.mjs'
      - '.github/workflows/beta-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate beta data and runtime syntax
        run: node scripts/validate-beta.mjs
