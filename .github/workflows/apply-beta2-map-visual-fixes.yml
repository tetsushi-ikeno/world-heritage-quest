name: Apply Beta2 map visual fixes
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-beta2-map-visual-fixes.mjs'
      - '.github/workflows/apply-beta2-map-visual-fixes.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'beta2-map-visual-fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta2-map-visual-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-beta2-map-visual-fixes.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add japan-map-beta-loader.html area-map-beta-loader.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve Beta2 map visuals and land placement"
          git push origin HEAD:beta2-map-visual-fixes
