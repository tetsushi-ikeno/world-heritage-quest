<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ピラミトン本部 レイアウトLab</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#17130f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:#fff}
header{height:54px;background:#4a3427;border-bottom:2px solid #d8b66a;display:flex;align-items:center;gap:10px;padding:0 12px;position:relative;z-index:20}
header b{font-size:17px}.sub{font-size:12px;opacity:.86}.rev{margin-left:auto;border:1px solid #d8b66a;border-radius:999px;padding:5px 8px;font-size:10px}
.viewport{position:absolute;left:0;right:0;top:54px;bottom:0;overflow:hidden;background:#1d1712;touch-action:none}
.world{position:absolute;width:1320px;height:1650px;left:0;top:0;transform-origin:0 0}
.hub{position:absolute;left:460px;top:600px;width:400px;height:180px;background:#b87d47;border:18px solid #68462e;box-shadow:inset 0 0 0 7px #3f2a1d;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:22px;color:#f6e0a5}
.area{position:absolute;background:#c58d55;border:18px solid #68462e;box-shadow:inset 0 0 0 7px #3f2a1d}.area h2{position:absolute;left:50%;top:16px;transform:translateX(-50%);margin:0;background:#4b3427;border:2px solid #d1ab60;border-radius:999px;padding:6px 16px;color:#f5df9d;font-size:15px;white-space:nowrap}
.a1{left:460px;top:40px;width:400px;height:420px}.a2{left:30px;top:470px;width:390px;height:820px}.a3{left:900px;top:350px;width:390px;height:950px}.a4{left:460px;top:970px;width:400px;height:560px}
.connector{position:absolute;background:#d9b278;border:8px solid #8b633f}.c1{left:600px;top:460px;width:120px;height:140px}.c2{left:420px;top:665px;width:40px;height:90px}.c3{left:860px;top:665px;width:40px;height:90px}.c4{left:600px;top:780px;width:120px;height:190px}
.sign{position:absolute;width:145px;min-height:78px;background:#ecd9a9;color:#50361f;border:5px solid #76502e;border-radius:4px;box-shadow:0 5px 6px #38231655;padding:9px 8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:900;line-height:1.25}
.sign:after{content:"";position:absolute;left:50%;bottom:-30px;width:8px;height:30px;background:#76502e;transform:translateX(-50%)}
.player{position:absolute;width:44px;height:56px;z-index:12;filter:drop-shadow(0 4px 3px #0006)}
.player .head{width:30px;height:28px;border-radius:45% 45% 38% 38%;background:#473126;border:3px solid #21160f;margin:auto}
.player .body{width:32px;height:28px;background:#3e76ac;border:3px solid #21160f;border-radius:5px;margin:-2px auto 0}
.minimap{position:absolute;right:10px;top:10px;width:104px;height:136px;background:#201812dd;border:1px solid #d8b66a;border-radius:10px;z-index:30;padding:5px}
.miniWorld{position:relative;width:92px;height:124px;background:#bd8753}.m{position:absolute;border:2px solid #68462e;background:#c9955e}.m1{left:34px;top:4px;width:28px;height:30px}.m2{left:3px;top:35px;width:28px;height:60px}.m3{right:3px;top:28px;width:28px;height:68px}.m4{left:34px;bottom:3px;width:28px;height:38px}.miniP{position:absolute;width:6px;height:6px;border-radius:50%;background:#58a7e0;border:1px solid #fff;transform:translate(-50%,-50%)}
.pad{position:absolute;right:18px;bottom:18px;width:126px;height:126px;z-index:40}.pad button{position:absolute;width:42px;height:42px;border-radius:50%;border:2px solid #d8b66a;background:#2b211bcc;color:#fff;font-size:20px;font-weight:900}.up{left:42px;top:0}.down{left:42px;bottom:0}.left{left:0;top:42px}.right{right:0;top:42px}
.help{position:absolute;left:10px;bottom:10px;z-index:30;background:#201812d9;border:1px solid #8b6a45;border-radius:9px;padding:7px 9px;font-size:10px;line-height:1.45;max-width:220px}
</style></head><body>
<header><b>▲ ピラミトン本部 レイアウトLab</b><span class="sub">4エリア構成・立て札のみ</span><span class="rev">LAB / r20260830-03</span></header>
<div class="viewport" id="vp"><div class="world" id="world">
<div class="area a1" id="a1"><h2>北海道エリア</h2></div><div class="area a2" id="a2"><h2>東日本エリア</h2></div><div class="area a3" id="a3"><h2>西日本エリア</h2></div><div class="area a4" id="a4"><h2>九州・沖縄エリア</h2></div>
<div class="connector c1"></div><div class="connector c2"></div><div class="connector c3"></div><div class="connector c4"></div>
<div class="hub">ピラミトン本部<br>中央ホール</div>
<div class="player" id="player"><div class="head"></div><div class="body"></div></div>
</div>
<div class="minimap"><div class="miniWorld"><div class="m m1"></div><div class="m m2"></div><div class="m m3"></div><div class="m m4"></div><div class="miniP" id="miniP"></div></div></div>
<div class="pad"><button class="up" data-dx="0" data-dy="-1">▲</button><button class="down" data-dx="0" data-dy="1">▼</button><button class="left" data-dx="-1" data-dy="0">◀</button><button class="right" data-dx="1" data-dy="0">▶</button></div>
<div class="help">グラフィックは一切表示せず、配置予定位置を立て札で確認します。</div>
</div>
<script>
const groups=[{"title":"北海道エリア","items":["知床","北海道・北東北の縄文遺跡群"]},{"title":"東日本エリア","items":["白神山地","平泉","日光の社寺","富岡製糸場と絹産業遺産群","富士山―信仰の対象と芸術の源泉","ル・コルビュジエの建築作品（国立西洋美術館）","佐渡島の金山","飛鳥・藤原の宮都"]},{"title":"西日本エリア","items":["法隆寺地域の仏教建造物","姫路城","古都京都の文化財","白川郷・五箇山の合掌造り集落","原爆ドーム","厳島神社","古都奈良の文化財","紀伊山地の霊場と参詣道","石見銀山遺跡とその文化的景観","百舌鳥・古市古墳群","明治日本の産業革命遺産","「神宿る島」宗像・沖ノ島と関連遺産群","長崎と天草地方の潜伏キリシタン関連遺産"]},{"title":"九州・沖縄エリア","items":["屋久島","琉球王国のグスク及び関連遺産群","奄美大島、徳之島、沖縄島北部及び西表島","小笠原諸島"]}];
const configs=[
 {id:'a1',cols:2,startX:45,startY:95,gapX:165,gapY:145},
 {id:'a2',cols:2,startX:32,startY:95,gapX:170,gapY:145},
 {id:'a3',cols:2,startX:32,startY:95,gapX:170,gapY:145},
 {id:'a4',cols:2,startX:42,startY:95,gapX:165,gapY:145}
];
groups.forEach((g,gi)=>{const host=document.getElementById(configs[gi].id),cfg=configs[gi];g.items.forEach((name,i)=>{const s=document.createElement('div');s.className='sign';s.style.left=(cfg.startX+(i%cfg.cols)*cfg.gapX)+'px';s.style.top=(cfg.startY+Math.floor(i/cfg.cols)*cfg.gapY)+'px';s.textContent=name;host.appendChild(s)})});
const vp=document.getElementById('vp'),world=document.getElementById('world'),player=document.getElementById('player'),mini=document.getElementById('miniP');
let px=660,py=690,camX=0,camY=0;const speed=12;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function render(){player.style.left=(px-22)+'px';player.style.top=(py-28)+'px';const vw=vp.clientWidth,vh=vp.clientHeight;camX=clamp(vw/2-px,vw-1320,0);camY=clamp(vh/2-py,vh-1650,0);world.style.transform='translate('+camX+'px,'+camY+'px)';mini.style.left=(px/1320*92)+'px';mini.style.top=(py/1650*124)+'px'}
function move(dx,dy){px=clamp(px+dx*speed,35,1285);py=clamp(py+dy*speed,35,1615);render()}
let timer=null;document.querySelectorAll('.pad button').forEach(b=>{const dx=+b.dataset.dx,dy=+b.dataset.dy;const start=e=>{e.preventDefault();move(dx,dy);timer=setInterval(()=>move(dx,dy),55)};const end=()=>{clearInterval(timer);timer=null};b.addEventListener('pointerdown',start);b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);b.addEventListener('pointerleave',end)});
let drag=null;vp.addEventListener('pointerdown',e=>{if(e.target.closest('.pad'))return;drag={x:e.clientX,y:e.clientY,px,py};vp.setPointerCapture(e.pointerId)});vp.addEventListener('pointermove',e=>{if(!drag)return;px=clamp(drag.px-(e.clientX-drag.x),35,1285);py=clamp(drag.py-(e.clientY-drag.y),35,1615);render()});vp.addEventListener('pointerup',()=>drag=null);vp.addEventListener('pointercancel',()=>drag=null);window.addEventListener('resize',render);render();
</script></body></html>
