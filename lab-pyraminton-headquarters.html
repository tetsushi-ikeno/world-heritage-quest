<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ピラミトン本部 レイアウトLab</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#17130f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:#fff}
header{height:54px;background:#4a3427;border-bottom:2px solid #d8b66a;display:flex;align-items:center;gap:10px;padding:0 12px;position:relative;z-index:20}
header b{font-size:17px}.sub{font-size:12px;opacity:.86}.rev{margin-left:auto;border:1px solid #d8b66a;border-radius:999px;padding:5px 8px;font-size:10px}
.viewport{position:absolute;left:0;right:0;top:54px;bottom:0;overflow:hidden;background:#1d1712;touch-action:none}
.world{position:absolute;width:1040px;height:2080px;left:0;top:0;transform-origin:0 0}
.gallery{position:absolute;left:40px;width:960px;height:610px;background:#c58d55;border:18px solid #68462e;box-shadow:inset 0 0 0 7px #3f2a1d}
.gallery.g1{top:40px}.gallery.g2{top:735px}.gallery.g3{top:1430px}
.gallery:before,.gallery:after{content:"";position:absolute;left:65px;right:65px;height:18px;background:#80583b;border:4px solid #543824;z-index:1}
.gallery:before{top:168px}.gallery:after{bottom:168px}
.title{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:#4b3427;color:#f5df9d;border:2px solid #d1ab60;border-radius:999px;padding:6px 18px;font-weight:900;font-size:15px}
.display{position:absolute;width:156px;height:132px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.frame{width:126px;height:84px;border:5px solid #f7f0e3;background:#ddd2c3;box-shadow:0 5px 8px #4a2c1a55;display:grid;place-items:center;color:#6b5b4e;font-size:11px;font-weight:900;text-align:center;padding:6px}
.plaque{margin-top:6px;width:146px;min-height:34px;background:#4b3427;border-radius:7px;padding:5px 5px;text-align:center;font-size:10px;line-height:1.18;font-weight:800;display:flex;align-items:center;justify-content:center}
.sign{position:absolute;right:-2px;top:7px;background:#f1dfad;color:#5a3c25;border:3px solid #7a5434;border-radius:3px;padding:3px 5px;font-size:8px;font-weight:900;transform:rotate(-4deg)}
.corridor{position:absolute;left:430px;width:180px;background:#d9b278;border-left:8px solid #8b633f;border-right:8px solid #8b633f;top:650px;height:85px}
.corridor.c2{top:1345px}
.player{position:absolute;width:44px;height:56px;z-index:12;filter:drop-shadow(0 4px 3px #0006)}
.player .head{width:30px;height:28px;border-radius:45% 45% 38% 38%;background:#473126;border:3px solid #21160f;margin:auto}
.player .body{width:32px;height:28px;background:#3e76ac;border:3px solid #21160f;border-radius:5px;margin:-2px auto 0}
.hq{position:absolute;left:420px;top:10px;width:200px;height:80px;background:#6c4930;border:5px solid #40291c;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;color:#ffe7a3}
.minimap{position:absolute;right:10px;top:10px;width:92px;height:150px;background:#201812dd;border:1px solid #d8b66a;border-radius:10px;z-index:30;padding:5px}
.miniWorld{position:relative;width:80px;height:136px;background:#bd8753}.miniG{position:absolute;left:5px;width:70px;height:38px;border:3px solid #68462e}.miniG.a{top:3px}.miniG.b{top:49px}.miniG.c{top:95px}.miniP{position:absolute;width:6px;height:6px;border-radius:50%;background:#58a7e0;border:1px solid #fff;transform:translate(-50%,-50%)}
.pad{position:absolute;right:18px;bottom:18px;width:126px;height:126px;z-index:40}
.pad button{position:absolute;width:42px;height:42px;border-radius:50%;border:2px solid #d8b66a;background:#2b211bcc;color:#fff;font-size:20px;font-weight:900}.up{left:42px;top:0}.down{left:42px;bottom:0}.left{left:0;top:42px}.right{right:0;top:42px}
.help{position:absolute;left:10px;bottom:10px;z-index:30;background:#201812d9;border:1px solid #8b6a45;border-radius:9px;padding:7px 9px;font-size:10px;line-height:1.45;max-width:220px}
@media (orientation:landscape) and (max-height:600px){header{height:46px}.viewport{top:46px}.pad{width:110px;height:110px}.pad button{width:38px;height:38px}.up,.down{left:36px}.left,.right{top:36px}}
</style></head><body>
<header><b>▲ ピラミトン本部 レイアウトLab</b><span class="sub">展示グラフィックは別管理</span><span class="rev">LAB / r20260830-02</span></header>
<div class="viewport" id="vp">
 <div class="world" id="world">
  <div class="hq">ピラミトン本部<br>全国腕試しホール</div>
  <div class="gallery g1"><div class="title">第1展示室</div></div>
  <div class="corridor"></div>
  <div class="gallery g2"><div class="title">第2展示室</div></div>
  <div class="corridor c2"></div>
  <div class="gallery g3"><div class="title">第3展示室</div></div>
  <div class="player" id="player"><div class="head"></div><div class="body"></div></div>
 </div>
 <div class="minimap"><div class="miniWorld"><div class="miniG a"></div><div class="miniG b"></div><div class="miniG c"></div><div class="miniP" id="miniP"></div></div></div>
 <div class="pad"><button class="up" data-dx="0" data-dy="-1">▲</button><button class="down" data-dx="0" data-dy="1">▼</button><button class="left" data-dx="-1" data-dy="0">◀</button><button class="right" data-dx="1" data-dy="0">▶</button></div>
 <div class="help">スマホ対応：十字操作／画面ドラッグで移動確認。<br>グラフィックはすべて仮枠のみ。</div>
</div>
<script>
const names=["法隆寺地域","姫路城","屋久島","白神山地","古都京都","白川郷・五箇山","原爆ドーム","厳島神社","古都奈良","日光の社寺","琉球王国のグスク","紀伊山地","知床","石見銀山","小笠原諸島","平泉","富士山","富岡製糸場","明治日本の産業革命遺産","ル・コルビュジエ","宗像・沖ノ島","潜伏キリシタン","百舌鳥・古市古墳群","奄美・徳之島・沖縄島北部・西表島","縄文遺跡群","佐渡島の金山","飛鳥・藤原の宮都"];
const galleries=[document.querySelector('.g1'),document.querySelector('.g2'),document.querySelector('.g3')];
function makeDisplay(name,index,localIndex){
 const el=document.createElement('div');el.className='display';
 // 5 on top wall, 4 on bottom wall = center-like wall displays + central walking aisle
 const top=localIndex<5;
 const slot=top?localIndex:localIndex-5;
 const x=top?70+slot*170:155+slot*185;
 const y=top?62:390;
 el.style.left=x+'px';el.style.top=y+'px';
 el.innerHTML='<div class="frame">展示グラフィック枠<br>No.'+(index+1)+'</div><div class="plaque">'+name+'</div>';
 galleries[Math.floor(index/9)].appendChild(el);
}
names.forEach(makeDisplay);
const world=document.getElementById('world'),player=document.getElementById('player'),vp=document.getElementById('vp'),mini=document.getElementById('miniP');
let px=520,py=340; let camX=0,camY=0; const speed=12;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function render(){
 player.style.left=(px-22)+'px';player.style.top=(py-28)+'px';
 const vw=vp.clientWidth,vh=vp.clientHeight;
 camX=clamp(vw/2-px, vw-1040, 0);
 camY=clamp(vh/2-py, vh-2080, 0);
 world.style.transform='translate('+camX+'px,'+camY+'px)';
 mini.style.left=(px/1040*80)+'px';mini.style.top=(py/2080*136)+'px';
}
function move(dx,dy){px=clamp(px+dx*speed,55,985);py=clamp(py+dy*speed,60,2020);render()}
let timer=null;
document.querySelectorAll('.pad button').forEach(b=>{
 const dx=+b.dataset.dx,dy=+b.dataset.dy;
 const start=e=>{e.preventDefault();move(dx,dy);timer=setInterval(()=>move(dx,dy),55)};
 const end=()=>{clearInterval(timer);timer=null};
 b.addEventListener('pointerdown',start);b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);b.addEventListener('pointerleave',end);
});
window.addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(m){e.preventDefault();move(...m)}})
let drag=null;
vp.addEventListener('pointerdown',e=>{if(e.target.closest('.pad'))return;drag={x:e.clientX,y:e.clientY,px,py};vp.setPointerCapture(e.pointerId)});
vp.addEventListener('pointermove',e=>{if(!drag)return;px=clamp(drag.px-(e.clientX-drag.x),55,985);py=clamp(drag.py-(e.clientY-drag.y),60,2020);render()});
vp.addEventListener('pointerup',()=>drag=null);vp.addEventListener('pointercancel',()=>drag=null);
window.addEventListener('resize',render);render();
</script></body></html>
