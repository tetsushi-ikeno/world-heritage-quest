<style>
*{box-sizing:border-box}html,body{margin:0;background:#17130f;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;color:#fff;overflow:hidden}
header{height:52px;background:#4a3427;border-bottom:2px solid #d8b66a;display:flex;align-items:center;padding:0 14px;gap:10px}header b{font-size:18px}.rev{margin-left:auto;background:#2c211a;border:1px solid #d8b66a;border-radius:20px;padding:5px 9px;font-size:11px}

.badge{position:absolute;top:3px;right:4px;border-radius:99px;padding:3px 6px;font-size:9px;font-weight:900;background:#2d7552}.unconfirmed .badge{background:#8b4b45}
.center{position:absolute;top:358px;left:640px;width:480px;height:60px;background:#6a4429;border:4px solid #3c281d;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#f6e5ad;box-shadow:0 6px 8px #4a2d1e55}
.player{position:absolute;left:855px;top:735px;width:48px;height:65px}.head{width:32px;height:30px;background:#493225;border-radius:45% 45% 35% 35%;margin:auto;border:3px solid #21150f}.body{width:34px;height:32px;background:#3b75aa;margin:-2px auto 0;border:3px solid #21150f;border-radius:5px}.legend{position:fixed;right:14px;bottom:14px;background:#201710e8;border:1px solid #d8b66a;border-radius:12px;padding:9px 11px;font-size:11px;line-height:1.5;z-index:5}
</style></head><body><header><b>▲ ピラミトン本部 Lab</b><span>27遺産 展示ホール</span><span class="rev">LAB / r20260830-01</span></header><div class="viewport"><div class="hall">

<script>
const sites=[["法隆寺地域","horyuji","confirmed","docs/assets/heritage-exhibits/cultural/horyuji.svg"],["姫路城","himeji","confirmed","docs/assets/heritage-exhibits/cultural/himeji-castle.svg"],["屋久島","yakushima","unconfirmed",""],["白神山地","shirakami","unconfirmed",""],["古都京都（金閣寺）","kinkakuji","confirmed","approved-cultural/kyoto.html"],["白川郷・五箇山","gassho","confirmed","approved-cultural/shirakawago.html"],["原爆ドーム","hiroshima","confirmed","approved-cultural/hiroshima.html"],["厳島神社","itsukushima","confirmed","docs/assets/heritage-exhibits/cultural/itsukushima-shrine.svg"],["古都奈良（東大寺大仏）","todai","confirmed","approved-cultural/nara.html"],["日光の社寺（陽明門）","nikko","confirmed","approved-cultural/nikko.html"],["琉球王国のグスク","ryukyu","unconfirmed",""],["紀伊山地","kii","unconfirmed",""],["知床","shiretoko","unconfirmed",""],["石見銀山","iwami","unconfirmed",""],["小笠原諸島","ogasawara","unconfirmed",""],["平泉","hiraizumi","unconfirmed",""],["富士山","fujisan","unconfirmed",""],["富岡製糸場","tomioka","unconfirmed",""],["明治日本の産業革命遺産","meiji","unconfirmed",""],["ル・コルビュジエ","corbusier","unconfirmed",""],["宗像・沖ノ島","okinoshima","unconfirmed",""],["潜伏キリシタン","christian","unconfirmed",""],["百舌鳥・古市古墳群","mozu","unconfirmed",""],["奄美・徳之島・沖縄島北部・西表島","amami","unconfirmed",""],["縄文遺跡群","jomon","unconfirmed",""],["佐渡島の金山","sado","unconfirmed",""],["飛鳥・藤原の宮都","asuka","unconfirmed",""]];
function approvedArt(s){
 const p=s[3];
 if(!p)return '';
 if(p.endsWith('.svg'))return '<img src="'+p+'">';
 // confirmed raster crops are shown through the approved source page until individual PNG paths are wired.
 const map={kinkakuji:'approved-cultural/kyoto.html',gassho:'approved-cultural/shirakawago.html',hiroshima:'approved-cultural/hiroshima.html',todai:'approved-cultural/nara.html',nikko:'approved-cultural/nikko.html'};
 return '<iframe src="'+map[s[1]]+'" style="width:100%;height:155px;border:0;pointer-events:none;background:transparent;transform:scale(.98)" scrolling="no"></iframe>';
}
sites.forEach((s,i)=>{const el=document.createElement('div');el.className='ex '+s[2];const ok=s[2]==='confirmed';el.innerHTML='<span class="badge">'+(ok?'確定':'未確定')+'</span><div class="art">'+(ok?approvedArt(s):'<div class="sign"><b>未確定</b><small>GRAPHIC TBD</small></div>')+'</div><div class="plaque">'+s[0]+'</div>';document.getElementById('r'+(Math.floor(i/9)+1)).appendChild(el)});
